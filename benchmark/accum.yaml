---
# yamllint disable rule:line-length
# The λ functions the accumulator cases of the benchmark fire over
# 'benchmark/accum.phi', the loop of #1453. Every entry answers symbolically,
# 'gt' with a fork the 'L_fork' entry joins, so the loop never learns where it
# stops and '--acyclic=plausible' is what cuts it, after the same twenty-six
# firings however many methods 'number' declares.
- λ: L_bytes_size
  dataize:
    𝛿1: $.ρ
  𝑛: Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ ) )
- λ: L_number_plus
  dataize:
    𝛿1: $.ρ
    𝛿2: $.b
  𝑛: Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ ) )
- λ: L_bytes_concat
  dataize:
    𝛿1: $.ρ
    𝛿2: $.b
  𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
- λ: L_number_gt
  dataize:
    𝛿1: $.ρ
    𝛿2: $.b
  𝑛: Φ.bool( if ↦ ⟦ λ ⤍ L_fork, left ↦ ∅, right ↦ ∅, φ ↦ ⟦ λ ⤍ 𝜎 ⟧ ⟧ )
- λ: L_fork
  dataize:
    𝛿1: $.φ
  morph:
    𝑛1: $.left
    𝑛2: $.right
  symbolize:
    𝑛3: 𝑛1
    𝑛4: 𝑛2
  join:
    𝑛5: [𝑛3, 𝑛4]
  𝑛: 𝑛5
- λ: L_entry
  dataize:
    𝛿1: $.n
  morph:
    𝑛1: $.v.φ
  𝑛: Φ.l🌵.root( 𝑛1 )
- λ: L_root
  dataize:
    𝛿1: $.v
  𝑛: ⟦ ⟧
