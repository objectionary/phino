---
name: ml
label: \lambda
match: '⟦𝐵1, λ ⤍ 𝑓1, 𝐵2⟧.𝜏1'
universe: 𝑒1
conclusion: 𝑛3
premises:
  - n-result: 𝑛1
    evaluate:
      - '⟦𝐵1, λ ⤍ 𝑓1, 𝐵2⟧'
      - 𝑒1
  - n-result: 𝑛2
    normalize: '𝑛1.𝜏1'
  - n-result: 𝑛3
    morph: 𝑛2
