---
name: mphi
label: \varphi
match: ⟦𝐵1⟧.𝜏1
universe: 𝑒1
conclusion: 𝑛2
when:
  and:
    - in:
        - φ
        - 𝐵1
    - disjoint:
        - [𝜏1, λ]
        - [𝐵1]
premises:
  - n-result: 𝑛1
    normalize: ⟦𝐵1⟧.φ.𝜏1
  - n-result: 𝑛2
    morph: 𝑛1
