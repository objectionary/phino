---
name: fire
match: ⟦𝐵1⟧
universe: 𝑒1
conclusion: 𝛿1
when:
  and:
    - in:
        - λ
        - 𝐵1
    - disjoint:
        - [Δ]
        - [𝐵1]
premises:
  - n-result: 𝑛1
    evaluate:
      - ⟦𝐵1⟧
      - 𝑒1
  - d-result: 𝛿1
    dataize:
      - 𝑛1
      - 𝑒1
