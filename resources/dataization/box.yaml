---
name: box
match: ⟦𝐵1, φ ↦ 𝑒2, 𝐵2⟧
universe: 𝑒1
conclusion: 𝛿1
when:
  disjoint:
    - [Δ, λ]
    - [𝐵1, 𝐵2]
premises:
  - n-result: 𝑒3
    contextualize:
      - 𝑒2
      - ⟦𝐵1, φ ↦ 𝑒2, 𝐵2⟧
  - n-result: 𝑛1
    normalize: 𝑒3
  - d-result: 𝛿1
    dataize: 𝑛1
