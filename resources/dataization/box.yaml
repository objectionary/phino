---
name: box
match: ⟦𝐵1⟧
universe: 𝑒1
conclusion: 𝛿1
when:
  and:
    - in:
        - φ
        - 𝐵1
    - disjoint:
        - [Δ, λ]
        - [𝐵1]
premises:
  - n-result: 𝑛1
    normalize: ⟦𝐵1⟧.φ
  - d-result: 𝛿1
    dataize:
      - 𝑛1
      - 𝑒1
