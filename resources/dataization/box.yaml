---
name: box
match: ⟦𝐵1, φ ↦ 𝑒1, 𝐵2⟧
e-match: 𝑒0
d-result: 𝛿0
when:
  disjoint:
    - [Δ, λ]
    - [𝐵1, 𝐵2]
premises:
  - n-result: 𝑒2
    contextualize:
      - 𝑒1
      - ⟦𝐵1, φ ↦ 𝑒1, 𝐵2⟧
  - n-result: 𝑛1
    normalize: 𝑒2
  - d-result: 𝛿0
    dataize: 𝑛1
