---
# Dispatch 𝜏1 on a formation: contextualize the dispatched body 𝑛1 and decorate
# it with the whole formation as ρ. The contextualization context is the
# formation WITHOUT the dispatched binding — ⟦𝐵1, 𝐵2⟧, not ⟦𝐵1, 𝜏1 ↦ 𝑛1, 𝐵2⟧ —
# so a self-referential ξ inside 𝑛1 (as in ⟦ a ↦ ξ ⟧.a or ⟦ a ↦ ξ.a ⟧.a) no
# longer sees 𝜏1. Such a self-reference then dispatches on a formation that
# lacks 𝜏1 and collapses to ⊥ via stop/null/dd instead of rebuilding the same
# ⟦…, 𝜏1 ↦ 𝑛1, …⟧.𝜏1 term and looping forever. ρ on line 'result' still binds
# the full formation, so sibling and φ-decoration references stay intact — only
# the self-ξ path narrows, keeping normalization (near-)total.
# The rule does not dispatch on a formation holding both λ and Δ: 'dl' says
# such a formation is ⊥, and carrying it out into ρ would leave a ρ ↦ ⊥ in a
# normal form that 'dl' firing first reduces to ⊥ outright, so the answer would
# hang on rule order (#1395).
# The ρ carries the name of the formation where it has one: the whole program
# is 'Φ', and a formation reached as 'Φ.number', or as 'Φ.number( φ ↦ 𝑘 )', is
# an object of the immutable world, so the 'named' function writes that name
# back instead of the object, and a dispatch off it does not copy the program
# or every method the object declares into the term (#1318, #1446). The world
# 'named' looks the name up in is 𝑒1. Where the formation has no name, or no
# world is known — the 'rewrite' command, and 'isNF' asking about a term on its
# own — 'named' answers with the formation itself and the ρ holds it.
name: dot
pattern: ⟦𝐵1, 𝜏1 ↦ 𝑛1, 𝐵2⟧.𝜏1
e-match: 𝑒1
when:
  or:
    - disjoint:
        - [λ]
        - [𝐵1, 𝐵2]
    - disjoint:
        - [Δ]
        - [𝐵1, 𝐵2]
result: 𝑒2(ρ ↦ 𝑒3)
where:
  - meta: 𝑒2
    function: contextualize
    args:
      - 𝑛1
      - ⟦𝐵1, 𝐵2⟧
  - meta: 𝑒3
    function: named
    args:
      - 𝑒1
      - ⟦𝐵1, 𝜏1 ↦ 𝑛1, 𝐵2⟧
