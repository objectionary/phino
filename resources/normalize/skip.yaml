---
# A formation that declares no ρ has no receiver, so the ρ 'dot' hands every
# dispatched body is dropped once that body turns out to be such a formation.
# 'copy' fills a ρ the formation declares void, and 'stay' keeps one it has
# already bound (#1407).
name: skip
pattern: ⟦𝐵1⟧(ρ ↦ 𝑒1)
result: ⟦𝐵1⟧
when:
  not:
    in:
      - ρ
      - 𝐵1
