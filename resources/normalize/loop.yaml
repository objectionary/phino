---
# Dispatch 𝜏1 on a formation whose body 𝑛1 leads back to 𝜏1 through the
# ξ-dispatches it starts with, directly as in ⟦ a ↦ ξ.a ⟧.a or through
# siblings as in ⟦ a ↦ ξ.b, b ↦ ξ.a ⟧.a. Such a dispatch has no normal form:
# 'dot' would rebuild it inside its own body forever, so the rule answers ⊥
# and keeps normalization total on it (#967, #1438).
name: loop
pattern: ⟦𝐵1, 𝜏1 ↦ 𝑛1, 𝐵2⟧.𝜏1
when:
  recursive: ⟦𝐵1, 𝜏1 ↦ 𝑛1, 𝐵2⟧.𝜏1
result: ⊥
