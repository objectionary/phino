---
repeat: 10
input: '[[ x -> Q.y ]]'
output: |-
  ⟦
    x ↦ Φ.y,
    z -> [[ w -> [[ q -> "foo" ]] ]]
  ⟧
rules:
  custom:
    - name: nested part of
      pattern: '[[ x -> Q.y, !B1 ]]'
      result: '[[ x -> Q.y, z -> [[ w -> [[ q -> "foo" ]] ]], !B1]]'
      when:
        not:
          part-of: ['"foo"', '!B1']
