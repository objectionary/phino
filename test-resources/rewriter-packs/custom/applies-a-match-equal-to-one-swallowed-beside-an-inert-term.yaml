---
repeat: 1
input: '[[ a -> [[ k -> [[ m -> [[ ]].go ]], s -> [[ q -> Q ]] ]].go, b -> [[ ]].go ]]'
output: '[[ a -> Q.done, b -> Q.done ]]'
rules:
