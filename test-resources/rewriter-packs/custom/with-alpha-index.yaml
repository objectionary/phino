---
input: '[[ x -> ? ]](~0 -> Q.y)'
output: '⟦ x ↦ ∅ ⟧(~0 ↦ Φ)'
rules:
  custom:
    - name: with-alpha-index
      pattern: '[[ !B1 ]](α𝑖1 ↦ !e1)'
      result: '[[ !B1 ]](α𝑖1 ↦ Φ)'
      when:
        eq:
          - 𝑖1
          - 0
