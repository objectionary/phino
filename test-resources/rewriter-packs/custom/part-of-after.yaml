---
repeat: 10
input: '[[ x -> Q.y ]]'
output: |-
  ⟦
    x ↦ Φ.y,
    z -> "hello world"
  ⟧
rules:
  custom:
    - name: part-of-after
      pattern: '[[ x -> Q.y, !B1 ]]'
      result: '[[ x -> Q.y, z -> !e1, !B1 ]]'
      where:
        - meta: '!e1'
          function: concat
          args: ['"hello "', '"world"']
      having:
        not:
          part-of: ['!e1', '!B1']
