---
input: '[[ a -> [[ ]], b -> [[ ]] ]]'
output: '⟦ y ↦ ξ, a ↦ ⟦⟧, b ↦ ⟦⟧ ⟧'
rules:
  custom:
    - name: insert-y
      pattern: '[[ !B1, !B2 ]]'
      result: '[[ !B1, y -> $, !B2 ]]'
      when:
        eq: [1, 1]
