---
input: '[[x -> $.q, y -> Q.a]].x'
output: |-
  ⟦
    x ↦ ξ.q,
    y ↦ Φ.a
  ⟧.φ.x
rules:
  custom:
    - name: with-simple-condition
      pattern: '[[!B1]].!t1'
      result: '[[!B1]].@.!t1'
      when:
        and:
          - in:
              - '!t1'
              - '!B1'
          - in:
              - 'y'
              - '!B1'
