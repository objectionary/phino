---
input: |
  ⟦
    eo ↦ ⟦
      example ↦ ⟦
        fibonacci(n) ↦ ⟦
          φ ↦ n.lt(x ↦ 2).if(
            left ↦ n,
            right ↦ Φ.eo.example.fibonacci(n ↦ n.minus(x ↦ 1)).plus(
              x ↦ Φ.eo.example.fibonacci(n ↦ n.minus(x ↦ 2))
            )
          )
        ⟧,
        λ ⤍ Package
      ⟧,
      λ ⤍ Package
    ⟧
  ⟧
output: |-
  ⟦
    eo ↦ ⟦
      example ↦ ⟦
        fibonacci ↦ ⟦
          n ↦ ∅,
          φ ↦ ξ.n.lt(
            x ↦ Φ.number(
              φ ↦ Φ.bytes(
                φ ↦ ⟦ Δ ⤍ 40-00-00-00-00-00-00-00 ⟧
              )
            )
          ).if(
            left ↦ ξ.n
          )(
            right ↦ Φ.eo.example.fibonacci(
              n ↦ ξ.n.minus(
                x ↦ Φ.number(
                  φ ↦ Φ.bytes(
                    φ ↦ ⟦ Δ ⤍ 3F-F0-00-00-00-00-00-00 ⟧
                  )
                )
              )
            ).plus(
              x ↦ Φ.eo.example.fibonacci(
                n ↦ ξ.n.minus(
                  x ↦ Φ.number(
                    φ ↦ Φ.bytes(
                      φ ↦ ⟦ Δ ⤍ 40-00-00-00-00-00-00-00 ⟧
                    )
                  )
                )
              )
            )
          )
        ⟧,
        λ ⤍ Package
      ⟧,
      λ ⤍ Package
    ⟧
  ⟧
