---
# Mutually self-referential attributes (a via ξ.b, b via ξ.a) also used to
# diverge in DOT (see #967); the 'loop' rule sees the chain lead back to the
# dispatched attribute and answers ⊥, so normalization terminates (#1438).
normalize: true
input: |
  ⟦ a ↦ ξ.b, b ↦ ξ.a ⟧.a
output: |-
  ⊥
