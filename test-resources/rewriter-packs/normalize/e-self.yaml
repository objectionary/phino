---
# A self-referential object dispatched on its own attribute used to loop
# forever in DOT (see #967); the 'loop' rule sees its body lead back to the
# dispatched attribute and answers ⊥, so normalization terminates (#1438).
normalize: true
input: |
  ⟦ a ↦ ξ.a ⟧.a
output: |-
  ⊥
