---
# A body leading back to its own attribute through a sibling, past dispatches
# and applications, has no normal form and is ⊥ (#1438).
normalize: true
input: |
  ⟦ t ↦ ⟦ a ↦ ξ.b.c, b ↦ ξ.a( x ↦ ⟦⟧ ) ⟧.a ⟧
output: |-
  ⟦ t ↦ ⊥ ⟧
