---
# The λ-and-Δ guard of 'dot' still lets a formation with λ alone be
# dispatched (#1395).
rules:
  basic: ['dot']
input: |
  ⟦ x ↦ Φ.y, λ ⤍ Foo ⟧.x
output: |-
  Φ.y(
    ρ ↦ ⟦
      x ↦ Φ.y,
      λ ⤍ Foo
    ⟧
  )
