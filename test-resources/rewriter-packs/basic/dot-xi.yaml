---
# The ξ of the dispatched body stands for the formation without the
# dispatched binding, on purpose, so a body that is ξ answers the formation
# one attribute short rather than itself (#967, #1438).
rules:
  basic: ['dot']
input: |
  ⟦ a ↦ ξ ⟧.a
output: |-
  ⟦⟧ (ρ ↦ ⟦ a ↦ ξ ⟧)
