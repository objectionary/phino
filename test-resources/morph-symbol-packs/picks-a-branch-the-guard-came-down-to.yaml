---
# The same fork, decided. 𝔻 brings the guard down to the byte an EO bool
# carries for truth, the first entry's guard holds on it and the fork answers
# the branch it named — so an entry asking for data is what a λ function
# branching on data is written as. Only the branch that entry morphs is
# morphed: the one it did not name never appears in the protocol.
functions: |
  - λ: L_fork
    dataize:
      δ1: guard
    morph:
      𝑛1: left
    when:
      eq:
        - δ1
        - FF-
    𝑛: 𝑛1
  - λ: L_fork
    dataize:
      δ1: guard
    morph:
      𝑛2: right
    when:
      eq:
        - δ1
        - 00-
    𝑛: 𝑛2
location: 'Q.@'
deep: true
input: |
  [[
    bool -> [[
      φ -> ?,
      if -> [[ left -> ?, right -> ?, guard -> $.^, L> L_fork ]]
    ]],
    @ -> Q.bool( [[ D> FF- ]] ).if( [[ D> 01- ]], [[ D> 02- ]] )
  ]]
protocol:
  - '{"λ":"L_fork","morph":"𝑛1","at":"begin"}'
  - '{"λ":"L_fork","morph":"𝑛1","at":"end"}'
  - '{"λ":"L_fork","δ1":"FF-"}'
result: '⟦ Δ ⤍ 01-, ρ ↦ ∅ ⟧'
