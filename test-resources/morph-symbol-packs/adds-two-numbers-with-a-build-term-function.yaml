---
# An entry computes with the very build-term functions a rewriting rule's
# 'where' calls, so the arithmetic EO's 'number.plus' needs is spelled in the
# file and not in phino: both operands come down through 𝔻 and 'sum' adds the
# numbers their bytes carry.
functions: |
  - λ: L_number_plus
    dataize:
      𝑛1: ρ
      𝑛2: x
    where:
      - meta: 𝑛3
        function: sum
        args:
          - 𝑛1
          - 𝑛2
    𝑛: 𝑛3
location: 'Q.@'
deep: true
input: |
  [[
    bytes -> [[ φ -> ? ]],
    number -> [[ φ -> ?, plus -> [[ x -> ?, L> L_number_plus ]] ]],
    @ -> 5.plus( 6 )
  ]]
protocol:
  - '{"λ":"L_number_plus","𝑛1":"40-14-00-00-00-00-00-00","𝑛2":"40-18-00-00-00-00-00-00"}'
result: 'Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍ 40-26-00-00-00-00-00-00 ⟧ ) )'
