---
# An entry computes with the very build-term functions a rewriting rule's
# 'where' calls, so the arithmetic EO's 'number.plus' needs is spelled in the
# file and not in phino: both operands come down through 𝔻, which answers the
# data they carry, and 'sum' adds the numbers that data spells.
functions: |
  - λ: L_number_plus
    dataize:
      δ1: ρ
      δ2: x
    where:
      - meta: 𝑛1
        function: sum
        args:
          - δ1
          - δ2
    𝑛: 𝑛1
location: 'Q.@'
deep: true
input: |
  [[
    bytes -> [[ φ -> ? ]],
    number -> [[ φ -> ?, plus -> [[ x -> ?, L> L_number_plus ]] ]],
    @ -> 5.plus( 6 )
  ]]
protocol:
  - '{"λ":"L_number_plus","δ1":"40-14-00-00-00-00-00-00","δ2":"40-18-00-00-00-00-00-00"}'
result: 'Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍ 40-26-00-00-00-00-00-00 ⟧ ) )'
