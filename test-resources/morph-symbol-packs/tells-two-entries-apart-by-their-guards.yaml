---
# Two entries answer the same λ name and the guard of the first is what tells
# them apart: the operands come down through 𝔻 and, where they agree, the
# comparison answers the byte an EO bool carries for truth. The operands are
# reduced once for the two entries, not once each, so the protocol reports one
# record per firing whichever entry wins it.
functions: |
  - λ: L_bytes_eq
    dataize:
      𝑛1: ρ
      𝑛2: b
    when:
      eq:
        - 𝑛1
        - 𝑛2
    𝑛: ⟦ Δ ⤍ FF- ⟧
  - λ: L_bytes_eq
    dataize:
      𝑛1: ρ
      𝑛2: b
    𝑛: ⟦ Δ ⤍ 00- ⟧
deep: true
input: |
  [[
    same -> [[ ^ -> [[ D> CA-FE ]], b -> [[ D> CA-FE ]], L> L_bytes_eq ]],
    other -> [[ ^ -> [[ D> CA-FE ]], b -> [[ D> CA-FF ]], L> L_bytes_eq ]]
  ]]
protocol:
  - '{"λ":"L_bytes_eq","𝑛1":"CA-FE","𝑛2":"CA-FE"}'
  - '{"λ":"L_bytes_eq","𝑛1":"CA-FE","𝑛2":"CA-FF"}'
result: '[[ same -> [[ D> FF- ]], other -> [[ D> 00- ]] ]]'
