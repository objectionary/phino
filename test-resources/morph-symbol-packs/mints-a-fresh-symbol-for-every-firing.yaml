---
# Two firings down a chain of dispatches: each mints a symbol of its own, and
# the operand of the second is the answer of the first, which the protocol
# names rather than brings down again — every symbol answers the same datum.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.plus( 6 ).plus( 7 ) ⟧
result: 'Φ.number( φ ↦ ⟦ λ ⤍ 𝜎2, ρ ↦ ∅ ⟧ )'
protocol: |
  𝕄(Φ.φ)
    𝔼(L_number_plus)
      𝛿1.1 := 40-14-00-00-00-00-00-00
      𝛿2.1 := 40-18-00-00-00-00-00-00
      𝑛.1 := Φ.number( φ ↦ ⟦ λ ⤍ 𝜎1 ⟧ )
    𝔼(L_number_plus)
      𝛿1.2 := 𝔻(𝜎1)
      𝛿2.2 := 40-1C-00-00-00-00-00-00
      𝑛.2 := Φ.number( φ ↦ ⟦ λ ⤍ 𝜎2 ⟧ )
