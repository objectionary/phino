---
# The λ functions phino's own specs fire. phino implements none of them, so a
# spec that needs one to answer brings this file in with '--functions'. It goes
# just far enough to let the specs add two numbers and compare two byte
# arrays, in the rule language phino's own judgments are written in: the
# operands come down through 𝔻, a 'when' tells one answer of a λ function from
# another, and the term under '𝑛' is what the firing answers with.
#
# 'L_number_nope' is missing on purpose: it is the λ function that cannot fire,
# the one '--partial' parks on.

# An operand carrying no number leaves the addition nothing to answer, which is
# what every EO number atom answers ⊥ to. The empty byte array is the one such
# operand the specs feed it, and this entry stands before the arithmetic one,
# so it is tried first.
- λ: L_number_plus
  dataize:
    𝑛1: ρ
    𝑛2: x
  when:
    eq:
      - 𝑛2
      - ⟦ Δ ⤍ -- ⟧
  𝑛: ⊥

# Both operands carry a number, so 'sum' adds them and the answer is the
# number object EO expects back from 'number.plus'.
- λ: L_number_plus
  dataize:
    𝑛1: ρ
    𝑛2: x
  where:
    - meta: 𝑛3
      function: sum
      args:
        - 𝑛1
        - 𝑛2
  𝑛: 𝑛3

# Two byte arrays are equal when 𝔻 brings them down to the very same term, so
# the comparison is a guard and not an arithmetic function at all.
- λ: L_bytes_eq
  dataize:
    𝑛1: ρ
    𝑛2: b
  when:
    eq:
      - 𝑛1
      - 𝑛2
  𝑛: Φ.true
- λ: L_bytes_eq
  dataize:
    𝑛1: ρ
    𝑛2: b
  𝑛: Φ.false

# Inverting a byte array is arithmetic phino cannot spell declaratively, so the
# fixture inverts the two arrays an EO bool ever carries and nothing else.
- λ: L_bytes_not
  dataize:
    𝑛1: ρ
  when:
    eq:
      - 𝑛1
      - ⟦ Δ ⤍ FF- ⟧
  𝑛: ⟦ Δ ⤍ 00- ⟧
- λ: L_bytes_not
  dataize:
    𝑛1: ρ
  when:
    eq:
      - 𝑛1
      - ⟦ Δ ⤍ 00- ⟧
  𝑛: ⟦ Δ ⤍ FF- ⟧
