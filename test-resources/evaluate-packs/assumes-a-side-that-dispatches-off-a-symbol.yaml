---
# yamllint disable rule:line-length
# The right side dispatches 'q' off a bare symbol, which nothing answers, so
# its morph is 'opaque' and gives a new symbol (#2479). The join takes the
# left side for that symbol and writes an 'assumed' line (#2469).
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.on🌵
    morph:
      𝑛1: $.left🌵
      𝑛2: $.right🌵
    join:
      on: 𝛿1
      left: 𝑛1
      right: 𝑛2
      otherwise: L_fork
location: 'Q.e1'
input: '⟦ k ↦ ⟦ q ↦ ⟦⟧ ⟧, e1 ↦ ⟦ λ ⤍ L_fork, on🌵 ↦ ⟦ Δ ⤍ 00- ⟧, left🌵 ↦ ⟦ φ ↦ Φ.k ⟧, right🌵 ↦ ⟦ λ ⤍ 𝜎1 ⟧.q ⟧.φ ⟧'
result: '⟦⟧:q'
protocol: |
  𝕄(Φ.e1):
    𝔼(L_fork):
      𝔻(ξ.on🌵):
        𝛿·1·1 ≔ 00-
      𝛿1·1 ≔ 𝛿·1·1  # 𝔻(ξ.on🌵)
      𝕄(ξ.left🌵):
        morphed 𝑛·1·1 ≔ Φ.k:φ
      𝑛1·1 ≔ 𝑛·1·1  # 𝕄(ξ.left🌵)
      𝕄(ξ.right🌵):
        opaque 𝜎2:λ ≔ 𝜎1:λ.q
        morphed 𝑛·1·2 ≔ 𝜎2:λ
      𝑛2·1 ≔ 𝑛·1·2  # 𝕄(ξ.right🌵)
      assumed 𝜎2:λ ≡ 𝑛1·1
      𝑛·1·3 ≔ 𝑛·1·1
      evaluated 𝑛·1·4 ≔ 𝑛·1·3  # ⟦ λ ⤍ L_fork, on🌵 ↦ 00-:Δ, left🌵 ↦ 𝑛·1·3, right🌵 ↦ 𝜎1:λ.q ⟧
    normalized 𝑛·0·1 ≔ Φ.k  # 𝑛·1·4.φ
    normalized 𝑛·0·2 ≔ ⟦⟧:q  # Φ.k
    morphed 𝑛·0·3 ≔ 𝑛·0·2
