---
# The same λ function no entry answers, under '_partial' and the deep walk: the
# spine parks the site and the walk goes over the residue it parked on, so 𝔼 is
# attempted on that one site twice. The protocol records it once, since what a
# '?(…)' line counts is the sites 𝔼 got stuck on and not the passes the walk
# made over them (#1300).
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.x'
deep: true
partial: true
input: '⟦ x ↦ ⟦ λ ⤍ L_none ⟧.foo ⟧'
result: '⟦ λ ⤍ L_none ⟧.foo'
protocol: |
  𝕄(Φ.x)
    ?(L_none)  # 𝕄(L_none:λ)
