---
# yamllint disable rule:line-length
# The λ of a formation stands for its φ alone, so a dispatch on any other
# attribute it binds must find that attribute in the formation. Each side of
# the fork is a copy of 'box', which binds 'tag' beside its λ, and 'tag' is
# no void 'box' declares. The 'evaluate' lines hand both copies back as they
# are, the join fabricates nothing, since the two copies differ only in their
# symbols, and 'y' comes to the joined 'tag' rather than to a dispatch on a
# symbol (#2265).
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.on🌵
    morph:
      𝑛1: $.left🌵
      𝑛2: $.right🌵
    evaluate:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      'on': 𝛿1
      left: 𝑛3
      right: 𝑛4
      otherwise: L_fork
  - λ: L_box
    𝑛: ⟦ λ ⤍ 𝜎 ⟧
location: 'Q.y'
input: >
  ⟦ box(v) ↦ ⟦ tag ↦ ξ.v, λ ⤍ L_box ⟧,
    x ↦ ⟦ λ ⤍ L_fork, on🌵 ↦ 𝜎1:λ, left🌵 ↦ Φ.box( 𝜎2:λ ), right🌵 ↦ Φ.box( 𝜎3:λ ) ⟧,
    y ↦ Φ.x.tag ⟧
result: '𝜎4:λ'
protocol: |
  𝕄(Φ.y):
    remembered 𝑛·0·1 ≡ Φ.x  # ⟦ λ ⤍ L_fork, on🌵 ↦ 𝜎1:λ, left🌵 ↦ Φ.box( 𝜎2:λ ), right🌵 ↦ Φ.box( 𝜎3:λ ) ⟧
    normalized 𝑛·0·2 := 𝑛·0·1
    𝔼(L_fork):
      𝔻(ξ.on🌵):
        𝛿·1·1 := 𝔻(𝜎1:λ)
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.on🌵)
      𝕄(ξ.left🌵):
        remembered 𝑛·1·1 ≡ Φ.box  # ⟦ v ↦ ∅, tag ↦ v, λ ⤍ L_box ⟧
        normalized 𝑛·1·2 := 𝑛·1·1
        𝑛·1·3 := Φ.box( v ↦ 𝜎2:λ )
        𝑛·1·4 := ⟦ v ↦ 𝜎2:λ, tag ↦ v, λ ⤍ L_box ⟧
        remembered 𝑛·1·4 ≡ 𝑛·1·1( v ↦ 𝜎2:λ )
        normalized 𝑛·1·5 := 𝑛·1·4
        normalized 𝑛·1·6 := 𝑛·1·4
        morphed 𝑛·1·7 := 𝑛·1·4
      𝑛1·1 := 𝑛·1·4  # 𝕄(ξ.left🌵)
      𝕄(ξ.right🌵):
        normalized 𝑛·1·8 := 𝑛·1·1
        𝑛·1·9 := Φ.box( v ↦ 𝜎3:λ )
        𝑛·1·10 := ⟦ v ↦ 𝜎3:λ, tag ↦ v, λ ⤍ L_box ⟧
        remembered 𝑛·1·10 ≡ 𝑛·1·1( v ↦ 𝜎3:λ )
        normalized 𝑛·1·11 := 𝑛·1·10
        normalized 𝑛·1·12 := 𝑛·1·10
        morphed 𝑛·1·13 := 𝑛·1·10
      𝑛2·1 := 𝑛·1·10  # 𝕄(ξ.right🌵)
      recalled 𝑛·1·4 ⇒ 𝑛·1·1( v ↦ 𝜎2:λ )
      recalled 𝑛·1·1 ⇒ Φ.box
      recalled 𝑛·1·10 ⇒ 𝑛·1·1( v ↦ 𝜎3:λ )
      recalled 𝑛·1·1 ⇒ Φ.box
      joined 𝜎4 := 𝛿1·1 ? 𝜎2 : 𝜎3
      𝑛·1·14 := ⟦ v ↦ 𝜎4:λ, tag ↦ v, λ ⤍ L_box ⟧
      remembered 𝑛·1·15 ≡ 𝑛·0·1  # ⟦ v ↦ 𝜎4:λ, tag ↦ v, λ ⤍ L_box ⟧
    normalized 𝑛·0·3 := 𝜎4:λ
    morphed 𝑛·0·4 := 𝑛·0·3
