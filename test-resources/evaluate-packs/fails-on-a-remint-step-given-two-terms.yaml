---
# yamllint disable rule:line-length
# A 'remint' step mints one symbol for one term, so a step handing it two terms
# is refused the moment the rule matches, instead of minting for either (#1909).
symbolic: |
  - λ: L_shrink
    morph:
      𝑛1: $.x
    rewrite:
      𝑛2:
        of: 𝑛1
        rules:
          - name: small-pair
            pattern: ⟦ !B1, head ↦ 𝑒1, tail ↦ 𝑒2, !B2 ⟧
            result: ⟦ !B1, head ↦ 𝑒3, !B2 ⟧
            where:
              - meta: 𝑒3
                function: remint
                args: [𝑒1, 𝑒2]
    𝑛: 𝑛2
location: 'Q.y'
input: '⟦ y ↦ ⟦ x ↦ ⟦ head ↦ ⟦ λ ⤍ 𝜎1 ⟧, tail ↦ ⟦ λ ⤍ 𝜎2 ⟧ ⟧, λ ⤍ L_shrink ⟧.head ⟧'
fails: 'Function remint() requires exactly 1 argument as expression'
protocol: |
  𝕄(Φ.y):
    𝔼(L_shrink):
      𝑛1·1 := ⟦ head ↦ 𝜎1:λ, tail ↦ 𝜎2:λ ⟧  # 𝕄(ξ.x)
