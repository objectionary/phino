---
# An entry answering with a firing of itself fires until the budget is gone.
# Recursion is nothing phino prevents on its own — that is the object model's
# business — so without '_acyclic' the step limit is what ends the run, and
# every firing it paid for is in the protocol. The last block opens and answers
# nothing: morphing an answer is a step of its own (#1268), so the budget of the
# sixth firing is gone between the line naming it and the line it would have
# answered with, which is exactly what a protocol that streams is for. This is
# the control the pack asking for the guard stands against.
symbolic: |
  - λ: L_loop
    𝑛: ⟦ λ ⤍ L_loop ⟧
location: 'Q.x'
steps: 6
input: '⟦ x ↦ ⟦ λ ⤍ L_loop ⟧.foo ⟧'
fails: 'reaching the limit of steps'
protocol: |
  𝕄(Φ.x)
    𝔼(L_loop)
      𝑛.1 := ⟦ λ ⤍ L_loop ⟧
    𝔼(L_loop)
      𝑛.2 := ⟦ λ ⤍ L_loop ⟧
    𝔼(L_loop)
      𝑛.3 := ⟦ λ ⤍ L_loop ⟧
    𝔼(L_loop)
      𝑛.4 := ⟦ λ ⤍ L_loop ⟧
    𝔼(L_loop)
      𝑛.5 := ⟦ λ ⤍ L_loop ⟧
    𝔼(L_loop)
