---
# yamllint disable rule:line-length
# The join reads its left side off a path, which dispatches 'q' off a bare
# symbol and is 'opaque', giving a new symbol (#2479). The join takes the right
# side for that symbol and writes an 'assumed' line (#2469).
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.on🌵
    join:
      on: 𝛿1
      left: $.left🌵
      right: $.right🌵
location: 'Q.e1'
input: '⟦ k ↦ ⟦ q ↦ ⟦⟧ ⟧, e1 ↦ ⟦ λ ⤍ L_fork, on🌵 ↦ ⟦ Δ ⤍ 00- ⟧, left🌵 ↦ ⟦ λ ⤍ 𝜎1 ⟧.q, right🌵 ↦ ⟦ φ ↦ Φ.k ⟧ ⟧.φ ⟧'
result: '⟦⟧:q'
protocol: |
  𝕄(Φ.e1):
    𝔼(L_fork):
      𝔻(ξ.on🌵):
        𝛿·1·1 ≔ 00-
      𝛿1·1 ≔ 𝛿·1·1  # 𝔻(ξ.on🌵)
      𝕄(ξ.left🌵):
        opaque 𝜎2:λ ≔ 𝜎1:λ.q
        morphed 𝑛·1·1 ≔ 𝜎2:λ
      𝕄(ξ.right🌵):
        morphed 𝑛·1·2 ≔ Φ.k:φ
      assumed 𝜎2:λ ≡ 𝑛·1·2
      𝑛·1·3 ≔ 𝑛·1·2
      evaluated 𝑛·1·4 ≔ 𝑛·1·3  # ⟦ λ ⤍ L_fork, on🌵 ↦ 00-:Δ, left🌵 ↦ 𝜎1:λ.q, right🌵 ↦ 𝑛·1·3 ⟧
    normalized 𝑛·0·1 ≔ Φ.k  # 𝑛·1·4.φ
    normalized 𝑛·0·2 ≔ ⟦⟧:q  # Φ.k
    morphed 𝑛·0·3 ≔ 𝑛·0·2
