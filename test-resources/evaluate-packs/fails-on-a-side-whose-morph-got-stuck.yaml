---
# yamllint disable rule:line-length
# The 'morph' of '$.a' gets stuck on 'L_none', which no entry answers. A join
# keeps no failure for later, so the firing gets stuck at once, before the
# 'morph' of '$.b' runs (#1996).
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.c
    morph:
      𝑛1: $.a
      𝑛2: $.b
    join:
      on: 𝛿1
      left: 𝑛1
      right: 𝑛2
location: 'Q.y'
input: '⟦ y ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎1 ⟧, a ↦ ⟦ λ ⤍ L_none ⟧.x, b ↦ ⟦ Δ ⤍ 05- ⟧, λ ⤍ L_fork ⟧.φ ⟧'
fails: "No entry of --symbolic answers the λ function 'L_none'"
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝛿1·1 := 𝔻(𝜎1:λ)  # 𝔻(ξ.c)
      𝕄(ξ.a):
        unanswered L_none  # 𝕄(L_none:λ)
      stuck L_none
