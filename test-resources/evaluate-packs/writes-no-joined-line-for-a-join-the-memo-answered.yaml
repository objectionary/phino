        boxed 𝑛·5·8 := 𝑛·5·7.φ
        𝕄(𝑛·5·8):
          𝑛·5·9 := Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ )
          𝑛·5·10 := 00-00-00-00-00-00-00-00:Δ:φ
