---
# yamllint disable rule:line-length
# A join the memo of 'plausible' answered writes no 'joined' line (#2011). The
# program reads 'f' twice, so the join of 'L_fork' fires twice over the same
# formation. The first firing brings its condition down to '𝛿1·2', mints 𝜎4
# and writes 'joined 𝜎4 := 𝛿1·2 ? 𝜎2 : 𝜎3'. The second one takes that answer
# from the memo and brings nothing down, so no meta of its own holds the
# condition, and it writes the answer alone, the way a firing the memo
# answered writes no symbol it minted.
symbolic: |
  - λ: L_number_gt
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.ρ
    join:
      on: 𝛿1
      left: $.then
      right: $.else
location: 'Q.@'
acyclic: plausible
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    bool(φ) ↦ ⟦ if ↦ ⟦ ρ ↦ ∅, then ↦ ∅, else ↦ ∅, λ ⤍ L_fork ⟧ ⟧,
    number(φ) ↦ ⟦
      gt(ρ, x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    f ↦ 5.gt( 0 ).if( 1.plus( 2 ).plus( 0 ), 3.plus( 4 ).plus( 0 ) ),
    φ ↦ Φ.f.plus( Φ.f ).φ ⟧
result: '𝜎6:λ'
protocol: |
  𝕄(Φ.φ):
    𝑛·0·1 := 5
    𝑛·0·2 := 𝑛·0·1.gt( x ↦ 0 )
    𝔼(L_number_gt):
      𝔻(Φ.a🌵0):
        𝕄(Φ.a🌵0):
          𝑛·1·1 := 5
          𝑛·1·2 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
        𝛿·1·1 := 40-14-00-00-00-00-00-00  # 5.0
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.ρ)
      𝔻(Φ.a🌵1):
        𝕄(Φ.a🌵1):
          𝑛·1·3 := 0
          𝑛·1·4 := Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ )
        𝛿·1·2 := 00-00-00-00-00-00-00-00  # 0.0
      𝛿2·1 := 𝛿·1·2  # 𝔻(ξ.x)
      𝑛·1·5 := Φ.bool( φ ↦ 𝜎1:λ )  # 𝑛
      𝕄(𝑛·1·5):
        𝑛·1·6 := Φ.bool( φ ↦ 𝜎1:λ )
      𝑛·1·7 := 𝑛·1·6  # 𝕄(𝑛·1·5)
    𝑛·0·3 := 𝑛·1·6.if( then ↦ 1.plus( 2 ).plus( 𝑛·1·3 ) )
    𝑛·0·4 := 𝑛·0·3( else ↦ 3.plus( 4 ).plus( 𝑛·1·3 ) )
    𝔼(L_fork):
      𝔻(Φ.a🌵2):
        𝕄(Φ.a🌵2):
          𝑛·2·1 := Φ.bool( φ ↦ 𝜎1:λ )
      𝛿1·2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      𝕄(Φ.a🌵3):
        𝑛·2·2 := 1
        𝑛·2·3 := 𝑛·2·2.plus( x ↦ 2 )
        𝔼(L_number_plus):
          𝔻(Φ.a🌵4):
            𝕄(Φ.a🌵4):
              𝑛·3·1 := 1
              𝑛·3·2 := Φ.bytes( φ ↦ 3F-F0-00-00-00-00-00-00:Δ )
            𝛿·3·1 := 3F-F0-00-00-00-00-00-00  # 1.0
          𝛿1·3 := 𝛿·3·1  # 𝔻(ξ.ρ)
          𝔻(Φ.a🌵5):
            𝕄(Φ.a🌵5):
              𝑛·3·3 := 2
              𝑛·3·4 := Φ.bytes( φ ↦ 40-00-00-00-00-00-00-00:Δ )
            𝛿·3·2 := 40-00-00-00-00-00-00-00  # 2.0
          𝛿2·3 := 𝛿·3·2  # 𝔻(ξ.x)
          𝑛·3·5 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
          𝕄(𝑛·3·5):
            𝑛·3·6 := Φ.number( φ ↦ 𝜎2:λ )
          𝑛·3·7 := 𝑛·3·6  # 𝕄(𝑛·3·5)
        𝑛·2·4 := 𝑛·3·6.plus( x ↦ 𝑛·1·3 )
      𝕄(Φ.a🌵6):
        𝑛·2·5 := 3
        𝑛·2·6 := 𝑛·2·5.plus( x ↦ 4 )
        𝔼(L_number_plus):
          𝔻(Φ.a🌵7):
            𝕄(Φ.a🌵7):
              𝑛·4·1 := 3
              𝑛·4·2 := Φ.bytes( φ ↦ 40-08-00-00-00-00-00-00:Δ )
            𝛿·4·1 := 40-08-00-00-00-00-00-00  # 3.0
          𝛿1·4 := 𝛿·4·1  # 𝔻(ξ.ρ)
          𝔻(Φ.a🌵8):
            𝕄(Φ.a🌵8):
              𝑛·4·3 := 4
              𝑛·4·4 := Φ.bytes( φ ↦ 40-10-00-00-00-00-00-00:Δ )
            𝛿·4·2 := 40-10-00-00-00-00-00-00  # 4.0
          𝛿2·4 := 𝛿·4·2  # 𝔻(ξ.x)
          𝑛·4·5 := Φ.number( φ ↦ 𝜎3:λ )  # 𝑛
          𝕄(𝑛·4·5):
            𝑛·4·6 := Φ.number( φ ↦ 𝜎3:λ )
          𝑛·4·7 := 𝑛·4·6  # 𝕄(𝑛·4·5)
        𝑛·2·7 := 𝑛·4·6.plus( x ↦ 𝑛·1·3 )
      joined 𝜎4 := 𝛿1·2 ? 𝜎2 : 𝜎3
      𝑛·2·8 := ⟦ x ↦ 𝑛·1·3, λ ⤍ L_number_plus ⟧  # 𝕄(ξ.then), 𝕄(ξ.else)
    𝔼(L_number_plus):
      𝔻(Φ.a🌵9):
        𝕄(Φ.a🌵9):
          𝑛·5·1 := Φ.number( φ ↦ 𝜎4:λ )
      𝛿1·5 := 𝔻(𝜎4:λ)  # 𝔻(ξ.ρ)
      𝔻(Φ.a🌵10):
        𝕄(Φ.a🌵10):
          𝑛·5·2 := Φ.number( φ ↦ 𝑛·1·4 )
          𝑛·5·3 := Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ )
        𝛿·5·1 := 00-00-00-00-00-00-00-00  # 0.0
      𝛿2·5 := 𝛿·5·1  # 𝔻(ξ.x)
      𝑛·5·4 := Φ.number( φ ↦ 𝜎5:λ )  # 𝑛
      𝕄(𝑛·5·4):
        𝑛·5·5 := Φ.number( φ ↦ 𝜎5:λ )
      𝑛·5·6 := 𝑛·5·5  # 𝕄(𝑛·5·4)
    𝑛·0·5 := 𝑛·5·5.plus( x ↦ Φ.f )
    𝔼(L_number_plus):
      𝔻(Φ.a🌵11):
        𝕄(Φ.a🌵11):
          𝑛·6·1 := Φ.number( φ ↦ 𝜎5:λ )
      𝛿1·6 := 𝔻(𝜎5:λ)  # 𝔻(ξ.ρ)
      𝔻(Φ.a🌵12):
        𝕄(Φ.a🌵12):
          𝑛·6·2 := Φ.number( φ ↦ 𝑛·1·2 )
          𝑛·6·3 := 𝑛·6·2.gt( x ↦ 𝑛·5·2 )
          𝔼(L_number_gt):
            𝑛·7·1 := 𝑛·2·1  # 𝑛
            𝑛·7·2 := 𝑛·1·7  # 𝕄(𝑛·7·1)
          𝑛·6·4 := 𝑛·2·1.if( then ↦ 𝑛·3·1.plus( 𝑛·3·3 ).plus( 𝑛·5·2 ) )
          𝑛·6·5 := 𝑛·6·4( else ↦ 𝑛·4·1.plus( 𝑛·4·3 ).plus( 𝑛·5·2 ) )
        𝔼(L_fork):
          𝑛·8·1 := ⟦ x ↦ 𝑛·5·2, λ ⤍ L_number_plus ⟧  # 𝕄(ξ.then), 𝕄(ξ.else)
        𝔼(L_number_plus):
          𝑛·9·1 := 𝑛·6·1  # 𝑛
          𝑛·9·2 := 𝑛·5·6  # 𝕄(𝑛·9·1)
      𝛿2·6 := 𝔻(𝜎5:λ)  # 𝔻(ξ.x)
      𝑛·6·6 := Φ.number( φ ↦ 𝜎6:λ )  # 𝑛
      𝕄(𝑛·6·6):
        𝑛·6·7 := Φ.number( φ ↦ 𝜎6:λ )
      𝑛·6·8 := 𝑛·6·7  # 𝕄(𝑛·6·6)
