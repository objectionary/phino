              morphed 𝑛·4·15 := 𝑛·4·14
            boxed 𝑛·4·16 := 𝑛·4·15.φ
            𝛿·4·2 := 40-10-00-00-00-00-00-00  # 4.0
          𝛿2·4 := 𝛿·4·2  # 𝔻(ξ.x)
          𝑛·4·17 := Φ.number( φ ↦ 𝜎3:λ )  # 𝑛
          𝕄(𝑛·4·17):
            𝑛·4·18 := Φ.number( φ ↦ 𝜎3:λ )
            𝑛·4·19 := ⟦ φ ↦ 𝜎3:λ, gt(x) ↦ L_number_gt:λ, plus(x) ↦ L_number_plus:λ ⟧
            morphed 𝑛·4·20 := 𝑛·4·19
          𝑛·4·21 := 𝑛·4·20  # 𝕄(𝑛·4·17)
        𝑛·2·16 := 𝑛·4·18.plus( x ↦ 𝑛·1·9 )
        𝑛·2·17 := ⟦ x ↦ 𝑛·1·9, λ ⤍ L_number_plus ⟧
        morphed 𝑛·2·18 := 𝑛·2·17
      joined 𝜎4 := 𝛿1·2 ? 𝜎2 : 𝜎3
      𝑛·2·19 := ⟦ x ↦ 𝑛·1·9, λ ⤍ L_number_plus ⟧  # 𝕄(ξ.then), 𝕄(ξ.else)
    𝔼(L_number_plus):
      𝔻(ξ.ρ):
        𝕄(ξ.ρ):
          𝑛·5·1 := Φ.number( φ ↦ 𝜎4:λ )
          𝑛·5·2 := ⟦ φ ↦ 𝜎4:λ, gt(x) ↦ L_number_gt:λ, plus(x) ↦ L_number_plus:λ ⟧
          morphed 𝑛·5·3 := 𝑛·5·2
        boxed 𝑛·5·4 := 𝑛·5·3.φ
        𝛿·5·1 := 𝔻(𝜎4:λ)
      𝛿1·5 := 𝛿·5·1  # 𝔻(ξ.ρ)
      𝔻(ξ.x):
        𝕄(ξ.x):
          𝑛·5·5 := Φ.number( φ ↦ 𝑛·1·13 )
          𝑛·5·6 := ⟦ φ ↦ 𝑛·1·13, gt(x) ↦ L_number_gt:λ, plus(x) ↦ L_number_plus:λ ⟧
