---
# yamllint disable rule:line-length
# A lenient join reads the world along a φ chain until the chain ends (#1817),
# and the chain of 'Φ.x' never does, since the φ of 'x' is 'Φ.x' again. Every
# read spends a step of the budget, so the reads run out of steps and the join
# is refused rather than running forever: the firing gets stuck, the way it
# does on any chain that reaches no symbol.
symbolic: |
  - λ: L_fork
    morph:
      𝑛1: $.a
      𝑛2: $.b
    join:
      𝑛3: [𝑛1, 𝑛2]
    lenient: true
    𝑛: 𝑛3
location: 'Q.y'
deep: true
steps: 50
input: '⟦ x ↦ ⟦ φ ↦ Φ.x ⟧, y ↦ ⟦ r ↦ ⟦ a ↦ ⟦ λ ⤍ 𝜎1 ⟧, b ↦ ⟦ φ ↦ Φ.x ⟧, λ ⤍ L_fork ⟧ ⟧ ⟧'
fails: "No entry of --symbolic answers the λ function 'L_fork'"
protocol: |
  𝕄(Φ.y):
    𝕄(Φ.y.r):
      𝔼(L_fork):
        𝑛1·1 := 𝜎1:λ  # 𝕄(ξ.a)
        𝑛2·1 := Φ.x:φ  # 𝕄(ξ.b)
        stuck(L_fork)
