---
# yamllint disable rule:line-length
# A 'defer' line of a fork keeps a failure the way a 'stay' line does
# (#1967, #1982). The 'morph' of '$.b' gets stuck on 'L_none', which no entry
# answers, and the 'defer' line reading what it bound keeps the failure for
# the meta it binds rather than throwing. Only one path may run, so the fork
# takes the left side, and the run never meets the failure of the right one.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.c
    morph:
      𝑛1: $.a
      𝑛2: $.b
    defer:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    fork:
      on: 𝛿1
      left: 𝑛3
      right: 𝑛4
location: 'Q.y'
input: '⟦ y ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎1 ⟧, a ↦ ⟦ φ ↦ ⟦ Δ ⤍ 05- ⟧ ⟧, b ↦ ⟦ λ ⤍ L_none ⟧.x, λ ⤍ L_fork ⟧.φ ⟧'
result: '05-:Δ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝛿1·1 := 𝔻(𝜎1:λ)  # 𝔻(ξ.c)
      𝑛1·1 := 05-:Δ:φ  # 𝕄(ξ.a)
      𝕄(Φ.a🌵2):
        unanswered L_none  # 𝕄(L_none:λ)
      𝑛3·1 := 05-:Δ:φ  # 𝑛1
      forked 𝔻(𝜎1:λ) := left  # 𝑛3
      𝑛·1·1 := 05-:Δ:φ  # 𝑛3
