---
# Both operands of the firing are symbols the program came in with, and both
# dataize to the very same 42. Only the protocol tells them apart: it writes
# the symbol each datum was manufactured for, so 𝜎2 and 𝜎5 stay two unknowns
# and not one.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ Φ.number( φ ↦ ⟦ λ ⤍ 𝜎2 ⟧ ).plus(
          Φ.number( φ ↦ ⟦ λ ⤍ 𝜎5 ⟧ ) ) ⟧
result: '⟦ φ ↦ 𝜎6:λ, plus(x) ↦ L_number_plus:λ ⟧'
protocol: |
  𝕄(Φ.φ)
    applied(𝑛.0.1) := Φ.number( φ ↦ 𝜎2:λ )  # 𝕄(Φ.φ)
    applied(𝑛.0.2) := Φ.number( φ ↦ 𝜎2:λ ).plus  # 𝕄(Φ.φ)
    applied(𝑛.0.3) := Φ.number( φ ↦ 𝜎2:λ ).plus( x ↦ Φ.number( φ ↦ 𝜎5:λ ) )  # 𝕄(Φ.φ)
    applied(𝑛.0.4) := Φ.number( φ ↦ 𝜎5:λ )  # 𝕄(Φ.φ.x)
    𝔼(L_number_plus)  # 𝕄(Φ.φ)
      applied(𝑛.1.1) := Φ.number( φ ↦ 𝜎2:λ )  # 𝕄(Φ.a🌵0)
      formation(𝑛.1.1)  # 𝔻(Φ.a🌵0)
      𝛿1.1 := 𝔻(𝜎2:λ)  # 𝔻(ξ.ρ)
      applied(𝑛.1.2) := Φ.number( φ ↦ 𝜎5:λ )  # 𝕄(Φ.a🌵1)
      formation(𝑛.1.2)  # 𝔻(Φ.a🌵1)
      𝛿2.1 := 𝔻(𝜎5:λ)  # 𝔻(ξ.x)
      𝑛.1.3 := Φ.number( φ ↦ 𝜎6:λ )  # 𝑛
      applied(𝑛.1.4) := Φ.number( φ ↦ 𝜎6:λ )  # 𝕄(Φ.φ)
      𝑛.1.5 := 𝑛.1.4  # 𝕄(𝑛.1.3)
