---
# Both operands of the firing are symbols the program came in with, and both
# dataize to the very same 42. Only the protocol tells them apart: it writes
# the symbol each datum was manufactured for, so 𝜎2 and 𝜎5 stay two unknowns
# and not one.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ Φ.number( φ ↦ ⟦ λ ⤍ 𝜎2 ⟧ ).plus(
          Φ.number( φ ↦ ⟦ λ ⤍ 𝜎5 ⟧ ) ) ⟧
result: |
  ⟦
    φ ↦ ⟦ λ ⤍ 𝜎6 ⟧,
    plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧,
    ρ ↦ ⟦
      bytes(φ) ↦ ⟦⟧,
      number(φ) ↦ ⟦ plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
      φ ↦ Φ.number( φ ↦ ⟦ λ ⤍ 𝜎2 ⟧ ).plus( Φ.number( φ ↦ ⟦ λ ⤍ 𝜎5 ⟧ ) )
    ⟧
  ⟧
protocol: |
  𝕄(Φ.φ)
    𝔼(L_number_plus)
      𝛿1.1 := 𝔻(𝜎2)  # ξ.ρ
      𝛿2.1 := 𝔻(𝜎5)  # ξ.x
      𝑛.1 := ⟦ φ ↦ ⟦ λ ⤍ 𝜎6 ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧
