---
# yamllint disable rule:line-length
# 'block' is applied to 'buffer' only, so its void 'data' stays unfilled and
# the 'dataize' operand 'ρ.data.size' of 'L_dataized' reaches the terminator ⊥.
# Under '_partial' that parks the firing the way an operand parked on a λ
# function no entry answers does, rather than ending the run: the protocol
# writes '?(⊥)' with the term 𝔻 could not dataize, and the walk goes on to
# 'L_root', whose own operand dies the same way (#1401).
symbolic: |
  - λ: L_dataized
    dataize:
      𝛿1: $.target
    𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_entry
    dataize:
      𝛿1: $.n
    morph:
      𝑛1: $.v.φ
    𝑛: Φ.l🌵.root( 𝑛1 )
  - λ: L_root
    dataize:
      𝛿1: $.v
    𝑛: ⟦ ⟧
location: 'Q.l🌵'
deep: true
acyclic: proven
partial: true
steps: 32
input: >
  ⟦
    number ↦ ⟦ φ ↦ ∅ ⟧,
    bytes ↦ ⟦ φ ↦ ∅, size ↦ ⟦ λ ⤍ L_bytes_size ⟧ ⟧,
    dataized ↦ ⟦ target ↦ ∅, λ ⤍ L_dataized ⟧,
    block ↦ ⟦ data ↦ ∅, buffer ↦ ∅, read ↦ ⟦ φ ↦ Φ.dataized( target ↦ ξ.ρ.data.size ).as-bytes ⟧ ⟧,
    l🌵 ↦ ⟦
      mark ↦ ⟦ n ↦ ∅, v ↦ ∅, λ ⤍ L_entry ⟧,
      root ↦ ⟦ v ↦ ∅, λ ⤍ L_root ⟧,
      e1 ↦ Φ.l🌵.mark( n ↦ Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍ 3F-F0-00-00-00-00-00-00 ⟧ ) ) )( v ↦ Φ.block( buffer ↦ Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎1 ⟧ ) ).read )
    ⟧
  ⟧
result: '⟦ mark(n, v) ↦ ⟦ λ ⤍ L_entry ⟧, root(v) ↦ ⟦ λ ⤍ L_root ⟧, e1 ↦ ⟦ v ↦ Φ.dataized( target ↦ ⊥ ).as-bytes, λ ⤍ L_root ⟧ ⟧'
protocol: |
  𝕄(Φ.l🌵)
    𝔼(L_entry)  # 𝕄(Φ.l🌵.e1)
      formation(Φ.bytes( φ ↦ 3F-F0-00-00-00-00-00-00:Δ ):φ)  # 𝔻(Φ.a🌵0)
        formation(⟦ φ ↦ 3F-F0-00-00-00-00-00-00:Δ, size ↦ L_bytes_size:λ ⟧)  # 𝔻(Φ.a🌵0)
      𝛿1.1 := 3F-F0-00-00-00-00-00-00  # 𝔻(ξ.n)
      𝔼(L_dataized)  # 𝕄(Φ.a🌵1)
        ?(⊥)  # 𝔻(⊥)
      𝔼(L_dataized)  # 𝕄(Φ.a🌵1)
      𝔼(L_dataized)  # 𝕄(Φ.a🌵1)
      𝔼(L_dataized)  # 𝕄(Φ.a🌵1)
      𝑛1.1 := Φ.dataized( target ↦ ⊥ ).as-bytes  # 𝕄(ξ.v.φ)
      𝑛.1.1 := Φ.l🌵.root( Φ.dataized( target ↦ ⊥ ).as-bytes )  # 𝑛
      𝑛.1.2 := ⟦ v ↦ Φ.dataized( target ↦ ⊥ ).as-bytes, λ ⤍ L_root ⟧  # 𝕄(𝑛.1.1)
    𝔼(L_root)  # 𝕄(Φ.l🌵.e1)
      𝔼(L_dataized)  # 𝕄(Φ.a🌵6)
        ?(⊥)  # 𝔻(⊥)
