---
# yamllint disable rule:line-length
# The memo of '--acyclic=plausible' keeps an answer by the operands a firing
# brought down, and a symbol is an operand of its own: every symbol dataizes
# to the one manufactured datum, so two firings over two symbols come down to
# the same bytes, yet they stand for two values nobody worked out. A memo
# keyed on the bytes would answer the second firing with the symbol the first
# one minted and make the two values one; this one keys on the symbol, so each
# firing mints a symbol of its own. The two firings are the two 'morph'
# operands of 'L_pair', each fired by the dispatch of φ off its call.
symbolic: |
  - λ: L_dataized
    dataize:
      𝛿1: $.target
    𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_pair
    morph:
      𝑛1: $.x
      𝑛2: $.y
    𝑛: ⟦ φ ↦ ⟦ x ↦ 𝑛1, y ↦ 𝑛2 ⟧ ⟧
location: 'Q.@'
acyclic: plausible
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    dataized(target) ↦ L_dataized:λ,
    pair(x, y) ↦ L_pair:λ,
    φ ↦ Φ.pair(
      Φ.dataized( Φ.bytes( φ ↦ 𝜎1:λ ) ).φ,
      Φ.dataized( Φ.bytes( φ ↦ 𝜎2:λ ) ).φ ).φ ⟧
result: '⟦ x ↦ 𝜎3:λ, y ↦ 𝜎4:λ ⟧'
protocol: |
  𝕄(Φ.φ):
    remembered 𝑛·0·1 ≡ Φ.pair  # ⟦ x ↦ ∅, y ↦ ∅, λ ⤍ L_pair ⟧
    𝑛·0·2 := Φ.pair( x ↦ Φ.dataized( Φ.bytes( φ ↦ 𝜎1:λ ) ).φ )
    𝑛·0·3 := ⟦ x ↦ Φ.dataized( Φ.bytes( φ ↦ 𝜎1:λ ) ).φ, y ↦ ∅, λ ⤍ L_pair ⟧
    remembered 𝑛·0·3 ≡ 𝑛·0·1( x ↦ Φ.dataized( Φ.bytes( φ ↦ 𝜎1:λ ) ).φ )
    𝑛·0·4 := 𝑛·0·2( y ↦ Φ.dataized( Φ.bytes( φ ↦ 𝜎2:λ ) ).φ )
    𝑛·0·5 := ⟦ x ↦ Φ.dataized( Φ.bytes( φ ↦ 𝜎1:λ ) ).φ, y ↦ Φ.dataized( Φ.bytes( φ ↦ 𝜎2:λ ) ).φ, λ ⤍ L_pair ⟧
    remembered 𝑛·0·5 ≡ 𝑛·0·3( y ↦ Φ.dataized( Φ.bytes( φ ↦ 𝜎2:λ ) ).φ )
    𝔼(L_pair):
      𝕄(ξ.x):
        remembered 𝑛·1·1 ≡ Φ.dataized  # ⟦ target ↦ ∅, λ ⤍ L_dataized ⟧
        𝑛·1·2 := Φ.dataized( target ↦ Φ.bytes( φ ↦ 𝜎1:λ ) )
        𝑛·1·3 := ⟦ target ↦ Φ.bytes( φ ↦ 𝜎1:λ ), λ ⤍ L_dataized ⟧
        remembered 𝑛·1·3 ≡ 𝑛·1·1( target ↦ Φ.bytes( φ ↦ 𝜎1:λ ) )
        𝔼(L_dataized):
          𝔻(ξ.target):
            𝕄(ξ.target):
              normalized 𝑛·2·1 := ∅:φ  # Φ.bytes
              𝑛·2·2 := Φ.bytes( φ ↦ 𝜎1:λ )
              𝑛·2·3 := 𝜎1:λ:φ
              morphed 𝑛·2·4 := 𝑛·2·3
            boxed 𝑛·2·5 := 𝑛·2·4.φ
            normalized 𝑛·2·6 := 𝜎1:λ  # 𝑛·2·5
            𝛿·2·1 := 𝔻(𝜎1:λ)
          𝛿1·2 := 𝛿·2·1  # 𝔻(ξ.target)
          𝑛·2·7 := Φ.bytes( φ ↦ 𝜎3:λ )  # 𝑛
          𝕄(𝑛·2·7):
            𝑛·2·8 := Φ.bytes( φ ↦ 𝜎3:λ )
            𝑛·2·9 := 𝜎3:λ:φ
            morphed 𝑛·2·10 := 𝑛·2·9
          𝑛·2·11 := 𝑛·2·10  # 𝕄(𝑛·2·7)
          remembered 𝑛·2·11 ≡ 𝑛·1·3
          memoized 𝑛·1·3 ⇛ 𝑛·2·11
        normalized 𝑛·1·4 := 𝜎3:λ  # 𝑛·2·11.φ
        morphed 𝑛·1·5 := 𝑛·1·4
      𝑛1·1 := 𝑛·1·4  # 𝕄(ξ.x)
      𝕄(ξ.y):
        𝑛·1·6 := Φ.dataized( target ↦ Φ.bytes( φ ↦ 𝜎2:λ ) )
        𝑛·1·7 := ⟦ target ↦ Φ.bytes( φ ↦ 𝜎2:λ ), λ ⤍ L_dataized ⟧
        remembered 𝑛·1·7 ≡ 𝑛·1·1( target ↦ Φ.bytes( φ ↦ 𝜎2:λ ) )
        𝔼(L_dataized):
          𝔻(ξ.target):
            𝕄(ξ.target):
              𝑛·3·1 := Φ.bytes( φ ↦ 𝜎2:λ )
              𝑛·3·2 := 𝜎2:λ:φ
              morphed 𝑛·3·3 := 𝑛·3·2
            boxed 𝑛·3·4 := 𝑛·3·3.φ
            normalized 𝑛·3·5 := 𝜎2:λ  # 𝑛·3·4
            𝛿·3·1 := 𝔻(𝜎2:λ)
          𝛿1·3 := 𝛿·3·1  # 𝔻(ξ.target)
          𝑛·3·6 := Φ.bytes( φ ↦ 𝜎4:λ )  # 𝑛
          𝕄(𝑛·3·6):
            𝑛·3·7 := Φ.bytes( φ ↦ 𝜎4:λ )
            𝑛·3·8 := 𝜎4:λ:φ
            morphed 𝑛·3·9 := 𝑛·3·8
          𝑛·3·10 := 𝑛·3·9  # 𝕄(𝑛·3·6)
          remembered 𝑛·3·10 ≡ 𝑛·1·7
          memoized 𝑛·1·7 ⇛ 𝑛·3·10
        normalized 𝑛·1·8 := 𝜎4:λ  # 𝑛·3·10.φ
        morphed 𝑛·1·9 := 𝑛·1·8
      𝑛2·1 := 𝑛·1·8  # 𝕄(ξ.y)
      𝑛·1·10 := ⟦ x ↦ 𝜎3:λ, y ↦ 𝜎4:λ ⟧:φ  # 𝑛
      𝕄(𝑛·1·10):
        morphed 𝑛·1·11 := ⟦ x ↦ 𝜎3:λ, y ↦ 𝜎4:λ ⟧:φ
      𝑛·1·12 := 𝑛·1·11  # 𝕄(𝑛·1·10)
      remembered 𝑛·1·12 ≡ 𝑛·0·5
      memoized 𝑛·0·5 ⇛ 𝑛·1·12
    normalized 𝑛·0·6 := ⟦ x ↦ 𝜎3:λ, y ↦ 𝜎4:λ ⟧  # 𝑛·1·12.φ
    morphed 𝑛·0·7 := 𝑛·0·6
