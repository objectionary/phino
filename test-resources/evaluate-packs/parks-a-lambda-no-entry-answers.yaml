---
# The same λ function under '_partial': the run ends on the residue the spine
# had reached instead of failing.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.x'
partial: true
input: '⟦ x ↦ ⟦ λ ⤍ L_none ⟧.foo ⟧'
result: '⟦ λ ⤍ L_none ⟧.foo'
protocol: |
  𝕄(Φ.x)
    ?(L_none)  # 𝕄(⟦ λ ⤍ L_none ⟧)
