---
# yamllint disable rule:line-length
# The memo of '--acyclic=plausible' keeps what a firing answered by the λ
# function and the operands it brought down, beside the formation it fired.
# The 'evaluate' lines of 'L_pair' fire 'a' and then 'b', two formations,
# since one reads 'x' and the other reads 'y', so the memo of formations
# misses the second. Yet both bring the same datum down, and an entry
# answers from its operands alone. Before #1661 the firing of 'b' minted
# '𝜎2' for the very value '𝜎1' already named. Now it brings its operand
# down, finds the firing already answered and takes '𝜎1', minting nothing
# (#1874).
symbolic: |
  - λ: L_dataized
    dataize:
      𝛿1: $.target
    𝑛: ⟦ λ ⤍ 𝜎 ⟧
  - λ: L_pair
    morph:
      𝑛1: $.a
      𝑛2: $.b
    evaluate:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    𝑛: ⟦ φ ↦ ⟦ a ↦ 𝑛3, b ↦ 𝑛4 ⟧ ⟧
location: 'Q.p'
acyclic: plausible
input: >
  ⟦ dataized(target) ↦ L_dataized:λ,
    p ↦ ⟦
      a ↦ Φ.dataized( target ↦ Φ.x ),
      b ↦ Φ.dataized( target ↦ Φ.y ),
      λ ⤍ L_pair ⟧.φ,
    x ↦ ⟦ Δ ⤍ 01- ⟧,
    y ↦ ⟦ Δ ⤍ 01- ⟧ ⟧
result: '⟦ a ↦ 𝜎1:λ, b ↦ 𝜎1:λ ⟧'
protocol: |
  𝕄(Φ.p):
    𝔼(L_pair):
      𝕄(ξ.a):
        remembered 𝑛·1·1 ≡ Φ.dataized  # ⟦ target ↦ ∅, λ ⤍ L_dataized ⟧
        normalized 𝑛·1·2 := 𝑛·1·1
        𝑛·1·3 := Φ.dataized( target ↦ Φ.x )
        𝑛·1·4 := ⟦ target ↦ Φ.x, λ ⤍ L_dataized ⟧
        remembered 𝑛·1·4 ≡ 𝑛·1·1( target ↦ Φ.x )
        normalized 𝑛·1·5 := 𝑛·1·4
        normalized 𝑛·1·6 := 𝑛·1·4
        morphed 𝑛·1·7 := 𝑛·1·4
      𝑛1·1 := 𝑛·1·4  # 𝕄(ξ.a)
      𝕄(ξ.b):
        normalized 𝑛·1·8 := 𝑛·1·1
        𝑛·1·9 := Φ.dataized( target ↦ Φ.y )
        𝑛·1·10 := ⟦ target ↦ Φ.y, λ ⤍ L_dataized ⟧
        remembered 𝑛·1·10 ≡ 𝑛·1·1( target ↦ Φ.y )
        normalized 𝑛·1·11 := 𝑛·1·10
        normalized 𝑛·1·12 := 𝑛·1·10
        morphed 𝑛·1·13 := 𝑛·1·10
      𝑛2·1 := 𝑛·1·10  # 𝕄(ξ.b)
      recalled 𝑛·1·4 ⇒ 𝑛·1·1( target ↦ Φ.x )
      recalled 𝑛·1·1 ⇒ Φ.dataized
      𝔼(L_dataized):  # 𝔼(𝑛1)
        𝔻(ξ.target):
          𝕄(ξ.target):
            normalized 𝑛·2·1 := 01-:Δ
            normalized 𝑛·2·2 := 01-:Δ
            morphed 𝑛·2·3 := 01-:Δ
          𝛿·2·1 := 01-
        𝛿1·2 := 𝛿·2·1  # 𝔻(ξ.target)
        𝑛·2·4 := 𝜎1:λ  # 𝑛
        𝕄(𝑛·2·4):
          morphed 𝑛·2·5 := 𝜎1:λ
        𝑛·2·6 := 𝑛·2·5  # 𝕄(𝑛·2·4)
        memoized 𝑛·1·4 ⇛ 𝜎1:λ
      𝑛3·1 := 𝑛·2·6  # 𝔼(𝑛1)
      recalled 𝑛·1·10 ⇒ 𝑛·1·1( target ↦ Φ.y )
      recalled 𝑛·1·1 ⇒ Φ.dataized
      𝔼(L_dataized):  # 𝔼(𝑛2)
        𝔻(ξ.target):
          𝕄(ξ.target):
            normalized 𝑛·3·1 := 01-:Δ
            normalized 𝑛·3·2 := 01-:Δ
            morphed 𝑛·3·3 := 01-:Δ
          𝛿·3·1 := 01-
        𝛿1·3 := 𝛿·3·1  # 𝔻(ξ.target)
        recalled 𝑛·1·4 ⇒ 𝜎1:λ
        𝑛·3·4 := 𝑛3·1  # 𝑛
        𝑛·3·5 := 𝑛3·1  # 𝕄(𝑛·3·4)
        memoized 𝑛·1·10 ⇛ 𝜎1:λ
      𝑛4·1 := 𝑛·3·5  # 𝔼(𝑛2)
      𝑛·1·14 := ⟦ a ↦ 𝜎1:λ, b ↦ 𝜎1:λ ⟧:φ  # 𝑛
      𝕄(𝑛·1·14):
        morphed 𝑛·1·15 := ⟦ a ↦ 𝜎1:λ, b ↦ 𝜎1:λ ⟧:φ
      𝑛·1·16 := 𝑛·1·15  # 𝕄(𝑛·1·14)
      memoized 𝑛·1·17 ⇛ 𝑛·1·16  # ⟦ a ↦ 𝑛·1·3, b ↦ 𝑛·1·9, λ ⤍ L_pair ⟧
    normalized 𝑛·0·1 := ⟦ a ↦ 𝜎1:λ, b ↦ 𝜎1:λ ⟧
    morphed 𝑛·0·2 := 𝑛·0·1
