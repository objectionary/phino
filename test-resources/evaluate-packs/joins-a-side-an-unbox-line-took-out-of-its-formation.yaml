---
# yamllint disable rule:line-length
# The right side morphs down to an object inside a formation that binds
# nothing but φ, the way the 'false' of 'bool.and' of EO comes, while the left
# side is the object alone. The formation around it is a shape apart, so the
# join could never make one term of the two (#2000). An 'unbox' line takes the
# object out of the formation and leaves the left side as it is, since an
# object binding 'not' beside φ is no such formation. The two objects differ in
# their symbols alone, and the join makes one term of them.
# The protocol writes the line of '𝑛4', which took the object out, as an
# 'unboxed' record, and the line of '𝑛3', which changed nothing, as the plain
# line of a meta bound to what another meta holds.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.c
    morph:
      𝑛1: $.a
      𝑛2: $.b
    unbox:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      on: 𝛿1
      left: 𝑛3
      right: 𝑛4
location: 'Q.y'
hide-rho: false
input: '⟦ y ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎1 ⟧, a ↦ ⟦ φ ↦ ⟦ λ ⤍ 𝜎2 ⟧, not ↦ ⟦⟧ ⟧, b ↦ ⟦ φ ↦ ⟦ φ ↦ ⟦ λ ⤍ 𝜎3 ⟧, not ↦ ⟦⟧ ⟧ ⟧, λ ⤍ L_fork ⟧.φ ⟧'
result: '𝜎4:λ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝛿1·1 := 𝔻(𝜎1:λ)  # 𝔻(ξ.c)
      𝑛1·1 := ⟦ φ ↦ 𝜎2:λ, not ↦ ⟦⟧ ⟧  # 𝕄(ξ.a)
      𝑛2·1 := ⟦ φ ↦ 𝜎3:λ, not ↦ ⟦⟧ ⟧:φ  # 𝕄(ξ.b)
      𝑛3·1 := 𝑛1·1  # 𝑛1
      unboxed 𝑛4·1 := ⟦ φ ↦ 𝜎3:λ, not ↦ ⟦⟧ ⟧  # 𝑛2
      joined 𝜎4 := 𝛿1·1 ? 𝜎2 : 𝜎3
      𝑛·1·1 := ⟦ φ ↦ 𝜎4:λ, not ↦ ⟦⟧ ⟧  # 𝑛3, 𝑛4
