---
# yamllint disable rule:line-length
# A loop walking an index from zero up to a size that is a symbol, under
# '--acyclic=plausible'. The first round holds the number '0', the second holds
# the symbol 'plus' answered in its place, and a symbol stands for a term that
# holds no symbol of its own, so the fork of the second round is cut against
# the fork of the first one rather than a round later (#1491). The cut fork is
# the φ of a copy of 'rec', so the cut answers that copy with a fresh symbol,
# which the 'join' of the first fork pairs with the other branch (#1735).
symbolic: |
  - λ: L_id
    morph:
      𝑛1: $.x.φ
    𝑛: 𝑛1
  - λ: L_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.b
    𝑛: Φ.num( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_eq
    dataize:
      𝛿1: $.ρ
      𝛿2: $.b
    𝑛: ⟦ φ ↦ Φ.bool( if ↦ ⟦ λ ⤍ L_fork, left ↦ ∅, right ↦ ∅, φ ↦ ⟦ λ ⤍ 𝜎 ⟧ ⟧ ) ⟧
  - λ: L_fork
    dataize:
      𝛿1: $.φ
    morph:
      𝑛1: $.left
      𝑛2: $.right
    symbolize:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      𝑛5: [𝑛3, 𝑛4]
    𝑛: 𝑛5
location: 'Q.a'
deep: true
acyclic: plausible
partial: true
steps: 32
