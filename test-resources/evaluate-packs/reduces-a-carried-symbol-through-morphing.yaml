---
# A 'morph' operand of the firing is a symbol the program already carried:
# 𝕄 hands it back the way it found it, since a symbol is already a normal form
# and there is nothing under it to reduce. The answer then mints after it.
symbolic: |
  - λ: L_keep
    morph:
      𝑛1: $.x
    𝑛: ⟦ z ↦ ⟦ λ ⤍ 𝜎 ⟧ ⟧
location: 'Q.y'
input: '⟦ y ↦ ⟦ x ↦ ⟦ λ ⤍ 𝜎4 ⟧, λ ⤍ L_keep ⟧.z ⟧'
result: >
  ⟦ λ ⤍ 𝜎5,
    ρ ↦ ⟦ z ↦ ⟦ λ ⤍ 𝜎5, ρ ↦ ∅ ⟧, ρ ↦ ∅ ⟧ ⟧
protocol: |
  𝕄(Φ.y)
    𝔼(L_keep)
      𝑛1.1 := ⟦ λ ⤍ 𝜎4, ρ ↦ ⟦ x ↦ ⟦ λ ⤍ 𝜎4 ⟧ ⟧ ⟧  # ξ.x
      𝑛.1.1 := ⟦ z ↦ ⟦ λ ⤍ 𝜎5 ⟧ ⟧  # 𝑛
      𝑛.1.2 := ⟦ z ↦ ⟦ λ ⤍ 𝜎5 ⟧ ⟧  # 𝕄(𝑛.1.1)
