---
# yamllint disable rule:line-length
# The body of 'foo' raises with a message, as EO writes 'T "oops" > @', and no
# rule of normalization drops the argument of ⊥ any more, so the entry that
# morphs the body answers ⊥ with the message, and the protocol carries it
# (#1765).
symbolic: |
  - λ: L_entry
    morph:
      𝑛1: $.v.φ
    𝑛: 𝑛1
location: 'Q.e'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    string(φ) ↦ ⟦ length ↦ ⟦⟧ ⟧,
    foo ↦ ⟦ x ↦ ∅, φ ↦ ⊥( "oops" ) ⟧,
    entry ↦ ⟦ v ↦ ∅, λ ⤍ L_entry ⟧,
    e ↦ Φ.entry( v ↦ Φ.foo( x ↦ ⟦⟧ ) ) ⟧
result: |-
  ⊥( "oops" )
protocol: |
  𝕄(Φ.e):
    𝑛·0·1 := Φ.entry( v ↦ Φ.foo( x ↦ ⟦⟧ ) )
    𝕄(Φ.e.v):
      𝑛·0·2 := Φ.foo( x ↦ ⟦⟧ )
    𝔼(L_entry):
      𝕄(Φ.a🌵0):
        𝑛·1·1 := Φ.foo( x ↦ ⟦⟧ )
        𝑛·1·2 := Φ.bytes( φ ↦ 6F-6F-70-73:Δ )
        𝑛·1·3 := Φ.string( φ ↦ 𝑛·1·2 )
      𝑛1·1 := ⊥( 𝑛·1·3 )  # 𝕄(ξ.v.φ)
      𝑛·1·4 := ⊥( 𝑛·1·3 )  # 𝑛
      𝑛·1·5 := ⊥( 𝑛·1·3 )  # 𝕄(𝑛·1·4)
