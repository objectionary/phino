---
# yamllint disable rule:line-length
# The deep walk writes what it morphed back into the copy it stands in, not
# only into the world as written (#1720). Here 'm' lives in the copy
# 'Φ.same( left ↦ … )', and 'φ' reads it twice before the walk reaches 'm'.
# Before, every read fired 'L_bytes_eq' again, and so did the walk at 'm'. Now
# the first read leaves the answer in 'm', so the second read and the walk at
# 'm' fire nothing, and 'L_bytes_eq' fires twice: once for 'm' and once for
# 'm.eq( b ↦ m )'.
symbolic: |
  - λ: L_bytes_eq
    dataize:
      𝛿1: $.ρ
      𝛿2: $.b
    𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.e'
deep: true
partial: true
acyclic: plausible
input: >
  ⟦ bytes(φ) ↦ ⟦ eq(ρ, b) ↦ L_bytes_eq:λ ⟧,
    same(left) ↦ ⟦ φ ↦ m.eq( b ↦ m ), m ↦ left.eq( b ↦ Φ.bytes( φ ↦ 00-:Δ ) ) ⟧,
    e ↦ Φ.same( left ↦ Φ.bytes( φ ↦ 𝜎1:λ ) ) ⟧
result: >
  ⟦ left ↦ Φ.bytes( φ ↦ 𝜎1:λ ),
    φ ↦ ⟦ φ ↦ 𝜎3:λ, eq(b) ↦ L_bytes_eq:λ ⟧,
    m ↦ ⟦ φ ↦ 𝜎2:λ, eq(b) ↦ L_bytes_eq:λ ⟧ ⟧
protocol: |
  𝕄(Φ.e)
    𝔼(L_bytes_eq)  # 𝕄(Φ.e.φ)
      formation(⟦ φ ↦ 𝜎1:λ, eq(b) ↦ L_bytes_eq:λ ⟧)  # 𝔻(Φ.a🌵0)
      𝛿1.1 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      formation(⟦ φ ↦ 00-:Δ, eq(b) ↦ L_bytes_eq:λ ⟧)  # 𝔻(Φ.a🌵1)
      𝛿2.1 := 00-  # 𝔻(ξ.b)
      𝑛.1.1 := Φ.bytes( φ ↦ 𝜎2:λ )  # 𝑛
      𝑛.1.2 := ⟦ φ ↦ 𝜎2:λ, eq(b) ↦ L_bytes_eq:λ ⟧  # 𝕄(𝑛.1.1)
    𝔼(L_bytes_eq)  # 𝕄(Φ.e.φ)
      formation(⟦ φ ↦ 𝜎2:λ, eq(b) ↦ L_bytes_eq:λ ⟧)  # 𝔻(Φ.a🌵2)
      𝛿1.2 := 𝔻(𝜎2:λ)  # 𝔻(ξ.ρ)
      formation(⟦ φ ↦ 𝜎2:λ, eq(b) ↦ L_bytes_eq:λ ⟧)  # 𝔻(Φ.a🌵3)
      𝛿2.2 := 𝔻(𝜎2:λ)  # 𝔻(ξ.b)
      𝑛.2.1 := Φ.bytes( φ ↦ 𝜎3:λ )  # 𝑛
      𝑛.2.2 := ⟦ φ ↦ 𝜎3:λ, eq(b) ↦ L_bytes_eq:λ ⟧  # 𝕄(𝑛.2.1)
