---
# yamllint disable rule:line-length
# The two sides of 'L_fork' differ in shape, so the firing fabricates a
# formation, naming its parts as the 'otherwise' of the block says: the
# condition under 'c🌵' and the sides under 'a🌵' and 'b🌵', the very names
# 'L_fork' reads (#2483). The program asks that formation for 'φ', a copy of
# 'L_fork' itself, and asks it for 'φ' too, which fires it again and finds there the condition and both
# sides, two copies of 'hx' that differ in a symbol alone, so its join mints
# a fresh symbol for them.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.c🌵
    join:
      on: 𝛿1
      left: $.a🌵
      right: $.b🌵
      otherwise:
        λ: L_fork
        on: c🌵
        left: a🌵
        right: b🌵
location: 'Q.y'
input: '⟦ hx(ke) ↦ ⟦ φ ↦ ke ⟧, y ↦ ⟦ c🌵 ↦ ⟦ λ ⤍ 𝜎1 ⟧, a🌵 ↦ ⟦ φ ↦ Φ.hx( ke ↦ ⟦ λ ⤍ 𝜎2 ⟧ ), ob ↦ Φ.hx ⟧, b🌵 ↦ ⟦ φ ↦ Φ.hx( ke ↦ ⟦ λ ⤍ 𝜎3 ⟧ ) ⟧, λ ⤍ L_fork ⟧.φ.φ ⟧'
result: '𝜎4:λ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝔻(ξ.c🌵):
        𝛿·1·1 ≔ 𝔻(𝜎1:λ)
      𝛿1·1 ≔ 𝛿·1·1  # 𝔻(ξ.c🌵)
      𝕄(ξ.a🌵):
        morphed 𝑛·1·1 ≔ ⟦ φ ↦ Φ.hx( ke ↦ 𝜎2:λ ), ob ↦ Φ.hx ⟧
      𝕄(ξ.b🌵):
        morphed 𝑛·1·2 ≔ Φ.hx( ke ↦ 𝜎3:λ ):φ
      fabricated 𝑛·1·3 ≔ 𝑛·1·1 and 𝑛·1·2  # ⟦ a🌵 ↦ 𝑛·1·1, b🌵 ↦ 𝑛·1·2, φ ↦ ⟦ λ ⤍ L_fork, c🌵 ↦ 𝜎1:λ, a🌵 ↦ ρ.a🌵.φ, b🌵 ↦ ρ.b🌵.φ ⟧, ob ↦ ⟦ λ ⤍ L_fork, c🌵 ↦ 𝜎1:λ, a🌵 ↦ ρ.a🌵.ob, b🌵 ↦ ρ.b🌵.ob ⟧ ⟧
      evaluated 𝑛·1·4 ≔ 𝑛·1·3  # ⟦ c🌵 ↦ 𝜎1:λ, a🌵 ↦ 𝑛·1·1, b🌵 ↦ 𝑛·1·2, λ ⤍ L_fork ⟧
    normalized 𝑛·0·1 ≔ ⟦ λ ⤍ L_fork, c🌵 ↦ 𝜎1:λ, a🌵 ↦ ρ.a🌵.φ, b🌵 ↦ ρ.b🌵.φ ⟧  # 𝑛·1·4.φ
    𝔼(L_fork):
      𝔻(ξ.c🌵):
        𝛿·2·1 ≔ 𝔻(𝜎1:λ)
      𝛿1·2 ≔ 𝛿·2·1  # 𝔻(ξ.c🌵)
      𝕄(ξ.a🌵):
        remembered 𝑛·2·1 ≡ Φ.hx  # ⟦ ke ↦ ∅, φ ↦ ke ⟧
        𝑛·2·2 ≔ Φ.hx( ke ↦ 𝜎2:λ )
        𝑛·2·3 ≔ ⟦ ke ↦ 𝜎2:λ, φ ↦ ke ⟧
        remembered 𝑛·2·3 ≡ 𝑛·2·1( ke ↦ 𝜎2:λ )
        morphed 𝑛·2·4 ≔ 𝑛·2·3
      𝕄(ξ.b🌵):
        𝑛·2·5 ≔ Φ.hx( ke ↦ 𝜎3:λ )
        𝑛·2·6 ≔ ⟦ ke ↦ 𝜎3:λ, φ ↦ ke ⟧
        remembered 𝑛·2·6 ≡ 𝑛·2·1( ke ↦ 𝜎3:λ )
        morphed 𝑛·2·7 ≔ 𝑛·2·6
      joined 𝜎4 ≔ 𝛿1·2 ? 𝜎2 : 𝜎3
      𝑛·2·8 ≔ ⟦ ke ↦ 𝜎4:λ, φ ↦ ke ⟧
      evaluated 𝑛·2·9 ≔ 𝑛·2·8  # ⟦ λ ⤍ L_fork, c🌵 ↦ 𝜎1:λ, a🌵 ↦ ρ.a🌵.φ, b🌵 ↦ ρ.b🌵.φ ⟧
    normalized 𝑛·0·2 ≔ 𝜎4:λ  # 𝑛·2·9.φ
    morphed 𝑛·0·3 ≔ 𝑛·0·2
