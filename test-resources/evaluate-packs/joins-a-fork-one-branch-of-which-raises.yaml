---
# yamllint disable rule:line-length
# A fork one branch of which is a literal ⊥ is how a program spells "raise
# unless the condition holds", and the other branch is a perfectly good value.
# The deep walk fires it, since that ⊥ is an argument the program wrote and no
# ξ.ρ the walk reduced to nothing, and the join says on which side of the
# condition the program raises and answers the other side (#1405).
symbolic: |
  - λ: L_number_gt
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.ρ
    morph:
      𝑛1: $.then
      𝑛2: $.else
    symbolize:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      𝑛5: [𝑛3, 𝑛4]
    𝑛: 𝑛5
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    bool(φ) ↦ ⟦ if ↦ ⟦ ρ ↦ ∅, then ↦ ∅, else ↦ ∅, λ ⤍ L_fork ⟧ ⟧,
    number(φ) ↦ ⟦
      gt(ρ, x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.gt( 0 ).if( then ↦ 1.plus( 2 ), else ↦ ⊥ ).plus( 6 ) ⟧
result: >-
  ⟦ φ ↦ ⟦ λ ⤍ 𝜎3 ⟧, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧ ⟧
protocol: |
  𝕄(Φ.φ)
    𝔼(L_number_gt)  # 𝕄(Φ.φ)
      formation(⟦ φ ↦ Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ ), gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵0)
        formation(40-14-00-00-00-00-00-00:Δ:φ)  # 𝔻(Φ.a🌵0)
      𝛿1.1 := 40-14-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      formation(⟦ φ ↦ Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ ), gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵1)
        formation(00-00-00-00-00-00-00-00:Δ:φ)  # 𝔻(Φ.a🌵1)
      𝛿2.1 := 00-00-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.1.1 := Φ.bool( φ ↦ 𝜎1:λ )  # 𝑛
      𝑛.1.2 := ⟦ φ ↦ 𝜎1:λ, if(then, else) ↦ ⟦ λ ⤍ L_fork ⟧ ⟧  # 𝕄(𝑛.1.1)
    𝔼(L_fork)  # 𝕄(Φ.φ)
      formation(⟦ φ ↦ 𝜎1:λ, if(then, else) ↦ ⟦ λ ⤍ L_fork ⟧ ⟧)  # 𝔻(Φ.a🌵2)
      𝛿1.2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      𝔼(L_number_plus)  # 𝕄(Φ.a🌵3)
        formation(⟦ φ ↦ Φ.bytes( φ ↦ 3F-F0-00-00-00-00-00-00:Δ ), gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵4)
          formation(3F-F0-00-00-00-00-00-00:Δ:φ)  # 𝔻(Φ.a🌵4)
        𝛿1.3 := 3F-F0-00-00-00-00-00-00  # 𝔻(ξ.ρ)
        formation(⟦ φ ↦ Φ.bytes( φ ↦ 40-00-00-00-00-00-00-00:Δ ), gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵5)
          formation(40-00-00-00-00-00-00-00:Δ:φ)  # 𝔻(Φ.a🌵5)
        𝛿2.3 := 40-00-00-00-00-00-00-00  # 𝔻(ξ.x)
        𝑛.3.1 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
        𝑛.3.2 := ⟦ φ ↦ 𝜎2:λ, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧  # 𝕄(𝑛.3.1)
      𝑛1.2 := 𝑛.3.2  # 𝕄(ξ.then)
      𝑛2.2 := ⊥  # 𝕄(ξ.else)
      𝑛3.2 := 𝑛1.2  # 𝑛1
      𝑛4.2 := ⊥  # 𝑛2
      terminate(𝔻(𝜎1:λ), right)  # 𝑛4
      𝑛5.2 := 𝑛3.2  # [𝑛3, 𝑛4]
      𝑛.2.1 := 𝑛5.2  # 𝑛
      𝑛.2.2 := 𝑛5.2  # 𝕄(𝑛.2.1)
    𝔼(L_number_plus)  # 𝕄(Φ.φ)
      formation(⟦ φ ↦ 𝜎2:λ, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵7)
      𝛿1.4 := 𝔻(𝜎2:λ)  # 𝔻(ξ.ρ)
      formation(⟦ φ ↦ Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ ), gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵8)
        formation(40-18-00-00-00-00-00-00:Δ:φ)  # 𝔻(Φ.a🌵8)
      𝛿2.4 := 40-18-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.4.1 := Φ.number( φ ↦ 𝜎3:λ )  # 𝑛
      𝑛.4.2 := ⟦ φ ↦ 𝜎3:λ, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧  # 𝕄(𝑛.4.1)
