---
# yamllint disable rule:line-length
# A fork one branch of which is a literal ⊥ is how a program spells "raise
# unless the condition holds", and the other branch is a perfectly good value.
# The deep walk fires it, since that ⊥ is an argument the program wrote and no
# ξ.ρ the walk reduced to nothing, and the join says on which side of the
# condition the program raises and answers the other side (#1405).
symbolic: |
  - λ: L_number_gt
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.ρ
    morph:
      𝑛1: $.then
      𝑛2: $.else
    symbolize:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      𝑛5: [𝑛3, 𝑛4]
    𝑛: 𝑛5
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    bool(φ) ↦ ⟦ if ↦ ⟦ ρ ↦ ∅, then ↦ ∅, else ↦ ∅, λ ⤍ L_fork ⟧ ⟧,
    number(φ) ↦ ⟦
      gt(ρ, x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.gt( 0 ).if( then ↦ 1.plus( 2 ), else ↦ ⊥ ).plus( 6 ) ⟧
result: |-
  ⟦ φ ↦ 𝜎3:λ, gt(x) ↦ L_number_gt:λ, plus(x) ↦ L_number_plus:λ ⟧
protocol: |
  𝕄(Φ.φ)
    applied(𝑛.0.1) := 5  # 𝕄(Φ.φ)
    applied(𝑛.0.2) := 5.gt( x ↦ 0 )  # 𝕄(Φ.φ)
    𝔼(L_number_gt)  # 𝕄(Φ.φ)
      applied(𝑛.1.1) := 5  # 𝕄(Φ.a🌵0)
      formation(𝑛.1.1)  # 𝔻(Φ.a🌵0)
        applied(𝑛.1.2) := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵0)
        formation(𝑛.1.2)  # 𝔻(Φ.a🌵0)
      𝛿1.1 := 40-14-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      applied(𝑛.1.3) := 0  # 𝕄(Φ.a🌵1)
      formation(𝑛.1.3)  # 𝔻(Φ.a🌵1)
        applied(𝑛.1.4) := Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵1)
        formation(𝑛.1.4)  # 𝔻(Φ.a🌵1)
      𝛿2.1 := 00-00-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.1.5 := Φ.bool( φ ↦ 𝜎1:λ )  # 𝑛
      applied(𝑛.1.6) := Φ.bool( φ ↦ 𝜎1:λ )  # 𝕄(Φ.φ)
      𝑛.1.7 := 𝑛.1.6  # 𝕄(𝑛.1.5)
    applied(𝑛.0.3) := Φ.bool( φ ↦ 𝜎1:λ ).if( then ↦ 1.plus( 2 ) )  # 𝕄(Φ.φ)
    applied(𝑛.0.4) := Φ.bool( φ ↦ 𝜎1:λ ).if( then ↦ 1.plus( 2 ), else ↦ ⊥ )  # 𝕄(Φ.φ)
    𝔼(L_fork)  # 𝕄(Φ.φ)
      applied(𝑛.2.1) := Φ.bool( φ ↦ 𝜎1:λ )  # 𝕄(Φ.a🌵2)
      formation(𝑛.2.1)  # 𝔻(Φ.a🌵2)
      𝛿1.2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      applied(𝑛.2.2) := 1  # 𝕄(Φ.a🌵3)
      applied(𝑛.2.3) := 1.plus( x ↦ 2 )  # 𝕄(Φ.a🌵3)
      applied(𝑛.2.4) := Φ.bytes( φ ↦ 40-00-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵3.x)
      applied(𝑛.2.5) := 2  # 𝕄(Φ.a🌵3.x)
      𝔼(L_number_plus)  # 𝕄(Φ.a🌵3)
        applied(𝑛.3.1) := 1  # 𝕄(Φ.a🌵4)
        formation(𝑛.3.1)  # 𝔻(Φ.a🌵4)
          applied(𝑛.3.2) := Φ.bytes( φ ↦ 3F-F0-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵4)
          formation(𝑛.3.2)  # 𝔻(Φ.a🌵4)
        𝛿1.3 := 3F-F0-00-00-00-00-00-00  # 𝔻(ξ.ρ)
        applied(𝑛.3.3) := 2  # 𝕄(Φ.a🌵5)
        formation(𝑛.3.3)  # 𝔻(Φ.a🌵5)
          applied(𝑛.3.4) := Φ.bytes( φ ↦ 40-00-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵5)
          formation(𝑛.3.4)  # 𝔻(Φ.a🌵5)
        𝛿2.3 := 40-00-00-00-00-00-00-00  # 𝔻(ξ.x)
        𝑛.3.5 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
        applied(𝑛.3.6) := Φ.number( φ ↦ 𝜎2:λ )  # 𝕄(Φ.a🌵3)
        𝑛.3.7 := 𝑛.3.6  # 𝕄(𝑛.3.5)
      𝑛1.2 := 𝑛.3.7  # 𝕄(ξ.then)
      𝑛2.2 := ⊥  # 𝕄(ξ.else)
      𝑛3.2 := 𝑛1.2  # 𝑛1
      𝑛4.2 := ⊥  # 𝑛2
      terminate(𝔻(𝜎1:λ), right)  # 𝑛4
      𝑛5.2 := 𝑛3.2  # [𝑛3, 𝑛4]
      𝑛.2.6 := 𝑛5.2  # 𝑛
      𝑛.2.7 := 𝑛5.2  # 𝕄(𝑛.2.6)
    applied(𝑛.0.5) := Φ.number( φ ↦ 𝜎2:λ ).plus( x ↦ 6 )  # 𝕄(Φ.φ)
    applied(𝑛.0.6) := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )  # 𝕄(Φ.φ.x)
    applied(𝑛.0.7) := 6  # 𝕄(Φ.φ.x)
    𝔼(L_number_plus)  # 𝕄(Φ.φ)
      applied(𝑛.4.1) := Φ.number( φ ↦ 𝜎2:λ )  # 𝕄(Φ.a🌵7)
      formation(𝑛.4.1)  # 𝔻(Φ.a🌵7)
      𝛿1.4 := 𝔻(𝜎2:λ)  # 𝔻(ξ.ρ)
      applied(𝑛.4.2) := 6  # 𝕄(Φ.a🌵8)
      formation(𝑛.4.2)  # 𝔻(Φ.a🌵8)
        applied(𝑛.4.3) := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵8)
        formation(𝑛.4.3)  # 𝔻(Φ.a🌵8)
      𝛿2.4 := 40-18-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.4.4 := Φ.number( φ ↦ 𝜎3:λ )  # 𝑛
      applied(𝑛.4.5) := Φ.number( φ ↦ 𝜎3:λ )  # 𝕄(Φ.φ)
      𝑛.4.6 := 𝑛.4.5  # 𝕄(𝑛.4.4)
