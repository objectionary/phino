---
# A loop met while an operand is being brought down to data, with no frame of 𝕄
# ever handed the same term twice: the body of 'cyc' dispatches 'cyc' again, so
# every round 𝕄 stops at a formation of its own and only 𝔻 — 'box'
# contextualizing that body and 'norm' morphing what comes out — comes back to
# the term it started from. Before #1290 the guard of '--acyclic' was 𝕄's alone
# and this went round until the step budget ran out; now 𝔻 asks it too. The box
# step answers the copy of 'cyc' it would enter again with a fresh symbol
# (#2226), so the operand comes down to the datum of that symbol and the firing
# answers.
symbolic: |
  - λ: L_outer
    dataize:
      𝛿1: ξ.arg
    𝑛: ⟦ bar ↦ ⟦ λ ⤍ 𝜎 ⟧ ⟧
location: 'Q.x'
acyclic: proven
steps: 250
input: >
  ⟦ cyc ↦ ⟦ x ↦ ∅, φ ↦ Φ.cyc( ξ.x ) ⟧,
    x ↦ ⟦ arg ↦ Φ.cyc( ⟦⟧ ), λ ⤍ L_outer ⟧.bar ⟧
result: '𝜎2:λ'
protocol: |
  𝕄(Φ.x):
    𝔼(L_outer):
      𝔻(ξ.arg):
        𝕄(ξ.arg):
          remembered 𝑛·1·1 ≡ Φ.cyc  # ⟦ x ↦ ∅, φ ↦ Φ.cyc( x ) ⟧
          normalized 𝑛·1·2 := 𝑛·1·1
          𝑛·1·3 := Φ.cyc( x ↦ ⟦⟧ )
          𝑛·1·4 := ⟦ x ↦ ⟦⟧, φ ↦ Φ.cyc( x ) ⟧
          remembered 𝑛·1·4 ≡ 𝑛·1·2( x ↦ ⟦⟧ )
          normalized 𝑛·1·5 := 𝑛·1·4
          normalized 𝑛·1·6 := 𝑛·1·5
          morphed 𝑛·1·7 := 𝑛·1·6
        boxed 𝑛·1·8 := 𝑛·1·7.φ
        normalized 𝑛·1·9 := Φ.cyc( ⟦⟧ )
        𝕄(𝑛·1·8):
          normalized 𝑛·1·10 := 𝑛·1·2
          𝑛·1·11 := Φ.cyc( x ↦ ⟦⟧ )
          𝑛·1·12 := ⟦ x ↦ ⟦⟧, φ ↦ Φ.cyc( x ) ⟧
          normalized 𝑛·1·13 := 𝑛·1·12
          normalized 𝑛·1·14 := 𝑛·1·13
          morphed 𝑛·1·15 := 𝑛·1·14
        recalled 𝑛·1·4 ⇒ 𝑛·1·2( x ↦ ⟦⟧ )
        recalled 𝑛·1·1 ⇒ Φ.cyc
        𝕄(𝑛·1·15.x):
          morphed 𝑛·1·16 := ⟦⟧
        looped 𝜎1 := Φ.cyc( x ↦ 𝑛·1·16 )  # 𝔻(𝑛·1·8), proven, repeats 𝑛·1·15
        𝛿·1·1 := 𝔻(𝜎1:λ)
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.arg)
      𝑛·1·17 := 𝜎2:λ:bar  # 𝑛
      𝕄(𝑛·1·17):
        morphed 𝑛·1·18 := 𝜎2:λ:bar
      𝑛·1·19 := 𝑛·1·18  # 𝕄(𝑛·1·17)
    normalized 𝑛·0·1 := 𝜎2:λ
    morphed 𝑛·0·2 := 𝑛·0·1
