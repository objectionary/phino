---
# yamllint disable rule:line-length
# One firing, and nothing is computed: the operands come down to the numbers
# they are, and what the entry answers with is a number standing for a sum
# nobody has worked out.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.plus( 6 ) ⟧
result: '⟦ φ ↦ 𝜎1:λ, plus(x) ↦ L_number_plus:λ ⟧'
protocol: |
  𝕄(Φ.φ):
    𝑛.0.1 := 5  # 𝕄(Φ.φ)
    𝑛.0.2 := 𝑛.0.1.plus( x ↦ 6 )  # 𝕄(Φ.φ)
    𝑛.0.3 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )  # 𝕄(Φ.φ.x)
    𝑛.0.4 := Φ.number( φ ↦ 𝑛.0.3 )  # 𝕄(Φ.φ.x)
    𝔼(L_number_plus):  # 𝕄(Φ.φ)
      𝑛.1.1 := 5  # 𝕄(Φ.a🌵0)
      𝔻(Φ.a🌵0):
        𝑛.1.2 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵0)
        𝔻(Φ.a🌵0):
      𝛿1.1 := 40-14-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      𝑛.1.3 := Φ.number( φ ↦ 𝑛.0.3 )  # 𝕄(Φ.a🌵1)
      𝔻(Φ.a🌵1):
        𝑛.1.4 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵1)
        𝔻(Φ.a🌵1):
      𝛿2.1 := 40-18-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.1.5 := Φ.number( φ ↦ 𝜎1:λ )  # 𝑛
      𝑛.1.6 := Φ.number( φ ↦ 𝜎1:λ )  # 𝕄(Φ.φ)
      𝑛.1.7 := 𝑛.1.6  # 𝕄(𝑛.1.5)
