---
# yamllint disable rule:line-length
# A recursion that runs through 'evaluate' lines alone, under
# '--acyclic=proven'. 'L_loop' morphs 'next' to the very formation it was
# fired from, and its 'evaluate' line fires that formation again. The line
# enters the formation the way 'ml' does, so the second firing is cut before
# it opens and writes a 'looped' line where its block would have stood
# (#1882). The formation is a copy of 'Φ.loop', so the cut answers it with a
# fresh symbol (#2275), and the dispatch of φ off that symbol gives a new
# symbol (#2479). The budget of firings is there only to end the run if the cut is ever lost
# again.
symbolic: |
  - λ: L_loop
    morph:
      𝑛1: $.next🌵
    evaluate:
      𝑛2: 𝑛1
    𝑛: 𝑛2
location: 'Q.app'
acyclic: proven
partial: true
firings: 5
input: '⟦ loop ↦ ⟦ next🌵 ↦ Φ.loop, λ ⤍ L_loop ⟧, app ↦ Φ.loop.φ ⟧'
result: '𝜎2:λ'
protocol: |
  𝕄(Φ.app):
    remembered 𝑛·0·1 ≡ Φ.loop  # ⟦ next🌵 ↦ Φ.loop, λ ⤍ L_loop ⟧
    𝔼(L_loop):
      𝕄(ξ.next🌵):
        morphed 𝑛·1·1 ≔ 𝑛·0·1
      𝑛1·1 ≔ 𝑛·0·1  # 𝕄(ξ.next🌵)
      recalled 𝑛·0·1 ⇒ Φ.loop
      recalled 𝑛·0·1 ⇒ Φ.loop
      looped 𝜎1 ≔ Φ.loop  # 𝔼(𝑛1 of L_loop), proven, repeats 𝑛·0·1
      𝑛2·1 ≔ 𝜎1:λ  # 𝔼(𝑛1 of L_loop)
      𝑛·1·2 ≔ 𝑛2·1  # 𝑛 of L_loop
      𝕄(𝑛·1·2):
        morphed 𝑛·1·3 ≔ 𝑛2·1
      𝑛·1·4 ≔ 𝑛2·1  # 𝕄(𝑛·1·2)
      evaluated 𝑛·1·5 ≔ 𝑛·1·4  # 𝑛·0·1
    opaque 𝜎2:λ ≔ 𝜎1:λ.φ
    morphed 𝑛·0·2 ≔ 𝜎2:λ
