---
# yamllint disable rule:line-length
# The memo of '--acyclic=plausible': 𝔼 is a function of the formation it
# fires, so two bindings spelling one term fire one formation twice, and a
# run firing it afresh each time mints two symbols for one value and fires
# everything under the second once more (#1476). The 'evaluate' lines of
# 'L_pair' fire 'a' and then 'b', which spell the very same sum. Under the
# mode the second firing takes what the first answered: it reduces nothing,
# mints nothing and lands 'b' on the very symbol 'a' came to. The protocol
# still writes the firing of 'b' at its own site, with the answer the firing
# of 'a' made, named after the line that made it, and with no operand line
# under it, since none was reduced (#1874).
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_pair
    morph:
      𝑛1: $.a
      𝑛2: $.b
    evaluate:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    𝑛: ⟦ φ ↦ ⟦ a ↦ 𝑛3, b ↦ 𝑛4 ⟧ ⟧
location: 'Q.p'
acyclic: plausible
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    p ↦ ⟦
      a ↦ 7.plus( 5.plus( 6 ) ),
      b ↦ 7.plus( 5.plus( 6 ) ),
      λ ⤍ L_pair ⟧.φ ⟧
result: >
  ⟦ a ↦ ⟦ φ ↦ 𝜎2:λ, plus(x) ↦ L_number_plus:λ ⟧,
    b ↦ ⟦ φ ↦ 𝜎2:λ, plus(x) ↦ L_number_plus:λ ⟧ ⟧
protocol: |
  𝕄(Φ.p):
    𝔼(L_pair):
      𝕄(ξ.a):
        𝑛·1·1 := 7.0
        𝑛·1·2 := 𝑛·1·1.plus( x ↦ 5.0.plus( 6.0 ) )
      𝑛1·1 := 𝑛·1·2  # 𝕄(ξ.a)
      𝕄(ξ.b):
        𝑛·1·3 := 7.0
        𝑛·1·4 := 𝑛·1·3.plus( x ↦ 5.0.plus( 6.0 ) )
      𝑛2·1 := 𝑛·1·4  # 𝕄(ξ.b)
      𝔼(L_number_plus):  # 𝔼(𝑛1)
        𝔻(ξ.ρ):
          𝕄(ξ.ρ):
            𝑛·2·1 := 7.0
          boxed 𝑛·2·2 := 𝑛·2·1.φ
          𝕄(𝑛·2·2):
            𝑛·2·3 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
          boxed 𝑛·2·4 := 𝑛·2·3.φ
          𝛿·2·1 := 40-1C-00-00-00-00-00-00  # 7.0
        𝛿1·2 := 𝛿·2·1  # 𝔻(ξ.ρ)
        𝔻(ξ.x):
          𝕄(ξ.x):
            𝑛·2·5 := 5.0
            𝑛·2·6 := 𝑛·2·5.plus( x ↦ 6.0 )
          𝔼(L_number_plus):
            𝔻(ξ.ρ):
              𝕄(ξ.ρ):
                𝑛·3·1 := 5.0
              boxed 𝑛·3·2 := 𝑛·3·1.φ
              𝕄(𝑛·3·2):
                𝑛·3·3 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
              boxed 𝑛·3·4 := 𝑛·3·3.φ
              𝛿·3·1 := 40-14-00-00-00-00-00-00  # 5.0
            𝛿1·3 := 𝛿·3·1  # 𝔻(ξ.ρ)
            𝔻(ξ.x):
              𝕄(ξ.x):
                𝑛·3·5 := 6.0
              boxed 𝑛·3·6 := 𝑛·3·5.φ
              𝕄(𝑛·3·6):
                𝑛·3·7 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
              boxed 𝑛·3·8 := 𝑛·3·7.φ
              𝛿·3·2 := 40-18-00-00-00-00-00-00  # 6.0
            𝛿2·3 := 𝛿·3·2  # 𝔻(ξ.x)
            𝑛·3·9 := Φ.number( φ ↦ 𝜎1:λ )  # 𝑛
            𝕄(𝑛·3·9):
              𝑛·3·10 := Φ.number( φ ↦ 𝜎1:λ )
            𝑛·3·11 := 𝑛·3·10  # 𝕄(𝑛·3·9)
          boxed 𝑛·2·7 := 𝑛·3·10.φ
        𝛿2·2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.x)
        𝑛·2·8 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
        𝕄(𝑛·2·8):
          𝑛·2·9 := Φ.number( φ ↦ 𝜎2:λ )
        𝑛·2·10 := 𝑛·2·9  # 𝕄(𝑛·2·8)
      𝑛3·1 := 𝑛·2·10  # 𝔼(𝑛1)
      𝔼(L_number_plus):  # 𝔼(𝑛2)
        𝑛·4·1 := 𝑛·2·9  # 𝑛
        𝑛·4·2 := 𝑛3·1  # 𝕄(𝑛·4·1)
      𝑛4·1 := 𝑛·4·2  # 𝔼(𝑛2)
      𝑛·1·5 := ⟦ a ↦ 𝑛·2·9, b ↦ 𝑛·2·9 ⟧:φ  # 𝑛
      𝑛·1·6 := ⟦ a ↦ 𝑛·2·9, b ↦ 𝑛·2·9 ⟧:φ  # 𝕄(𝑛·1·5)
