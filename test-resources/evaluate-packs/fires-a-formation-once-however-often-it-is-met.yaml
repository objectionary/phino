---
# yamllint disable rule:line-length
# The memo of '--acyclic=plausible': 𝔼 is a function of the formation it
# fires, so two bindings spelling one term fire one formation twice, and a
# run firing it afresh each time mints two symbols for one value and fires
# everything under the second once more (#1476). The 'evaluate' lines of
# 'L_pair' fire 'a' and then 'b', which spell the very same sum. Under the
# mode the second firing takes what the first answered: it reduces nothing,
# mints nothing and lands 'b' on the very symbol 'a' came to. The protocol
# still writes the firing of 'b' at its own site, with the answer the firing
# of 'a' made, named after the line that made it, and with no operand line
# under it, since none was reduced (#1874).
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_pair
    morph:
      𝑛1: $.a
      𝑛2: $.b
    evaluate:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    𝑛: ⟦ φ ↦ ⟦ a ↦ 𝑛3, b ↦ 𝑛4 ⟧ ⟧
location: 'Q.p'
acyclic: plausible
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    p ↦ ⟦
      a ↦ 7.plus( 5.plus( 6 ) ),
      b ↦ 7.plus( 5.plus( 6 ) ),
      λ ⤍ L_pair ⟧.φ ⟧
result: >
  ⟦ a ↦ ⟦ φ ↦ 𝜎2:λ, plus(x) ↦ L_number_plus:λ ⟧,
    b ↦ ⟦ φ ↦ 𝜎2:λ, plus(x) ↦ L_number_plus:λ ⟧ ⟧
protocol: |
  𝕄(Φ.p):
    𝔼(L_pair):
      𝕄(ξ.a):
        normalized 𝑛·1·1 := ⟦ φ ↦ ∅, plus(x) ↦ L_number_plus:λ ⟧
        𝑛·1·2 := 7.0
        𝑛·1·3 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
        normalized 𝑛·1·4 := 𝑛·1·3
        normalized 𝑛·1·5 := ⟦ x ↦ ∅, λ ⤍ L_number_plus ⟧
        𝑛·1·6 := 𝑛·1·2.plus( x ↦ 5.0.plus( 6.0 ) )
        𝑛·1·7 := ⟦ x ↦ 5.0.plus( 6.0 ), λ ⤍ L_number_plus ⟧
        normalized 𝑛·1·8 := 𝑛·1·7
        normalized 𝑛·1·9 := 𝑛·1·7
        morphed 𝑛·1·10 := 𝑛·1·7
      𝑛1·1 := 𝑛·1·7  # 𝕄(ξ.a)
      𝕄(ξ.b):
        normalized 𝑛·1·11 := 𝑛·1·1
        𝑛·1·12 := 7.0
        𝑛·1·13 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
        normalized 𝑛·1·14 := 𝑛·1·13
        normalized 𝑛·1·15 := ⟦ x ↦ ∅, λ ⤍ L_number_plus ⟧
        𝑛·1·16 := 𝑛·1·12.plus( x ↦ 5.0.plus( 6.0 ) )
        𝑛·1·17 := ⟦ x ↦ 5.0.plus( 6.0 ), λ ⤍ L_number_plus ⟧
        normalized 𝑛·1·18 := 𝑛·1·17
        normalized 𝑛·1·19 := 𝑛·1·17
        morphed 𝑛·1·20 := 𝑛·1·17
      𝑛2·1 := 𝑛·1·17  # 𝕄(ξ.b)
      𝔼(L_number_plus):  # 𝔼(𝑛1)
        𝔻(ξ.ρ):
          𝕄(ξ.ρ):
            normalized 𝑛·2·1 := 𝑛·1·11
            𝑛·2·2 := 7.0
            𝑛·2·3 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
            normalized 𝑛·2·4 := 𝑛·2·3
            normalized 𝑛·2·5 := 𝑛·2·4
            morphed 𝑛·2·6 := 𝑛·2·5
          boxed 𝑛·2·7 := 𝑛·2·6.φ
          normalized 𝑛·2·8 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
          𝕄(𝑛·2·7):
            normalized 𝑛·2·9 := ∅:φ
            𝑛·2·10 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
            𝑛·2·11 := 40-1C-00-00-00-00-00-00:Δ:φ
            normalized 𝑛·2·12 := 𝑛·2·11
            normalized 𝑛·2·13 := 𝑛·2·12
            morphed 𝑛·2·14 := 𝑛·2·13
          boxed 𝑛·2·15 := 𝑛·2·14.φ
          normalized 𝑛·2·16 := 40-1C-00-00-00-00-00-00:Δ
          𝛿·2·1 := 40-1C-00-00-00-00-00-00  # 7.0
        𝛿1·2 := 𝛿·2·1  # 𝔻(ξ.ρ)
        𝔻(ξ.x):
          𝕄(ξ.x):
            normalized 𝑛·2·17 := 𝑛·2·1
            𝑛·2·18 := 5.0
            𝑛·2·19 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
            normalized 𝑛·2·20 := 𝑛·2·19
            normalized 𝑛·2·21 := ⟦ x ↦ ∅, λ ⤍ L_number_plus ⟧
            𝑛·2·22 := 𝑛·2·18.plus( x ↦ 6.0 )
            𝑛·2·23 := ⟦ x ↦ 6.0, λ ⤍ L_number_plus ⟧
            normalized 𝑛·2·24 := 𝑛·2·23
            normalized 𝑛·2·25 := 𝑛·2·23
            morphed 𝑛·2·26 := 𝑛·2·23
          𝔼(L_number_plus):
            𝔻(ξ.ρ):
              𝕄(ξ.ρ):
                normalized 𝑛·3·1 := 𝑛·2·17
                𝑛·3·2 := 5.0
                𝑛·3·3 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
                normalized 𝑛·3·4 := 𝑛·3·3
                normalized 𝑛·3·5 := 𝑛·3·4
                morphed 𝑛·3·6 := 𝑛·3·5
              boxed 𝑛·3·7 := 𝑛·3·6.φ
              normalized 𝑛·3·8 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
              𝕄(𝑛·3·7):
                normalized 𝑛·3·9 := 𝑛·2·9
                𝑛·3·10 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
                𝑛·3·11 := 40-14-00-00-00-00-00-00:Δ:φ
                normalized 𝑛·3·12 := 𝑛·3·11
                normalized 𝑛·3·13 := 𝑛·3·12
                morphed 𝑛·3·14 := 𝑛·3·13
              boxed 𝑛·3·15 := 𝑛·3·14.φ
              normalized 𝑛·3·16 := 40-14-00-00-00-00-00-00:Δ
              𝛿·3·1 := 40-14-00-00-00-00-00-00  # 5.0
            𝛿1·3 := 𝛿·3·1  # 𝔻(ξ.ρ)
            𝔻(ξ.x):
              𝕄(ξ.x):
                normalized 𝑛·3·17 := 𝑛·3·1
                𝑛·3·18 := 6.0
                𝑛·3·19 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
                normalized 𝑛·3·20 := 𝑛·3·19
                normalized 𝑛·3·21 := 𝑛·3·20
                morphed 𝑛·3·22 := 𝑛·3·21
              boxed 𝑛·3·23 := 𝑛·3·22.φ
              normalized 𝑛·3·24 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
              𝕄(𝑛·3·23):
                normalized 𝑛·3·25 := 𝑛·3·9
                𝑛·3·26 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
                𝑛·3·27 := 40-18-00-00-00-00-00-00:Δ:φ
                normalized 𝑛·3·28 := 𝑛·3·27
                normalized 𝑛·3·29 := 𝑛·3·28
                morphed 𝑛·3·30 := 𝑛·3·29
              boxed 𝑛·3·31 := 𝑛·3·30.φ
              normalized 𝑛·3·32 := 40-18-00-00-00-00-00-00:Δ
              𝛿·3·2 := 40-18-00-00-00-00-00-00  # 6.0
            𝛿2·3 := 𝛿·3·2  # 𝔻(ξ.x)
            𝑛·3·33 := Φ.number( φ ↦ 𝜎1:λ )  # 𝑛
            𝕄(𝑛·3·33):
              normalized 𝑛·3·34 := 𝑛·3·17
              𝑛·3·35 := Φ.number( φ ↦ 𝜎1:λ )
              𝑛·3·36 := ⟦ φ ↦ 𝜎1:λ, plus(x) ↦ L_number_plus:λ ⟧
              normalized 𝑛·3·37 := 𝑛·3·36
              morphed 𝑛·3·38 := 𝑛·3·37
            𝑛·3·39 := 𝑛·3·38  # 𝕄(𝑛·3·33)
            memoized 𝑛·2·23 ⇛ 𝑛·3·39
          boxed 𝑛·2·27 := 𝑛·3·39.φ
          normalized 𝑛·2·28 := 𝜎1:λ
          𝛿·2·2 := 𝔻(𝜎1:λ)
        𝛿2·2 := 𝛿·2·2  # 𝔻(ξ.x)
        𝑛·2·29 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
        𝕄(𝑛·2·29):
          normalized 𝑛·2·30 := 𝑛·3·34
          𝑛·2·31 := Φ.number( φ ↦ 𝜎2:λ )
          𝑛·2·32 := ⟦ φ ↦ 𝜎2:λ, plus(x) ↦ L_number_plus:λ ⟧
          normalized 𝑛·2·33 := 𝑛·2·32
          morphed 𝑛·2·34 := 𝑛·2·33
        𝑛·2·35 := 𝑛·2·34  # 𝕄(𝑛·2·29)
        memoized 𝑛·1·17 ⇛ 𝑛·2·35
      𝑛3·1 := 𝑛·2·35  # 𝔼(𝑛1)
      𝔼(L_number_plus):  # 𝔼(𝑛2)
        recalled 𝑛·1·17 ⇒ 𝑛·2·35
        𝑛·4·1 := 𝑛·2·31  # 𝑛
        𝑛·4·2 := 𝑛3·1  # 𝕄(𝑛·4·1)
      𝑛4·1 := 𝑛·4·2  # 𝔼(𝑛2)
      𝑛·1·21 := ⟦ a ↦ 𝑛·4·2, b ↦ 𝑛·4·2 ⟧:φ  # 𝑛
      𝕄(𝑛·1·21):
        morphed 𝑛·1·22 := ⟦ a ↦ 𝑛·4·2, b ↦ 𝑛·4·2 ⟧:φ
      𝑛·1·23 := 𝑛·1·22  # 𝕄(𝑛·1·21)
      memoized 𝑛·1·24 ⇛ 𝑛·1·23  # ⟦ a ↦ 𝑛·2·2.plus( 𝑛·3·2.plus( 𝑛·3·18 ) ), b ↦ 𝑛·2·2.plus( 𝑛·3·2.plus( 𝑛·3·18 ) ), λ ⤍ L_pair ⟧
    normalized 𝑛·0·1 := ⟦ a ↦ 𝑛·4·2, b ↦ 𝑛·4·2 ⟧
    morphed 𝑛·0·2 := 𝑛·0·1
