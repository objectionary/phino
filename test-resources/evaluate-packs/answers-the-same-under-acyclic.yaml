---
# yamllint disable rule:line-length
# A program that does not loop answers the same with '_acyclic' as without it.
# The guard remembers the terms the frames above have open, so only a genuine
# return to one of them trips it; a term merely reduced twice in two places
# does not.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
acyclic: proven
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    φ ↦ 5.plus( 6 ).φ ⟧
result: '𝜎1:λ'
protocol: |
  𝕄(Φ.φ):
    𝑛·0·1 := 5.0
    𝑛·0·2 := 𝑛·0·1.plus( x ↦ 6.0 )
    𝔼(L_number_plus):
      𝔻(ξ.ρ):
        𝕄(ξ.ρ):
          𝑛·1·1 := 5.0
          morphed 𝑛·1·2 := 𝑛·1·1
        boxed 𝑛·1·3 := 𝑛·1·2.φ
        𝕄(𝑛·1·3):
          𝑛·1·4 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
          morphed 𝑛·1·5 := 𝑛·1·4
        boxed 𝑛·1·6 := 𝑛·1·5.φ
        𝛿·1·1 := 40-14-00-00-00-00-00-00  # 5.0
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.ρ)
      𝔻(ξ.x):
        𝕄(ξ.x):
          𝑛·1·7 := 6.0
          morphed 𝑛·1·8 := 𝑛·1·7
        boxed 𝑛·1·9 := 𝑛·1·8.φ
        𝕄(𝑛·1·9):
          𝑛·1·10 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
          morphed 𝑛·1·11 := 𝑛·1·10
        boxed 𝑛·1·12 := 𝑛·1·11.φ
        𝛿·1·2 := 40-18-00-00-00-00-00-00  # 6.0
      𝛿2·1 := 𝛿·1·2  # 𝔻(ξ.x)
      𝑛·1·13 := Φ.number( φ ↦ 𝜎1:λ )  # 𝑛
      𝕄(𝑛·1·13):
        𝑛·1·14 := Φ.number( φ ↦ 𝜎1:λ )
        morphed 𝑛·1·15 := 𝑛·1·14
      𝑛·1·16 := 𝑛·1·15  # 𝕄(𝑛·1·13)
    morphed 𝑛·0·3 := 𝜎1:λ
