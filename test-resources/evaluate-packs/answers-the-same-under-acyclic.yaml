---
# yamllint disable rule:line-length
# A program that does not loop answers the same with '_acyclic' as without it.
# The guard remembers the terms the frames above have open, so only a genuine
# return to one of them trips it; a term merely reduced twice in two places
# does not.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
deep: true
acyclic: proven
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.plus( 6 ) ⟧
result: '⟦ φ ↦ 𝜎1:λ, plus(x) ↦ L_number_plus:λ ⟧'
protocol: |
  𝕄(Φ.φ)
    applied(𝑛.0.1) := 5  # 𝕄(Φ.φ)
    applied(𝑛.0.2) := 5.plus( x ↦ 6 )  # 𝕄(Φ.φ)
    applied(𝑛.0.3) := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )  # 𝕄(Φ.φ.x)
    applied(𝑛.0.4) := 6  # 𝕄(Φ.φ.x)
    𝔼(L_number_plus)  # 𝕄(Φ.φ)
      applied(𝑛.1.1) := 5  # 𝕄(Φ.a🌵0)
      formation(𝑛.1.1)  # 𝔻(Φ.a🌵0)
        applied(𝑛.1.2) := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵0)
        formation(𝑛.1.2)  # 𝔻(Φ.a🌵0)
      𝛿1.1 := 40-14-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      applied(𝑛.1.3) := 6  # 𝕄(Φ.a🌵1)
      formation(𝑛.1.3)  # 𝔻(Φ.a🌵1)
        applied(𝑛.1.4) := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵1)
        formation(𝑛.1.4)  # 𝔻(Φ.a🌵1)
      𝛿2.1 := 40-18-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.1.5 := Φ.number( φ ↦ 𝜎1:λ )  # 𝑛
      applied(𝑛.1.6) := Φ.number( φ ↦ 𝜎1:λ )  # 𝕄(Φ.φ)
      𝑛.1.7 := 𝑛.1.6  # 𝕄(𝑛.1.5)
