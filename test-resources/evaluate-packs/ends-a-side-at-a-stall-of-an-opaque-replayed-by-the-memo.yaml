---
# yamllint disable rule:line-length
# Both sides fire the same copy of 'L_id', whose operand dispatches off a
# bare symbol. The left one is 'opaque' and the memo keeps the stall, so the
# right one is told 'stall 𝜎1' with no 'opaque' line. Both still end their
# side alone as ⊥ (#2427), since the stall names the symbol.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.on🌵
    morph:
      𝑛1: $.left🌵
      𝑛2: $.right🌵
    join:
      on: 𝛿1
      left: 𝑛1
      right: 𝑛2
      otherwise: L_fork
  - λ: L_id
    morph:
      𝑛1: $.x
    𝑛: 𝑛1
location: 'Q.e1'
acyclic: plausible
input: '⟦ k ↦ ⟦ q ↦ ⟦⟧ ⟧, id ↦ ⟦ λ ⤍ L_id, x ↦ ⟦ λ ⤍ 𝜎1 ⟧.q ⟧, e1 ↦ ⟦ λ ⤍ L_fork, on🌵 ↦ ⟦ Δ ⤍ 00- ⟧, left🌵 ↦ Φ.id.φ, right🌵 ↦ Φ.id.φ ⟧.φ ⟧'
result: '⊥'
protocol: |
  𝕄(Φ.e1):
    𝔼(L_fork):
      𝔻(ξ.on🌵):
        𝛿·1·1 ≔ 00-
      𝛿1·1 ≔ 𝛿·1·1  # 𝔻(ξ.on🌵)
      𝕄(ξ.left🌵):
        remembered 𝑛·1·1 ≡ Φ.id  # ⟦ λ ⤍ L_id, x ↦ 𝜎1:λ.q ⟧
        𝔼(L_id):
          𝕄(ξ.x):
            opaque 𝜎1  # 𝕄(𝜎1:λ.q)
          stuck 𝜎1
      𝑛1·1 ≔ ⊥  # 𝕄(ξ.left🌵)
      𝕄(ξ.right🌵):
        𝔼(L_id):
          stall 𝜎1
      𝑛2·1 ≔ ⊥  # 𝕄(ξ.right🌵)
      𝑛·1·2 ≔ ⊥
      memoized 𝑛·1·3 ⇛ ⊥  # ⟦ λ ⤍ L_fork, on🌵 ↦ 00-:Δ, left🌵 ↦ Φ.id.φ, right🌵 ↦ Φ.id.φ ⟧
      evaluated 𝑛·1·4 ≔ ⊥  # 𝑛·1·3
    normalized 𝑛·0·1 ≔ ⊥  # ⊥.φ
    morphed 𝑛·0·2 ≔ ⊥
