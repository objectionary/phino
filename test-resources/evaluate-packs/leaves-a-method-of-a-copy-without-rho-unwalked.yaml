---
# yamllint disable rule:line-length
# The same method nobody dispatched, in a copy of an object that declares no
# ρ, the way eo-runtime spells 'text': 'skip' drops the ρ the dispatch hands
# the copy, so the copy has no ρ of its own, yet 'length' still declares one
# and still waits for its receiver. The deep walk hands it back as it was
# written instead of firing 'L_dataized' on a ⊥ it stands on (#1414).
symbolic: |
  - λ: L_dataized
    dataize:
      𝛿1: $.target
    𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_entry
    dataize:
      𝛿1: $.n
    morph:
      𝑛1: $.v.φ
    𝑛: Φ.l🌵.root( 𝑛1 )
  - λ: L_root
    dataize:
      𝛿1: $.v
    𝑛: ⟦ ⟧
location: 'Q.l🌵'
deep: true
partial: true
acyclic: true
steps: 32
input: |
  ⟦
    number ↦ ⟦ φ ↦ ∅ ⟧,
    bytes ↦ ⟦ φ ↦ ∅, as-bytes ↦ ⟦ φ ↦ ξ.ρ, ρ ↦ ∅ ⟧ ⟧,
    dataized ↦ ⟦ target ↦ ∅, λ ⤍ L_dataized ⟧,
    text ↦ ⟦ φ ↦ ∅, length ↦ ⟦ φ ↦ Φ.dataized( target ↦ ξ.ρ.φ ).as-bytes, ρ ↦ ∅ ⟧ ⟧,
    holder ↦ ⟦ buf ↦ ∅, φ ↦ ξ.buf ⟧,
    l🌵 ↦ ⟦
      mark ↦ ⟦ n ↦ ∅, v ↦ ∅, λ ⤍ L_entry ⟧,
      root ↦ ⟦ v ↦ ∅, λ ⤍ L_root ⟧,
      e1 ↦ Φ.l🌵.mark( n ↦ Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍ 3F-F0-00-00-00-00-00-00 ⟧ ) ) )( v ↦ Φ.holder( buf ↦ Φ.text( φ ↦ Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎1 ⟧ ) ) ) )
    ⟧
  ⟧
protocol: |
  𝕄(Φ.l🌵)
    𝔼(L_entry)  # 𝕄(Φ.l🌵.e1)
      𝛿1.1 := 3F-F0-00-00-00-00-00-00  # 𝔻(ξ.n)
      𝑛1.1 := ⟦ φ ↦ Φ.bytes( φ ↦ 𝜎1:λ ), length ↦ Φ.dataized( target ↦ ρ.φ ).as-bytes:φ ⟧  # 𝕄(ξ.v.φ)
      𝑛.1.1 := Φ.l🌵.root( ⟦ φ ↦ Φ.bytes( φ ↦ 𝜎1:λ ), length ↦ Φ.dataized( target ↦ ρ.φ ).as-bytes:φ ⟧ )  # 𝑛
      𝑛.1.2 := ⟦ v ↦ ⟦ φ ↦ Φ.bytes( φ ↦ 𝜎1:λ ), length ↦ Φ.dataized( target ↦ ρ.φ ).as-bytes:φ ⟧, λ ⤍ L_root ⟧  # 𝕄(𝑛.1.1)
    𝔼(L_root)  # 𝕄(Φ.l🌵.e1)
      𝛿1.2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.v)
      𝑛.2.1 := ⟦⟧  # 𝑛
      𝑛.2.2 := ⟦⟧  # 𝕄(𝑛.2.1)
