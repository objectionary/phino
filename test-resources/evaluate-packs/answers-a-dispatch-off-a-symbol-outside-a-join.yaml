---
# yamllint disable rule:line-length
# An entry that does not join morphs an operand dispatching off a bare
# symbol. The dispatch is 'opaque' and gives a new symbol (#2479), so the
# firing answers it and the run goes on instead of getting stuck.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.on🌵
    morph:
      𝑛1: $.left🌵
      𝑛2: $.right🌵
    join:
      on: 𝛿1
      left: 𝑛1
      right: 𝑛2
      otherwise: L_fork
  - λ: L_id
    morph:
      𝑛1: $.x
    𝑛: 𝑛1
location: 'Q.e1'
input: '⟦ e1 ↦ ⟦ λ ⤍ L_id, x ↦ ⟦ λ ⤍ 𝜎1 ⟧.q ⟧.φ ⟧'
result: '𝜎3:λ'
protocol: |
  𝕄(Φ.e1):
    𝔼(L_id):
      𝕄(ξ.x):
        opaque 𝜎2:λ ≔ 𝜎1:λ.q
        morphed 𝑛·1·1 ≔ 𝜎2:λ
      𝑛1·1 ≔ 𝑛·1·1  # 𝕄(ξ.x)
      𝑛·1·2 ≔ 𝑛1·1  # 𝑛 of L_id
      𝕄(𝑛·1·2):
        morphed 𝑛·1·3 ≔ 𝑛1·1
      𝑛·1·4 ≔ 𝑛1·1  # 𝕄(𝑛·1·2)
      evaluated 𝑛·1·5 ≔ 𝑛·1·4  # ⟦ λ ⤍ L_id, x ↦ 𝜎1:λ.q ⟧
    opaque 𝜎3:λ ≔ 𝜎2:λ.φ
    morphed 𝑛·0·1 ≔ 𝜎3:λ
