---
# yamllint disable rule:line-length
# The key of an entry is a regular expression over λ names, so one entry
# stands for the whole family of them a box numbers its functions with.
symbolic: |
  - λ: L_number_(plus|times)
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦
      plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧,
      times(ρ, x) ↦ ⟦ λ ⤍ L_number_times ⟧ ⟧,
    @ ↦ 5.plus( 6 ).times( 7 ) ⟧
result: |-
  ⟦ φ ↦ 𝜎2:λ, plus(x) ↦ L_number_plus:λ, times(x) ↦ L_number_times:λ ⟧
protocol: |
  𝕄(Φ.φ):
    𝑛-0-1 := 5
    𝑛-0-2 := 𝑛-0-1.plus( x ↦ 6 )
    𝔼(L_number_plus):
      𝔻(Φ.a🌵0):
        𝕄(Φ.a🌵0):
          𝑛-1-1 := 5
          𝑛-1-2 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
        𝛿-1-1 := 40-14-00-00-00-00-00-00  # 5.0
      𝛿1-1 := 𝛿-1-1  # 𝔻(ξ.ρ)
      𝔻(Φ.a🌵1):
        𝕄(Φ.a🌵1):
          𝑛-1-3 := 6
          𝑛-1-4 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
        𝛿-1-2 := 40-18-00-00-00-00-00-00  # 6.0
      𝛿2-1 := 𝛿-1-2  # 𝔻(ξ.x)
      𝑛-1-5 := Φ.number( φ ↦ 𝜎1:λ )  # 𝑛
      𝕄(𝑛-1-5):
        𝑛-1-6 := Φ.number( φ ↦ 𝜎1:λ )
      𝑛-1-7 := 𝑛-1-6  # 𝕄(𝑛-1-5)
    𝑛-0-3 := 𝑛-1-6.times( x ↦ 7 )
    𝕄(Φ.φ.x):
      𝑛-0-4 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
      𝑛-0-5 := Φ.number( φ ↦ 𝑛-0-4 )
    𝔼(L_number_times):
      𝔻(Φ.a🌵2):
        𝕄(Φ.a🌵2):
          𝑛-2-1 := Φ.number( φ ↦ 𝜎1:λ )
      𝛿1-2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      𝔻(Φ.a🌵3):
        𝕄(Φ.a🌵3):
          𝑛-2-2 := Φ.number( φ ↦ 𝑛-0-4 )
          𝑛-2-3 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
        𝛿-2-1 := 40-1C-00-00-00-00-00-00  # 7.0
      𝛿2-2 := 𝛿-2-1  # 𝔻(ξ.x)
      𝑛-2-4 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
      𝕄(𝑛-2-4):
        𝑛-2-5 := Φ.number( φ ↦ 𝜎2:λ )
      𝑛-2-6 := 𝑛-2-5  # 𝕄(𝑛-2-4)
