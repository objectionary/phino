---
# yamllint disable rule:line-length
# The same fork as the pack beside this one, answering the join of its two
# branches instead of the first of them, with one more firing standing after
# it: the branch point stays in the program, since the 'plus( 6 )' below the
# fork reads the symbol the two branches were joined into and not the value of
# either. The line saying what that symbol stands for is what ties it to the
# two, and the firing of a branch stands one level deeper, under the fork that
# asked for it.
symbolic: |
  - λ: L_number_gt
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.ρ
    morph:
      𝑛1: $.then
      𝑛2: $.else
    symbolize:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      𝑛5: [𝑛3, 𝑛4]
    𝑛: 𝑛5
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    bool(φ) ↦ ⟦ if ↦ ⟦ ρ ↦ ∅, then ↦ ∅, else ↦ ∅, λ ⤍ L_fork ⟧ ⟧,
    number(φ) ↦ ⟦
      gt(ρ, x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.gt( 0 ).if( 1.plus( 2 ), 3.plus( 4 ) ).plus( 6 ) ⟧
result: |-
  ⟦ φ ↦ 𝜎5:λ, gt(x) ↦ L_number_gt:λ, plus(x) ↦ L_number_plus:λ ⟧
protocol: |
  𝕄(Φ.φ):
    applied(𝑛.0.1) := 5  # 𝕄(Φ.φ)
    applied(𝑛.0.2) := 𝑛.0.1.gt( x ↦ 0 )  # 𝕄(Φ.φ)
    𝔼(L_number_gt):  # 𝕄(Φ.φ)
      applied(𝑛.1.1) := 5  # 𝕄(Φ.a🌵0)
      formation(𝑛.1.1)  # 𝔻(Φ.a🌵0)
        applied(𝑛.1.2) := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵0)
        formation(𝑛.1.2)  # 𝔻(Φ.a🌵0)
      𝛿1.1 := 40-14-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      applied(𝑛.1.3) := 0  # 𝕄(Φ.a🌵1)
      formation(𝑛.1.3)  # 𝔻(Φ.a🌵1)
        applied(𝑛.1.4) := Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵1)
        formation(𝑛.1.4)  # 𝔻(Φ.a🌵1)
      𝛿2.1 := 00-00-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.1.5 := Φ.bool( φ ↦ 𝜎1:λ )  # 𝑛
      applied(𝑛.1.6) := Φ.bool( φ ↦ 𝜎1:λ )  # 𝕄(Φ.φ)
      𝑛.1.7 := 𝑛.1.6  # 𝕄(𝑛.1.5)
    applied(𝑛.0.3) := 𝑛.1.6.if( then ↦ 1.plus( 2 ) )  # 𝕄(Φ.φ)
    applied(𝑛.0.4) := 𝑛.0.3( else ↦ 3.plus( 4 ) )  # 𝕄(Φ.φ)
    𝔼(L_fork):  # 𝕄(Φ.φ)
      applied(𝑛.2.1) := Φ.bool( φ ↦ 𝜎1:λ )  # 𝕄(Φ.a🌵2)
      formation(𝑛.2.1)  # 𝔻(Φ.a🌵2)
      𝛿1.2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      applied(𝑛.2.2) := 1  # 𝕄(Φ.a🌵3)
      applied(𝑛.2.3) := 𝑛.2.2.plus( x ↦ 2 )  # 𝕄(Φ.a🌵3)
      applied(𝑛.2.4) := Φ.bytes( φ ↦ 40-00-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵3.x)
      applied(𝑛.2.5) := Φ.number( φ ↦ 𝑛.2.4 )  # 𝕄(Φ.a🌵3.x)
      𝔼(L_number_plus):  # 𝕄(Φ.a🌵3)
        applied(𝑛.3.1) := 1  # 𝕄(Φ.a🌵4)
        formation(𝑛.3.1)  # 𝔻(Φ.a🌵4)
          applied(𝑛.3.2) := Φ.bytes( φ ↦ 3F-F0-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵4)
          formation(𝑛.3.2)  # 𝔻(Φ.a🌵4)
        𝛿1.3 := 3F-F0-00-00-00-00-00-00  # 𝔻(ξ.ρ)
        applied(𝑛.3.3) := Φ.number( φ ↦ 𝑛.2.4 )  # 𝕄(Φ.a🌵5)
        formation(𝑛.3.3)  # 𝔻(Φ.a🌵5)
          applied(𝑛.3.4) := Φ.bytes( φ ↦ 40-00-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵5)
          formation(𝑛.3.4)  # 𝔻(Φ.a🌵5)
        𝛿2.3 := 40-00-00-00-00-00-00-00  # 𝔻(ξ.x)
        𝑛.3.5 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
        applied(𝑛.3.6) := Φ.number( φ ↦ 𝜎2:λ )  # 𝕄(Φ.a🌵3)
        𝑛.3.7 := 𝑛.3.6  # 𝕄(𝑛.3.5)
      𝑛1.2 := 𝑛.3.7  # 𝕄(ξ.then)
      applied(𝑛.2.6) := 3  # 𝕄(Φ.a🌵6)
      applied(𝑛.2.7) := 𝑛.2.6.plus( x ↦ 4 )  # 𝕄(Φ.a🌵6)
      applied(𝑛.2.8) := Φ.bytes( φ ↦ 40-10-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵6.x)
      applied(𝑛.2.9) := Φ.number( φ ↦ 𝑛.2.8 )  # 𝕄(Φ.a🌵6.x)
      𝔼(L_number_plus):  # 𝕄(Φ.a🌵6)
        applied(𝑛.4.1) := 3  # 𝕄(Φ.a🌵7)
        formation(𝑛.4.1)  # 𝔻(Φ.a🌵7)
          applied(𝑛.4.2) := Φ.bytes( φ ↦ 40-08-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵7)
          formation(𝑛.4.2)  # 𝔻(Φ.a🌵7)
        𝛿1.4 := 40-08-00-00-00-00-00-00  # 𝔻(ξ.ρ)
        applied(𝑛.4.3) := Φ.number( φ ↦ 𝑛.2.8 )  # 𝕄(Φ.a🌵8)
        formation(𝑛.4.3)  # 𝔻(Φ.a🌵8)
          applied(𝑛.4.4) := Φ.bytes( φ ↦ 40-10-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵8)
          formation(𝑛.4.4)  # 𝔻(Φ.a🌵8)
        𝛿2.4 := 40-10-00-00-00-00-00-00  # 𝔻(ξ.x)
        𝑛.4.5 := Φ.number( φ ↦ 𝜎3:λ )  # 𝑛
        applied(𝑛.4.6) := Φ.number( φ ↦ 𝜎3:λ )  # 𝕄(Φ.a🌵6)
        𝑛.4.7 := 𝑛.4.6  # 𝕄(𝑛.4.5)
      𝑛2.2 := 𝑛.4.7  # 𝕄(ξ.else)
      𝑛3.2 := 𝑛1.2  # 𝑛1
      𝑛4.2 := 𝑛2.2  # 𝑛2
      𝔻(𝜎4:λ) ∈ { 𝔻(𝜎2:λ), 𝔻(𝜎3:λ) }
      𝑛5.2 := ⟦ φ ↦ 𝜎4:λ, gt(x) ↦ L_number_gt:λ, plus(x) ↦ L_number_plus:λ ⟧  # [𝑛3, 𝑛4]
      𝑛.2.10 := 𝑛5.2  # 𝑛
      𝑛.2.11 := 𝑛5.2  # 𝕄(𝑛.2.10)
    applied(𝑛.0.5) := Φ.number( φ ↦ 𝜎4:λ ).plus( x ↦ 6 )  # 𝕄(Φ.φ)
    applied(𝑛.0.6) := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )  # 𝕄(Φ.φ.x)
    applied(𝑛.0.7) := Φ.number( φ ↦ 𝑛.0.6 )  # 𝕄(Φ.φ.x)
    𝔼(L_number_plus):  # 𝕄(Φ.φ)
      applied(𝑛.5.1) := Φ.number( φ ↦ 𝜎4:λ )  # 𝕄(Φ.a🌵9)
      formation(𝑛.5.1)  # 𝔻(Φ.a🌵9)
      𝛿1.5 := 𝔻(𝜎4:λ)  # 𝔻(ξ.ρ)
      applied(𝑛.5.2) := Φ.number( φ ↦ 𝑛.0.6 )  # 𝕄(Φ.a🌵10)
      formation(𝑛.5.2)  # 𝔻(Φ.a🌵10)
        applied(𝑛.5.3) := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵10)
        formation(𝑛.5.3)  # 𝔻(Φ.a🌵10)
      𝛿2.5 := 40-18-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.5.4 := Φ.number( φ ↦ 𝜎5:λ )  # 𝑛
      applied(𝑛.5.5) := Φ.number( φ ↦ 𝜎5:λ )  # 𝕄(Φ.φ)
      𝑛.5.6 := 𝑛.5.5  # 𝕄(𝑛.5.4)
