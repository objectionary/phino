---
# yamllint disable rule:line-length
# A program written by an earlier run holds symbols of its own, so minting
# starts after the last of them and a fresh symbol is never spelled like one
# the input was already written with.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    old ↦ ⟦ λ ⤍ 𝜎3 ⟧,
    φ ↦ 5.plus( 6 ).φ ⟧
result: '𝜎4:λ'
protocol: |
  𝕄(Φ.φ):
    𝑛·0·1 := 5.0
    𝑛·0·2 := 𝑛·0·1.plus( x ↦ 6.0 )
    𝔼(L_number_plus):
      𝔻(ξ.ρ):
        𝕄(ξ.ρ):
          𝑛·1·1 := 5.0
        boxed 𝑛·1·2 := 𝑛·1·1.φ
        𝕄(𝑛·1·2):
          𝑛·1·3 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
        boxed 𝑛·1·4 := 𝑛·1·3.φ
        𝛿·1·1 := 40-14-00-00-00-00-00-00  # 5.0
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.ρ)
      𝔻(ξ.x):
        𝕄(ξ.x):
          𝑛·1·5 := 6.0
        boxed 𝑛·1·6 := 𝑛·1·5.φ
        𝕄(𝑛·1·6):
          𝑛·1·7 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
        boxed 𝑛·1·8 := 𝑛·1·7.φ
        𝛿·1·2 := 40-18-00-00-00-00-00-00  # 6.0
      𝛿2·1 := 𝛿·1·2  # 𝔻(ξ.x)
      𝑛·1·9 := Φ.number( φ ↦ 𝜎4:λ )  # 𝑛
      𝕄(𝑛·1·9):
        𝑛·1·10 := Φ.number( φ ↦ 𝜎4:λ )
      𝑛·1·11 := 𝑛·1·10  # 𝕄(𝑛·1·9)
