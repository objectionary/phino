---
# yamllint disable rule:line-length
# A program written by an earlier run holds symbols of its own, so minting
# starts after the last of them and a fresh symbol is never spelled like one
# the input was already written with.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    old ↦ ⟦ λ ⤍ 𝜎3 ⟧,
    @ ↦ 5.plus( 6 ) ⟧
result: >
  ⟦ φ ↦ ⟦ λ ⤍ 𝜎4 ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧, ρ ↦ ⟦ bytes(φ) ↦ ⟦⟧,
  number(φ) ↦ ⟦ plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧, old ↦ ⟦ λ ⤍ 𝜎3 ⟧, φ ↦
  5.plus( 6 ) ⟧ ⟧
protocol: |
  𝕄(Φ.φ)
    𝔼(L_number_plus)
      𝛿1.1 := 40-14-00-00-00-00-00-00  # ξ.ρ
      𝛿2.1 := 40-18-00-00-00-00-00-00  # ξ.x
      𝑛.1.1 := Φ.number( φ ↦ ⟦ λ ⤍ 𝜎4 ⟧ )
      𝑛.1.2 := ⟦ φ ↦ ⟦ λ ⤍ 𝜎4 ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧, ρ ↦ ⟦ bytes(φ) ↦ ⟦⟧, number(φ) ↦ ⟦ plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧, old ↦ ⟦ λ ⤍ 𝜎3 ⟧, φ ↦ 5.plus( 6 ) ⟧ ⟧  # 𝕄(𝑛.1.1)
