---
# yamllint disable rule:line-length
# A program written by an earlier run holds symbols of its own, so minting
# starts after the last of them and a fresh symbol is never spelled like one
# the input was already written with.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    old ↦ ⟦ λ ⤍ 𝜎3 ⟧,
    @ ↦ 5.plus( 6 ) ⟧
result: '⟦ φ ↦ 𝜎4:λ, plus(x) ↦ L_number_plus:λ ⟧'
protocol: |
  𝕄(Φ.φ):
    𝑛.0.1 := 5
    𝑛.0.2 := 𝑛.0.1.plus( x ↦ 6 )
    𝕄(Φ.φ.x):
      𝑛.0.3 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
      𝑛.0.4 := Φ.number( φ ↦ 𝑛.0.3 )
    𝔼(L_number_plus):
      𝔻(Φ.a🌵0):
        𝕄(Φ.a🌵0):
          𝑛.1.1 := 5
          𝑛.1.2 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
        𝛿.1.1 := 40-14-00-00-00-00-00-00
      𝛿1.1 := 𝛿.1.1  # 𝔻(ξ.ρ)
      𝔻(Φ.a🌵1):
        𝕄(Φ.a🌵1):
          𝑛.1.3 := Φ.number( φ ↦ 𝑛.0.3 )
          𝑛.1.4 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
        𝛿.1.2 := 40-18-00-00-00-00-00-00
      𝛿2.1 := 𝛿.1.2  # 𝔻(ξ.x)
      𝑛.1.5 := Φ.number( φ ↦ 𝜎4:λ )  # 𝑛
      𝕄(𝑛.1.5):
        𝑛.1.6 := Φ.number( φ ↦ 𝜎4:λ )
      𝑛.1.7 := 𝑛.1.6  # 𝕄(𝑛.1.5)
