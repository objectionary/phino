---
# yamllint disable rule:line-length
# The site a firing is written under, which the '--deep' walk refines as it
# enters a binding: both firings are of the same entry and answer the same way,
# so the locator standing beside them is the one thing telling a reader which
# part of the program each of them belongs to. A locator reaches a binding and
# no further: the λ function of the first one fires on a dispatch standing
# inside 'mark', which no locator names, so the firing is written under
# 'Φ.foo.mark' — the binding the walk had entered.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    foo ↦ ⟦ mark ↦ 5.plus( 6 ) ⟧,
    bar ↦ 7.plus( 8 ) ⟧
protocol: |
  𝕄(Φ)
    applied(𝑛.0.1) := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )  # 𝕄(Φ.foo.mark)
    applied(𝑛.0.2) := 5  # 𝕄(Φ.foo.mark)
    applied(𝑛.0.3) := 5  # 𝕄(Φ.foo.mark)
    applied(𝑛.0.4) := 5.plus  # 𝕄(Φ.foo.mark)
    applied(𝑛.0.5) := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )  # 𝕄(Φ.foo.mark)
    applied(𝑛.0.6) := 6  # 𝕄(Φ.foo.mark)
    applied(𝑛.0.7) := 5  # 𝕄(Φ.foo.mark)
    applied(𝑛.0.8) := 5.plus  # 𝕄(Φ.foo.mark)
    applied(𝑛.0.9) := 5.plus( x ↦ 6 )  # 𝕄(Φ.foo.mark)
    𝔼(L_number_plus)  # 𝕄(Φ.foo.mark)
      applied(𝑛.1.1) := 5  # 𝕄(Φ.a🌵0)
      formation(𝑛.1.1)  # 𝔻(Φ.a🌵0)
        applied(𝑛.1.2) := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵0)
        formation(𝑛.1.2)  # 𝔻(Φ.a🌵0)
      𝛿1.1 := 40-14-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      applied(𝑛.1.3) := 6  # 𝕄(Φ.a🌵1)
      formation(𝑛.1.3)  # 𝔻(Φ.a🌵1)
        applied(𝑛.1.4) := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵1)
        formation(𝑛.1.4)  # 𝔻(Φ.a🌵1)
      𝛿2.1 := 40-18-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.1.5 := Φ.number( φ ↦ 𝜎1:λ )  # 𝑛
      applied(𝑛.1.6) := Φ.number( φ ↦ 𝜎1:λ )  # 𝕄(Φ.foo.mark)
      𝑛.1.7 := 𝑛.1.6  # 𝕄(𝑛.1.5)
    applied(𝑛.0.10) := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )  # 𝕄(Φ.bar)
    applied(𝑛.0.11) := 7  # 𝕄(Φ.bar)
    applied(𝑛.0.12) := 7  # 𝕄(Φ.bar)
    applied(𝑛.0.13) := 7.plus  # 𝕄(Φ.bar)
    applied(𝑛.0.14) := Φ.bytes( φ ↦ 40-20-00-00-00-00-00-00:Δ )  # 𝕄(Φ.bar)
    applied(𝑛.0.15) := 8  # 𝕄(Φ.bar)
    applied(𝑛.0.16) := 7  # 𝕄(Φ.bar)
    applied(𝑛.0.17) := 7.plus  # 𝕄(Φ.bar)
    applied(𝑛.0.18) := 7.plus( x ↦ 8 )  # 𝕄(Φ.bar)
    𝔼(L_number_plus)  # 𝕄(Φ.bar)
      applied(𝑛.2.1) := 7  # 𝕄(Φ.a🌵2)
      formation(𝑛.2.1)  # 𝔻(Φ.a🌵2)
        applied(𝑛.2.2) := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵2)
        formation(𝑛.2.2)  # 𝔻(Φ.a🌵2)
      𝛿1.2 := 40-1C-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      applied(𝑛.2.3) := 8  # 𝕄(Φ.a🌵3)
      formation(𝑛.2.3)  # 𝔻(Φ.a🌵3)
        applied(𝑛.2.4) := Φ.bytes( φ ↦ 40-20-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵3)
        formation(𝑛.2.4)  # 𝔻(Φ.a🌵3)
      𝛿2.2 := 40-20-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.2.5 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
      applied(𝑛.2.6) := Φ.number( φ ↦ 𝜎2:λ )  # 𝕄(Φ.bar)
      𝑛.2.7 := 𝑛.2.6  # 𝕄(𝑛.2.5)
