---
# yamllint disable rule:line-length
# The tail of the pair below is a copy of 'Φ.l/.throw', which raises, so firing
# it answers the copy as it is. A 'remint' step answers such a copy of an
# object of the world with a fresh symbol and writes it as a deferred copy,
# naming the object by the term as written and every argument by the symbol it
# comes to: here '𝜎2', the known symbol of the message '01-' (#1923).
symbolic: |
  - λ: L_shrink
    morph:
      𝑛1: $.x
    rewrite:
      𝑛2:
        of: 𝑛1
        rules:
          - name: small-pair
            pattern: ⟦ !B1, head ↦ 𝑒1, tail ↦ 𝑒2, !B2 ⟧
            result: ⟦ !B1, head ↦ 𝑒3, tail ↦ 𝑒4, !B2 ⟧
            where:
              - meta: 𝑒3
                function: remint
                args: [𝑒1]
              - meta: 𝑒4
                function: remint
                args: [𝑒2]
    terminators: [L_throw]
    𝑛: 𝑛2
location: 'Q.y'
input: '⟦ l/ ↦ ⟦ throw(message) ↦ ⟦ λ ⤍ L_throw ⟧ ⟧, y ↦ ⟦ x ↦ ⟦ head ↦ ⟦ λ ⤍ 𝜎1 ⟧, tail ↦ Φ.l/.throw( message ↦ ⟦ Δ ⤍ 01- ⟧ ) ⟧, λ ⤍ L_shrink ⟧.tail ⟧'
result: '𝜎3:λ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_shrink):
      𝑛1·1 := ⟦ head ↦ 𝜎1:λ, tail ↦ Φ.l/.throw( message ↦ 01-:Δ ) ⟧  # 𝕄(ξ.x)
      𝕄(Φ.l/.throw( message ↦ 01-:Δ )):
        𝑛·1·1 := ⟦ message ↦ ∅, λ ⤍ L_throw ⟧( message ↦ 01-:Δ )
      𝔻(𝜎2:λ) == 01-
      deferred(𝜎3) := Φ.l/.throw( message ↦ 𝜎2:λ )  # 𝕄(Φ.l/.throw( message ↦ 01-:Δ ))
      𝑛2·1 := ⟦ head ↦ 𝜎1:λ, tail ↦ 𝜎3:λ ⟧  # 𝑛1
      𝑛·1·2 := ⟦ head ↦ 𝜎1:λ, tail ↦ 𝜎3:λ ⟧  # 𝑛
      𝑛·1·3 := ⟦ head ↦ 𝜎1:λ, tail ↦ 𝜎3:λ ⟧  # 𝕄(𝑛·1·2)
