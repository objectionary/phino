---
# yamllint disable rule:line-length
# The very firing that fails without '--partial', with it: a 'remint' step
# with no symbol to answer gets the firing stuck, so '--partial' parks the
# site, as it parks a fork whose branches do not join (#1923).
symbolic: |
  - λ: L_shrink
    morph:
      𝑛1: $.x
    rewrite:
      𝑛2:
        of: 𝑛1
        rules:
          - name: small-pair
            pattern: ⟦ !B1, head ↦ 𝑒1, tail ↦ 𝑒2, !B2 ⟧
            result: ⟦ !B1, head ↦ 𝑒3, tail ↦ 𝑒4, !B2 ⟧
            where:
              - meta: 𝑒3
                function: remint
                args: [𝑒1]
              - meta: 𝑒4
                function: remint
                args: [𝑒2]
    𝑛: 𝑛2
location: 'Q.y'
partial: true
input: '⟦ y ↦ ⟦ x ↦ ⟦ head ↦ ⟦ λ ⤍ 𝜎1 ⟧, tail ↦ ⟦ k ↦ ⟦ λ ⤍ 𝜎2 ⟧ ⟧ ⟧, λ ⤍ L_shrink ⟧.tail ⟧'
result: '⟦ x ↦ ⟦ head ↦ 𝜎1:λ, tail ↦ 𝜎2:λ:k ⟧, λ ⤍ L_shrink ⟧.tail'
protocol: |
  𝕄(Φ.y):
    𝔼(L_shrink):
      𝑛1·1 := ⟦ head ↦ 𝜎1:λ, tail ↦ 𝜎2:λ:k ⟧  # 𝕄(ξ.x)
      unreminted(L_shrink)  # 𝜎2:λ:k
