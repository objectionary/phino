---
# yamllint disable rule:line-length
# The very operand '--partial' parks, without the option: an operand of a
# firing that reaches the terminator ⊥ still fails the run, as it did before
# #1401, and the protocol keeps what the run had reached when it did.
symbolic: |
  - λ: L_dataized
    dataize:
      𝛿1: $.target
    𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_entry
    dataize:
      𝛿1: $.n
    morph:
      𝑛1: $.v.φ
    𝑛: Φ.l🌵.root( 𝑛1 )
  - λ: L_root
    dataize:
      𝛿1: $.v
    𝑛: ⟦ ⟧
location: 'Q.l🌵'
deep: true
acyclic: true
steps: 32
input: >
  ⟦
    number ↦ ⟦ φ ↦ ∅ ⟧,
    bytes ↦ ⟦ φ ↦ ∅, size ↦ ⟦ λ ⤍ L_bytes_size ⟧ ⟧,
    dataized ↦ ⟦ target ↦ ∅, λ ⤍ L_dataized ⟧,
    block ↦ ⟦ data ↦ ∅, buffer ↦ ∅, read ↦ ⟦ φ ↦ Φ.dataized( target ↦ ξ.ρ.data.size ).as-bytes ⟧ ⟧,
    l🌵 ↦ ⟦
      mark ↦ ⟦ n ↦ ∅, v ↦ ∅, λ ⤍ L_entry ⟧,
      root ↦ ⟦ v ↦ ∅, λ ⤍ L_root ⟧,
      e1 ↦ Φ.l🌵.mark( n ↦ Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍ 3F-F0-00-00-00-00-00-00 ⟧ ) ) )( v ↦ Φ.block( buffer ↦ Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎1 ⟧ ) ).read )
    ⟧
  ⟧
fails: 'terminator ⊥'
protocol: |
  𝕄(Φ.l🌵)
    𝔼(L_entry)  # 𝕄(Φ.l🌵.e1)
      formation(Φ.bytes( φ ↦ 3F-F0-00-00-00-00-00-00:Δ ):φ)  # 𝔻(Φ.a🌵0)
        formation(⟦ φ ↦ 3F-F0-00-00-00-00-00-00:Δ, size ↦ L_bytes_size:λ ⟧)  # 𝔻(Φ.a🌵0)
      𝛿1.1 := 3F-F0-00-00-00-00-00-00  # 𝔻(ξ.n)
      𝔼(L_dataized)  # 𝕄(Φ.a🌵1)
