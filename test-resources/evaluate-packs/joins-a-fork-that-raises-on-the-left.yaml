---
# yamllint disable rule:line-length
# The same fork with its branches given by position and the ⊥ on the other
# side: a positional ⊥ is as much an argument the program wrote as a named one,
# so the walk fires the fork all the same, and the join says the program raises
# on the left and answers the right (#1405).
symbolic: |
  - λ: L_number_gt
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.ρ
    morph:
      𝑛1: $.then
      𝑛2: $.else
    symbolize:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      𝑛5: [𝑛3, 𝑛4]
    𝑛: 𝑛5
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    bool(φ) ↦ ⟦ if ↦ ⟦ ρ ↦ ∅, then ↦ ∅, else ↦ ∅, λ ⤍ L_fork ⟧ ⟧,
    number(φ) ↦ ⟦
      gt(ρ, x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.gt( 0 ).if( ⊥, 1.plus( 2 ) ).plus( 6 ) ⟧
result: >-
  ⟦ φ ↦ ⟦ λ ⤍ 𝜎3 ⟧, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus
  ⟧ ⟧
protocol: |
  𝕄(Φ.φ)
    𝔼(L_number_gt)  # 𝕄(Φ.φ)
      𝛿1.1 := 40-14-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      𝛿2.1 := 00-00-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.1.1 := Φ.bool( φ ↦ 𝜎1:λ )  # 𝑛
      𝑛.1.2 := ⟦ φ ↦ 𝜎1:λ, if(then, else) ↦ ⟦ λ ⤍ L_fork ⟧ ⟧  # 𝕄(𝑛.1.1)
    𝔼(L_fork)  # 𝕄(Φ.φ)
      𝛿1.2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      𝑛1.2 := ⊥  # 𝕄(ξ.then)
      𝔼(L_number_plus)  # 𝕄(Φ.a🌵4)
        𝛿1.3 := 3F-F0-00-00-00-00-00-00  # 𝔻(ξ.ρ)
        𝛿2.3 := 40-00-00-00-00-00-00-00  # 𝔻(ξ.x)
        𝑛.3.1 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
        𝑛.3.2 := ⟦ φ ↦ 𝜎2:λ, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧  # 𝕄(𝑛.3.1)
      𝑛2.2 := 𝑛.3.2  # 𝕄(ξ.else)
      𝑛3.2 := ⊥  # 𝑛1
      𝑛4.2 := 𝑛2.2  # 𝑛2
      terminate(𝔻(𝜎1:λ), left)  # 𝑛3
      𝑛5.2 := 𝑛4.2  # [𝑛3, 𝑛4]
      𝑛.2.1 := 𝑛5.2  # 𝑛
      𝑛.2.2 := 𝑛5.2  # 𝕄(𝑛.2.1)
    𝔼(L_number_plus)  # 𝕄(Φ.φ)
      𝛿1.4 := 𝔻(𝜎2:λ)  # 𝔻(ξ.ρ)
      𝛿2.4 := 40-18-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.4.1 := Φ.number( φ ↦ 𝜎3:λ )  # 𝑛
      𝑛.4.2 := ⟦ φ ↦ 𝜎3:λ, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧  # 𝕄(𝑛.4.1)
