---
# yamllint disable rule:line-length
# The right side ends its φ chain in a bare symbol, and it holds another one
# under 'ke', off that chain. What the right side holds does not matter to a
# 'cast' block, which used to cast nothing here (#2187): it casts the bare
# symbol on the left into a copy of the right side with 𝜎2 in place of 𝜎3,
# keeping 𝜎4 under 'ke' (#2223). The two sides then differ in their φ alone,
# and the join makes one term of them with 𝜎5 standing for that φ.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.c
    morph:
      𝑛1: $.a
      𝑛2: $.b
    cast:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      on: 𝛿1
      left: 𝑛3
      right: 𝑛4
location: 'Q.y'
input: '⟦ y ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎1 ⟧, a ↦ ⟦ λ ⤍ 𝜎2 ⟧, b ↦ ⟦ φ ↦ ⟦ λ ⤍ 𝜎3 ⟧, ke ↦ ⟦ λ ⤍ 𝜎4 ⟧ ⟧, λ ⤍ L_fork ⟧.φ ⟧'
result: '𝜎5:λ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝔻(ξ.c):
        𝛿·1·1 := 𝔻(𝜎1:λ)
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.c)
      𝕄(ξ.a):
        morphed 𝑛·1·1 := 𝜎2:λ
      𝑛1·1 := 𝑛·1·1  # 𝕄(ξ.a)
      𝕄(ξ.b):
        morphed 𝑛·1·2 := ⟦ φ ↦ 𝜎3:λ, ke ↦ 𝜎4:λ ⟧
      𝑛2·1 := 𝑛·1·2  # 𝕄(ξ.b)
      cast 𝑛3·1 := ⟦ φ ↦ 𝜎2:λ, ke ↦ 𝜎4:λ ⟧  # 𝑛1·1 up to 𝑛2·1
      joined 𝜎5 := 𝛿1·1 ? 𝜎2 : 𝜎3
      𝑛·1·3 := ⟦ φ ↦ 𝜎5:λ, ke ↦ 𝜎4:λ ⟧
    morphed 𝑛·0·1 := 𝜎5:λ
