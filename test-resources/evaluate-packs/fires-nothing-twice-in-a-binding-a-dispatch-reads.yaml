---
# yamllint disable rule:line-length
# Under '--deep' the head pass of 𝕄 fires the reads of siblings in the
# binding it dispatches into before it reads that binding (#1727), and only
# them. Here every sibling 'φ' reads is 'a', which is no λ, so nothing fires
# before the head pass reads 'φ', and each of the two 'L_plus' fires once.
# Walking the whole binding instead would settle 'a.twice.plus' on the way,
# which fires the inner 'L_plus', and keep nothing of it, since what it
# settles to is a 'plus' still waiting for 'x' and no answer of a λ. The head
# pass would then fire the inner 'L_plus' again, three firings in all.
symbolic: |
  - λ: L_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.e'
deep: true
partial: true
input: >
  ⟦ bytes(φ) ↦ ⟦ plus(ρ, x) ↦ L_plus:λ, twice(ρ) ↦ ⟦ φ ↦ ξ.ρ.plus( x ↦ ξ.ρ ) ⟧ ⟧,
    pair(a) ↦ ⟦ φ ↦ a.twice.plus( x ↦ a ) ⟧,
    e ↦ Φ.pair( Φ.bytes( φ ↦ 𝜎1:λ ) ).φ ⟧
result: '⟦ φ ↦ 𝜎3:λ, plus(x) ↦ L_plus:λ, twice ↦ ρ.plus( x ↦ ρ ):φ ⟧'
protocol: |
  𝕄(Φ.e)
    applied(𝑛.0.1) := Φ.pair( a ↦ Φ.bytes( φ ↦ 𝜎1:λ ) )  # 𝕄(Φ.e)
    applied(𝑛.0.2) := Φ.bytes( φ ↦ 𝜎1:λ )  # 𝕄(Φ.e)
    applied(𝑛.0.3) := Φ.bytes( φ ↦ 𝜎1:λ )  # 𝕄(Φ.e)
    applied(𝑛.0.4) := Φ.bytes( φ ↦ 𝜎1:λ )  # 𝕄(Φ.e)
    applied(𝑛.0.5) := Φ.bytes( φ ↦ 𝜎1:λ )  # 𝕄(Φ.e)
    applied(𝑛.0.6) := Φ.bytes( φ ↦ 𝜎1:λ ).plus( x ↦ Φ.bytes( φ ↦ 𝜎1:λ ) )  # 𝕄(Φ.e)
    𝔼(L_plus)  # 𝕄(Φ.e)
      applied(𝑛.1.1) := Φ.bytes( φ ↦ 𝜎1:λ )  # 𝕄(Φ.a🌵0)
      formation(𝑛.1.1)  # 𝔻(Φ.a🌵0)
      𝛿1.1 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      applied(𝑛.1.2) := Φ.bytes( φ ↦ 𝜎1:λ )  # 𝕄(Φ.a🌵1)
      formation(𝑛.1.2)  # 𝔻(Φ.a🌵1)
      𝛿2.1 := 𝔻(𝜎1:λ)  # 𝔻(ξ.x)
      𝑛.1.3 := Φ.bytes( φ ↦ 𝜎2:λ )  # 𝑛
      applied(𝑛.1.4) := Φ.bytes( φ ↦ 𝜎2:λ )  # 𝕄(Φ.e)
      𝑛.1.5 := 𝑛.1.4  # 𝕄(𝑛.1.3)
    applied(𝑛.0.7) := Φ.bytes( φ ↦ 𝜎2:λ ).plus( x ↦ Φ.bytes( φ ↦ 𝜎1:λ ) )  # 𝕄(Φ.e)
    applied(𝑛.0.8) := Φ.bytes( φ ↦ 𝜎1:λ )  # 𝕄(Φ.e.x)
    applied(𝑛.0.9) := Φ.bytes( φ ↦ 𝜎1:λ )  # 𝕄(Φ.e.x)
    applied(𝑛.0.10) := Φ.bytes( φ ↦ 𝜎1:λ )  # 𝕄(Φ.e.x)
    𝔼(L_plus)  # 𝕄(Φ.e)
      applied(𝑛.2.1) := Φ.bytes( φ ↦ 𝜎2:λ )  # 𝕄(Φ.a🌵2)
      formation(𝑛.2.1)  # 𝔻(Φ.a🌵2)
      𝛿1.2 := 𝔻(𝜎2:λ)  # 𝔻(ξ.ρ)
      applied(𝑛.2.2) := Φ.bytes( φ ↦ 𝜎1:λ )  # 𝕄(Φ.a🌵3)
      formation(𝑛.2.2)  # 𝔻(Φ.a🌵3)
      𝛿2.2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.x)
      𝑛.2.3 := Φ.bytes( φ ↦ 𝜎3:λ )  # 𝑛
      applied(𝑛.2.4) := Φ.bytes( φ ↦ 𝜎3:λ )  # 𝕄(Φ.e)
      𝑛.2.5 := 𝑛.2.4  # 𝕄(𝑛.2.3)
