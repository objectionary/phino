---
# A deep walk under '_partial': the binding stuck on a λ function no entry
# answers is left as it is, and the walk goes on to the binding after it
# instead of giving the whole run up.
symbolic: |
  - λ: L_answers
    𝑛: ⟦ foo ↦ ⟦⟧, λ ⤍ 𝜎 ⟧
location: 'Q'
deep: true
partial: true
input: >
  ⟦ x ↦ ⟦ λ ⤍ L_none ⟧.foo,
    y ↦ ⟦ λ ⤍ L_answers ⟧.foo ⟧
result: '⟦ x ↦ ⟦ λ ⤍ L_none ⟧.foo, y ↦ ⟦ λ ⤍ L_answers ⟧.foo ⟧'
protocol: |
  𝕄(Φ)
    ?(L_none)  # 𝕄(⟦ λ ⤍ L_none ⟧)
    𝔼(L_answers)  # 𝕄(Φ.y)
      𝑛.1.1 := ⟦ foo ↦ ⟦⟧, λ ⤍ 𝜎1 ⟧  # 𝑛
      𝑛.1.2 := ⟦ foo ↦ ⟦⟧, λ ⤍ 𝜎1 ⟧  # 𝕄(𝑛.1.1)
