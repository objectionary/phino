---
# yamllint disable rule:line-length
# The deferral of #1892 over a copy with two arguments: 'x' reads to the bare
# symbol '𝜎1', so the copy the fork takes is deferred, and 'w' is a call of
# 'L_inc'. Before it writes the 'deferred' line, the fork morphs 'w' at the
# place the side took in the universe, 'Φ.a🌵3.w', and fires what it comes
# to, so the line names the object 'Φ.num' the argument stands for, instead
# of the call as the code spells it (#1916, #1933, #1938).
symbolic: |
  - λ: L_inc
    dataize:
      𝛿1: $.x
    𝑛: Φ.num( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.c
    fork:
      on: 𝛿1
      left: $.a
      right: $.b
location: 'Q.y'
route: [right]
input: '⟦ box(x, w) ↦ ⟦ φ ↦ x.next ⟧, num(φ) ↦ ⟦⟧, inc(x) ↦ ⟦ λ ⤍ L_inc ⟧, items ↦ ⟦ tail ↦ ⟦ λ ⤍ 𝜎1 ⟧ ⟧, y ↦ ⟦ x ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎2 ⟧, a ↦ Φ.num, b ↦ Φ.box( x ↦ Φ.items.tail, w ↦ Φ.inc( ⟦ Δ ⤍ 2A- ⟧ ) ), λ ⤍ L_fork ⟧, λ ⤍ L_inc ⟧.φ ⟧'
result: '𝜎5:λ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_inc):
      𝔻(Φ.a🌵0):
        𝔼(L_fork):
          𝛿1·2 := 𝔻(𝜎2:λ)  # 𝔻(ξ.c)
          𝕄(Φ.a🌵3):
            𝑛·2·1 := Φ.box( x ↦ Φ.items.tail )
            𝑛·2·2 := 𝑛·2·1( w ↦ Φ.inc( 2A-:Δ ) )
          𝕄(Φ.a🌵3.w):
            𝑛·2·3 := Φ.inc( x ↦ 2A-:Δ )
          𝔼(L_inc):  # 𝔼(Φ.a🌵3.w)
            𝔻(Φ.a🌵4):
              𝛿·3·1 := 2A-
            𝛿1·3 := 𝛿·3·1  # 𝔻(ξ.x)
            𝑛·3·1 := Φ.num( φ ↦ 𝜎3:λ )  # 𝑛
            𝕄(𝑛·3·1):
              𝑛·3·2 := Φ.num( φ ↦ 𝜎3:λ )
            𝑛·3·3 := 𝑛·3·2  # 𝕄(𝑛·3·1)
          deferred(𝜎4) := Φ.box( x ↦ 𝜎1:λ, w ↦ 𝑛·3·2 )  # 𝕄(Φ.a🌵3.φ)
          forked(𝔻(𝜎2:λ)) := right  # ξ.b
          𝑛·2·4 := 𝜎4:λ  # 𝕄(ξ.b)
      𝛿1·1 := 𝔻(𝜎4:λ)  # 𝔻(ξ.x)
      𝑛·1·1 := Φ.num( φ ↦ 𝜎5:λ )  # 𝑛
      𝕄(𝑛·1·1):
        𝑛·1·2 := Φ.num( φ ↦ 𝜎5:λ )
      𝑛·1·3 := 𝑛·1·2  # 𝕄(𝑛·1·1)
