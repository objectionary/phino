---
# yamllint disable rule:line-length
# The program handed in is the answer an earlier run gave: its receiver is no
# number but the symbol 𝜎1 that run minted. The firing brings it down all the
# same, since a symbol dataizes to a fixed 42, and the protocol names the
# unknown that 42 stood for instead of writing the bytes twice.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    φ ↦ Φ.number( φ ↦ ⟦ λ ⤍ 𝜎1 ⟧ ).plus( 7 ).φ ⟧
result: '𝜎2:λ'
protocol: |
  𝕄(Φ.φ):
    normalized 𝑛·0·1 := ⟦ φ ↦ ∅, plus(x) ↦ L_number_plus:λ ⟧
    𝑛·0·2 := Φ.number( φ ↦ 𝜎1:λ )
    𝑛·0·3 := ⟦ φ ↦ 𝜎1:λ, plus(x) ↦ L_number_plus:λ ⟧
    normalized 𝑛·0·4 := 𝑛·0·3
    normalized 𝑛·0·5 := ⟦ x ↦ ∅, λ ⤍ L_number_plus ⟧
    𝑛·0·6 := 𝑛·0·2.plus( x ↦ 7.0 )
    𝑛·0·7 := ⟦ x ↦ 7.0, λ ⤍ L_number_plus ⟧
    normalized 𝑛·0·8 := 𝑛·0·7
    𝔼(L_number_plus):
      𝔻(ξ.ρ):
        𝕄(ξ.ρ):
          normalized 𝑛·1·1 := 𝑛·0·1
          𝑛·1·2 := Φ.number( φ ↦ 𝜎1:λ )
          𝑛·1·3 := ⟦ φ ↦ 𝜎1:λ, plus(x) ↦ L_number_plus:λ ⟧
          normalized 𝑛·1·4 := 𝑛·1·3
          normalized 𝑛·1·5 := 𝑛·1·4
          morphed 𝑛·1·6 := 𝑛·1·5
        boxed 𝑛·1·7 := 𝑛·1·6.φ
        normalized 𝑛·1·8 := 𝜎1:λ
        𝛿·1·1 := 𝔻(𝜎1:λ)
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.ρ)
      𝔻(ξ.x):
        𝕄(ξ.x):
          normalized 𝑛·1·9 := 𝑛·1·1
          𝑛·1·10 := 7.0
          𝑛·1·11 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
          normalized 𝑛·1·12 := 𝑛·1·11
          normalized 𝑛·1·13 := 𝑛·1·12
          morphed 𝑛·1·14 := 𝑛·1·13
        boxed 𝑛·1·15 := 𝑛·1·14.φ
        normalized 𝑛·1·16 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
        𝕄(𝑛·1·15):
          normalized 𝑛·1·17 := ∅:φ
          𝑛·1·18 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
          𝑛·1·19 := 40-1C-00-00-00-00-00-00:Δ:φ
          normalized 𝑛·1·20 := 𝑛·1·19
          normalized 𝑛·1·21 := 𝑛·1·20
          morphed 𝑛·1·22 := 𝑛·1·21
        boxed 𝑛·1·23 := 𝑛·1·22.φ
        normalized 𝑛·1·24 := 40-1C-00-00-00-00-00-00:Δ
        𝛿·1·2 := 40-1C-00-00-00-00-00-00  # 7.0
      𝛿2·1 := 𝛿·1·2  # 𝔻(ξ.x)
      𝑛·1·25 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
      𝕄(𝑛·1·25):
        normalized 𝑛·1·26 := 𝑛·1·9
        𝑛·1·27 := Φ.number( φ ↦ 𝜎2:λ )
        𝑛·1·28 := ⟦ φ ↦ 𝜎2:λ, plus(x) ↦ L_number_plus:λ ⟧
        normalized 𝑛·1·29 := 𝑛·1·28
        morphed 𝑛·1·30 := 𝑛·1·29
      𝑛·1·31 := 𝑛·1·30  # 𝕄(𝑛·1·25)
    normalized 𝑛·0·9 := 𝜎2:λ
    morphed 𝑛·0·10 := 𝑛·0·9
