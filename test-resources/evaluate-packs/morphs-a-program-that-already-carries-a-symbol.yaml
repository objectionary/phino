---
# yamllint disable rule:line-length
# The program handed in is the answer an earlier run gave: its receiver is no
# number but the symbol 𝜎1 that run minted. The firing brings it down all the
# same, since a symbol dataizes to a fixed 42, and the protocol names the
# unknown that 42 stood for instead of writing the bytes twice.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    φ ↦ Φ.number( φ ↦ ⟦ λ ⤍ 𝜎1 ⟧ ).plus( 7 ).φ ⟧
result: '𝜎2:λ'
protocol: |
  𝕄(Φ.φ):
    𝑛·0·1 := Φ.number( φ ↦ 𝜎1:λ )
    𝑛·0·2 := ⟦ φ ↦ 𝜎1:λ, plus(x) ↦ L_number_plus:λ ⟧
    𝑛·0·3 := 𝑛·0·1.plus( x ↦ 7.0 )
    𝑛·0·4 := ⟦ x ↦ 7.0, λ ⤍ L_number_plus ⟧
    𝔼(L_number_plus):
      𝔻(ξ.ρ):
        𝕄(ξ.ρ):
          𝑛·1·1 := Φ.number( φ ↦ 𝜎1:λ )
          𝑛·1·2 := ⟦ φ ↦ 𝜎1:λ, plus(x) ↦ L_number_plus:λ ⟧
          morphed 𝑛·1·3 := 𝑛·1·2
        boxed 𝑛·1·4 := 𝑛·1·3.φ
        𝛿·1·1 := 𝔻(𝜎1:λ)
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.ρ)
      𝔻(ξ.x):
        𝕄(ξ.x):
          𝑛·1·5 := 7.0
          𝑛·1·6 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
          morphed 𝑛·1·7 := 𝑛·1·6
        boxed 𝑛·1·8 := 𝑛·1·7.φ
        𝕄(𝑛·1·8):
          𝑛·1·9 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
          𝑛·1·10 := 40-1C-00-00-00-00-00-00:Δ:φ
          morphed 𝑛·1·11 := 𝑛·1·10
        boxed 𝑛·1·12 := 𝑛·1·11.φ
        𝛿·1·2 := 40-1C-00-00-00-00-00-00  # 7.0
      𝛿2·1 := 𝛿·1·2  # 𝔻(ξ.x)
      𝑛·1·13 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
      𝕄(𝑛·1·13):
        𝑛·1·14 := Φ.number( φ ↦ 𝜎2:λ )
        𝑛·1·15 := ⟦ φ ↦ 𝜎2:λ, plus(x) ↦ L_number_plus:λ ⟧
        morphed 𝑛·1·16 := 𝑛·1·15
      𝑛·1·17 := 𝑛·1·16  # 𝕄(𝑛·1·13)
    morphed 𝑛·0·5 := 𝜎2:λ
