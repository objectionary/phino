---
# yamllint disable rule:line-length
# A fork defers nothing by itself (#1982): a side written as a path from '$'
# is morphed and taken as it comes. The right side is the copy
# 'step( tup ↦ Φ.items.tail )', and 'Φ.items.tail' reads to the bare symbol
# '𝜎1', an object nobody knows. No 'defer' line reads the side, so the fork
# answers the copy itself, and the second path, which takes it, gets stuck
# where 'L_use' brings the copy down and asks '𝜎1' for 'next'. An entry that
# wants the copy deferred says so with a 'defer' line of its own.
symbolic: |
  - λ: L_use
    dataize:
      𝛿1: $.x
    𝑛: Φ.num( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.c
    fork:
      on: 𝛿1
      left: $.a
      right: $.b
location: 'Q.y'
paths: 2
input: '⟦ step(tup) ↦ ⟦ φ ↦ tup.next ⟧, items ↦ ⟦ tail ↦ ⟦ λ ⤍ 𝜎1 ⟧ ⟧, num(φ) ↦ ⟦⟧, y ↦ ⟦ x ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎2 ⟧, a ↦ ⟦ Δ ⤍ 01- ⟧, b ↦ Φ.step( tup ↦ Φ.items.tail ), λ ⤍ L_fork ⟧, λ ⤍ L_use ⟧.φ ⟧'
fails: "No entry of --symbolic answers the λ function '𝜎1'"
protocol: |
  𝕄(Φ.y):
    𝔼(L_use):
      𝔻(Φ.a🌵0):
        𝔼(L_fork):
          𝛿1·2 := 𝔻(𝜎2:λ)  # 𝔻(ξ.c)
          𝕄(Φ.a🌵3):
            𝑛·2·1 := Φ.step( tup ↦ Φ.items.tail )
          forked(𝔻(𝜎2:λ)):
            left:  # ξ.a
              𝑛·2·2 := 01-:Δ  # 𝕄(ξ.a)
              𝛿·1·1 := 01-
              𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.x)
              𝑛·1·1 := Φ.num( φ ↦ 𝜎3:λ )  # 𝑛
              𝕄(𝑛·1·1):
                𝑛·1·2 := Φ.num( φ ↦ 𝜎3:λ )
              𝑛·1·3 := 𝑛·1·2  # 𝕄(𝑛·1·1)
            right:  # ξ.b
              𝑛·2·3 := 𝑛·2·1  # 𝕄(ξ.b)
              𝕄(Φ.a🌵0):
                unanswered(𝜎1)  # 𝕄(𝜎1:λ)
              stuck(𝜎1)
