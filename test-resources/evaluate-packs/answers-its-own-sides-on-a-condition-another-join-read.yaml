---
# yamllint disable rule:line-length
# Two joins on one condition answer each its own sides (#1940). The memo of
# 'plausible' keeps the answer of a firing by the λ name and the operands it
# came down to, and a join reads its sides as well as its condition, so the
# second join, on the condition the first one read, reduces its own sides and
# answers 70 instead of the 7 of the first join.
symbolic: |
  - λ: L_number_gt
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_pick
    dataize:
      𝛿1: $.x
    morph:
      𝑛1: $.y
    evaluate:
      𝑛2: 𝑛1
    𝑛: 𝑛2
  - λ: L_fork
    dataize:
      𝛿1: $.ρ
    join:
      on: 𝛿1
      left: $.then
      right: $.else
location: 'Q.@'
acyclic: plausible
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    bool(φ) ↦ ⟦ if ↦ ⟦ ρ ↦ ∅, then ↦ ∅, else ↦ ∅, λ ⤍ L_fork ⟧ ⟧,
    number(φ) ↦ ⟦ gt(ρ, x) ↦ ⟦ λ ⤍ L_number_gt ⟧ ⟧,
    pick(x, y) ↦ ⟦ λ ⤍ L_pick ⟧,
    φ ↦ Φ.pick( 5.gt( 0 ).if( 7, 7 ), 5.gt( 0 ).if( 70, 70 ) ).φ ⟧
result: '⟦ φ ↦ ⟦ Δ ⤍ 40-51-80-00-00-00-00-00 ⟧ ⟧'
protocol: |
  𝕄(Φ.φ):
    𝑛·0·1 := Φ.pick( x ↦ 5.0.gt( 0.0 ).if( 7.0, 7.0 ) )
    𝑛·0·2 := 𝑛·0·1( y ↦ 5.0.gt( 0.0 ).if( 70.0, 70.0 ) )
    𝔼(L_pick):
      𝔻(Φ.a🌵0):
        𝕄(Φ.a🌵0):
          𝑛·1·1 := 5.0
          𝑛·1·2 := 𝑛·1·1.gt( x ↦ 0.0 )
          𝔼(L_number_gt):
            𝔻(Φ.a🌵1):
              𝕄(Φ.a🌵1):
                𝑛·2·1 := 5.0
              boxed 𝑛·2·2 := 𝑛·2·1.φ
              𝕄(𝑛·2·2):
                𝑛·2·3 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
              boxed 𝑛·2·4 := 𝑛·2·3.φ
              𝛿·2·1 := 40-14-00-00-00-00-00-00  # 5.0
            𝛿1·2 := 𝛿·2·1  # 𝔻(ξ.ρ)
            𝔻(Φ.a🌵2):
              𝕄(Φ.a🌵2):
                𝑛·2·5 := 0.0
              boxed 𝑛·2·6 := 𝑛·2·5.φ
              𝕄(𝑛·2·6):
                𝑛·2·7 := Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ )
              boxed 𝑛·2·8 := 𝑛·2·7.φ
              𝛿·2·2 := 00-00-00-00-00-00-00-00  # 0.0
            𝛿2·2 := 𝛿·2·2  # 𝔻(ξ.x)
            𝑛·2·9 := Φ.bool( φ ↦ 𝜎1:λ )  # 𝑛
            𝕄(𝑛·2·9):
              𝑛·2·10 := Φ.bool( φ ↦ 𝜎1:λ )
            𝑛·2·11 := 𝑛·2·10  # 𝕄(𝑛·2·9)
          𝑛·1·3 := 𝑛·2·10.if( then ↦ 7.0 )
          𝑛·1·4 := 𝑛·1·3( else ↦ 7.0 )
        𝔼(L_fork):
          𝔻(Φ.a🌵3):
            𝕄(Φ.a🌵3):
              𝑛·3·1 := Φ.bool( φ ↦ 𝜎1:λ )
            boxed 𝑛·3·2 := 𝑛·3·1.φ
          𝛿1·3 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
          𝕄(Φ.a🌵4):
            𝑛·3·3 := 7.0
          𝕄(Φ.a🌵5):
            𝑛·3·4 := 7.0
          𝑛·3·5 := 𝑛·3·4  # 𝕄(ξ.then), 𝕄(ξ.else)
        boxed 𝑛·1·5 := 𝑛·3·4.φ
        𝕄(𝑛·1·5):
          𝑛·1·6 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
        boxed 𝑛·1·7 := 𝑛·1·6.φ
        𝛿·1·1 := 40-1C-00-00-00-00-00-00  # 7.0
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.x)
      𝕄(Φ.a🌵6):
        𝑛·1·8 := Φ.number( φ ↦ 𝑛·2·3 )
        𝑛·1·9 := 𝑛·1·8.gt( x ↦ 𝑛·2·5 )
        𝔼(L_number_gt):
          𝑛·4·1 := 𝑛·3·1  # 𝑛
          𝑛·4·2 := 𝑛·2·11  # 𝕄(𝑛·4·1)
        𝑛·1·10 := 𝑛·3·1.if( then ↦ 70.0 )
        𝑛·1·11 := 𝑛·1·10( else ↦ 70.0 )
      𝑛1·1 := 𝑛·1·11  # 𝕄(ξ.y)
      𝔼(L_fork):  # 𝔼(𝑛1)
        𝔻(Φ.a🌵7):
          𝕄(Φ.a🌵7):
            𝑛·5·1 := Φ.bool( φ ↦ 𝜎1:λ )
          boxed 𝑛·5·2 := 𝑛·5·1.φ
        𝛿1·5 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
        𝕄(Φ.a🌵8):
          𝑛·5·3 := 70.0
        𝕄(Φ.a🌵9):
          𝑛·5·4 := 70.0
        𝑛·5·5 := 𝑛·5·4  # 𝕄(ξ.then), 𝕄(ξ.else)
      𝑛2·1 := 𝑛·5·4  # 𝔼(𝑛1)
      𝑛·1·12 := 𝑛·5·4  # 𝑛
      𝑛·1·13 := 𝑛·5·4  # 𝕄(𝑛·1·12)
    𝑛·0·3 := Φ.bytes( φ ↦ 40-51-80-00-00-00-00-00:Δ )
