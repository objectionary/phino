---
# yamllint disable rule:line-length
# The loop of #1729 without the walk of --deep: the right side of the fork
# is the copy 'step( tup ↦ Φ.items.tail )', and 'Φ.items.tail' reads to the
# bare symbol '𝜎1', an object nobody knows. Entering the copy would morph its
# φ, which asks '𝜎1' for 'next' and gets stuck. A path defers such a copy
# wherever it meets one (#1892, #1933, #1938): the fork answers it with a
# fresh symbol and writes a 'deferred' line naming the call the copy stands
# for. The fork is fired by 𝔻, as the operand of 'L_use', which is how the
# answer of a fork reaches an atom in EO.
symbolic: |
  - λ: L_use
    dataize:
      𝛿1: $.x
    𝑛: Φ.num( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.c
    fork:
      on: 𝛿1
      left: $.a
      right: $.b
location: 'Q.y'
route: [right]
input: '⟦ step(tup) ↦ ⟦ φ ↦ tup.next ⟧, items ↦ ⟦ tail ↦ ⟦ λ ⤍ 𝜎1 ⟧ ⟧, num(φ) ↦ ⟦⟧, y ↦ ⟦ x ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎2 ⟧, a ↦ Φ.num, b ↦ Φ.step( tup ↦ Φ.items.tail ), λ ⤍ L_fork ⟧, λ ⤍ L_use ⟧.φ ⟧'
result: '𝜎4:λ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_use):
      𝔻(Φ.a🌵0):
        𝔼(L_fork):
          𝛿1·2 := 𝔻(𝜎2:λ)  # 𝔻(ξ.c)
          forked(𝔻(𝜎2:λ)) := right  # ξ.b
          𝕄(Φ.a🌵2):
            𝑛·2·1 := Φ.step( tup ↦ Φ.items.tail )
          deferred(𝜎3) := Φ.step( tup ↦ 𝜎1:λ )  # 𝕄(Φ.a🌵2.φ)
          𝑛·2·2 := 𝜎3:λ  # 𝕄(ξ.b)
      𝛿1·1 := 𝔻(𝜎3:λ)  # 𝔻(ξ.x)
      𝑛·1·1 := Φ.num( φ ↦ 𝜎4:λ )  # 𝑛
      𝕄(𝑛·1·1):
        𝑛·1·2 := Φ.num( φ ↦ 𝜎4:λ )
      𝑛·1·3 := 𝑛·1·2  # 𝕄(𝑛·1·1)
