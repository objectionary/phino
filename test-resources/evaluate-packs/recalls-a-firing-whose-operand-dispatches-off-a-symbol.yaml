---
# yamllint disable rule:line-length
# Both sides fire the same copy of 'L_id', whose operand dispatches off a
# bare symbol. The dispatch is 'opaque' and gives a new symbol (#2479), so the
# left one answers and the memo keeps the answer; the right one recalls it.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.on🌵
    morph:
      𝑛1: $.left🌵
      𝑛2: $.right🌵
    join:
      on: 𝛿1
      left: 𝑛1
      right: 𝑛2
      otherwise: L_fork
  - λ: L_id
    morph:
      𝑛1: $.x
    𝑛: 𝑛1
location: 'Q.e1'
acyclic: plausible
input: '⟦ k ↦ ⟦ q ↦ ⟦⟧ ⟧, id ↦ ⟦ λ ⤍ L_id, x ↦ ⟦ λ ⤍ 𝜎1 ⟧.q ⟧, e1 ↦ ⟦ λ ⤍ L_fork, on🌵 ↦ ⟦ Δ ⤍ 00- ⟧, left🌵 ↦ Φ.id.φ, right🌵 ↦ Φ.id.φ ⟧.φ ⟧'
result: '𝜎6:λ'
protocol: |
  𝕄(Φ.e1):
    𝔼(L_fork):
      𝔻(ξ.on🌵):
        𝛿·1·1 ≔ 00-
      𝛿1·1 ≔ 𝛿·1·1  # 𝔻(ξ.on🌵)
      𝕄(ξ.left🌵):
        remembered 𝑛·1·1 ≡ Φ.id  # ⟦ λ ⤍ L_id, x ↦ 𝜎1:λ.q ⟧
        𝔼(L_id):
          𝕄(ξ.x):
            opaque 𝜎2:λ ≔ 𝜎1:λ.q
            morphed 𝑛·2·1 ≔ 𝜎2:λ
          𝑛1·2 ≔ 𝑛·2·1  # 𝕄(ξ.x)
          𝑛·2·2 ≔ 𝑛1·2  # 𝑛 of L_id
          𝕄(𝑛·2·2):
            morphed 𝑛·2·3 ≔ 𝑛1·2
          𝑛·2·4 ≔ 𝑛1·2  # 𝕄(𝑛·2·2)
          memoized 𝑛·1·1 ⇛ 𝜎2:λ
          evaluated 𝑛·2·5 ≔ 𝑛·2·4  # 𝑛·1·1
        opaque 𝜎3:λ ≔ 𝜎2:λ.φ
        morphed 𝑛·1·2 ≔ 𝜎3:λ
      𝑛1·1 ≔ 𝑛·1·2  # 𝕄(ξ.left🌵)
      𝕄(ξ.right🌵):
        𝔼(L_id):
          recalled 𝑛·1·1 ⇒ 𝜎2:λ
          𝑛·3·1 ≔ 𝑛·2·4  # 𝑛 of L_id
          𝑛·3·2 ≔ 𝑛·2·4  # 𝕄(𝑛·3·1)
          evaluated 𝑛·3·3 ≔ 𝑛·3·2  # 𝑛·1·1
        opaque 𝜎4:λ ≔ 𝜎2:λ.φ
        morphed 𝑛·1·3 ≔ 𝜎4:λ
      𝑛2·1 ≔ 𝑛·1·3  # 𝕄(ξ.right🌵)
      joined 𝜎5 ≔ 𝛿1·1 ? 𝜎3 : 𝜎4
      𝑛·1·4 ≔ 𝜎5:λ
      memoized 𝑛·1·5 ⇛ 𝜎5:λ  # ⟦ λ ⤍ L_fork, on🌵 ↦ 00-:Δ, left🌵 ↦ Φ.id.φ, right🌵 ↦ Φ.id.φ ⟧
      evaluated 𝑛·1·6 ≔ 𝑛·1·4  # 𝑛·1·5
    opaque 𝜎6:λ ≔ 𝜎5:λ.φ
    morphed 𝑛·0·1 ≔ 𝜎6:λ
