---
# yamllint disable rule:line-length
# Copies of the atom 'd' fired inside each other, since 'L_d' dataizes its
# 't', which holds the next call. The facts lead every copy back to 'Φ.d', yet
# the argument of each copy is held inside the copy above it: the calls shrink
# and end, so under '--acyclic=plausible' none of them repeats another, even
# with '--max-loops=0' (#2466).
symbolic: |
  - λ: L_d
    dataize:
      𝛿1: $.t
    𝑛: ⟦ λ ⤍ 𝜎 ⟧
location: 'Q.e'
acyclic: plausible
loops: 0
partial: true
input: >
  ⟦ d(t) ↦ ⟦ λ ⤍ L_d ⟧,
    e ↦ Φ.d( t ↦ Φ.d( t ↦ Φ.d( t ↦ 01-:Δ ) ) ).q ⟧
protocol: |
  𝕄(Φ.e):
    remembered 𝑛·0·1 ≡ Φ.d  # ⟦ t ↦ ∅, λ ⤍ L_d ⟧
    𝑛·0·2 ≔ Φ.d( t ↦ Φ.d( t ↦ Φ.d( t ↦ 01-:Δ ) ) )
    𝑛·0·3 ≔ ⟦ t ↦ Φ.d( t ↦ Φ.d( t ↦ 01-:Δ ) ), λ ⤍ L_d ⟧
    remembered 𝑛·0·3 ≡ 𝑛·0·1( t ↦ Φ.d( t ↦ Φ.d( t ↦ 01-:Δ ) ) )
    𝔼(L_d):
      𝔻(ξ.t):
        𝕄(ξ.t):
          𝑛·1·1 ≔ Φ.d( t ↦ Φ.d( t ↦ 01-:Δ ) )
          𝑛·1·2 ≔ ⟦ t ↦ Φ.d( t ↦ 01-:Δ ), λ ⤍ L_d ⟧
          remembered 𝑛·1·2 ≡ 𝑛·0·1( t ↦ Φ.d( t ↦ 01-:Δ ) )
          morphed 𝑛·1·3 ≔ 𝑛·1·2
        𝔼(L_d):
          𝔻(ξ.t):
            𝕄(ξ.t):
              𝑛·2·1 ≔ Φ.d( t ↦ 01-:Δ )
              𝑛·2·2 ≔ ⟦ t ↦ 01-:Δ, λ ⤍ L_d ⟧
              remembered 𝑛·2·2 ≡ 𝑛·0·1( t ↦ 01-:Δ )
              morphed 𝑛·2·3 ≔ 𝑛·2·2
            𝔼(L_d):
              𝔻(ξ.t):
                𝛿·3·1 ≔ 01-
              𝛿1·3 ≔ 𝛿·3·1  # 𝔻(ξ.t)
              𝑛·3·1 ≔ 𝜎1:λ  # 𝑛 of L_d
              𝕄(𝑛·3·1):
                morphed 𝑛·3·2 ≔ 𝜎1:λ
              𝑛·3·3 ≔ 𝑛·3·2  # 𝕄(𝑛·3·1)
              memoized 𝑛·2·2 ⇛ 𝜎1:λ
              evaluated 𝑛·3·4 ≔ 𝑛·3·3  # 𝑛·2·2
            𝛿·2·1 ≔ 𝔻(𝜎1:λ)
          𝛿1·2 ≔ 𝛿·2·1  # 𝔻(ξ.t)
          𝑛·2·4 ≔ 𝜎2:λ  # 𝑛 of L_d
          𝕄(𝑛·2·4):
            morphed 𝑛·2·5 ≔ 𝜎2:λ
          𝑛·2·6 ≔ 𝑛·2·5  # 𝕄(𝑛·2·4)
          memoized 𝑛·1·2 ⇛ 𝜎2:λ
          evaluated 𝑛·2·7 ≔ 𝑛·2·6  # 𝑛·1·2
        𝛿·1·1 ≔ 𝔻(𝜎2:λ)
      𝛿1·1 ≔ 𝛿·1·1  # 𝔻(ξ.t)
      𝑛·1·4 ≔ 𝜎3:λ  # 𝑛 of L_d
      𝕄(𝑛·1·4):
        morphed 𝑛·1·5 ≔ 𝜎3:λ
      𝑛·1·6 ≔ 𝑛·1·5  # 𝕄(𝑛·1·4)
      memoized 𝑛·0·3 ⇛ 𝜎3:λ
      evaluated 𝑛·1·7 ≔ 𝑛·1·6  # 𝑛·0·3
    opaque 𝜎3  # 𝕄(𝜎3:λ.q)
