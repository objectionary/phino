---
# yamllint disable rule:line-length
# The 'morph' of '$.a' gets stuck on 'L_none', which no entry answers, and
# the 'defer' line reading what it bound keeps the failure for the meta it
# binds (#1982). Only one path may run, so the fork takes the left side,
# which is that meta, and only then rethrows what the morph threw.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.c
    morph:
      𝑛1: $.a
      𝑛2: $.b
    defer:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    fork:
      on: 𝛿1
      left: 𝑛3
      right: 𝑛4
location: 'Q.y'
input: '⟦ y ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎1 ⟧, a ↦ ⟦ λ ⤍ L_none ⟧.x, b ↦ ⟦ Δ ⤍ 05- ⟧, λ ⤍ L_fork ⟧.φ ⟧'
fails: "No entry of --symbolic answers the λ function 'L_none'"
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝛿1·1 := 𝔻(𝜎1:λ)  # 𝔻(ξ.c)
      𝕄(Φ.a🌵1):
        unanswered L_none  # 𝕄(L_none:λ)
      𝑛2·1 := 05-:Δ  # 𝕄(ξ.b)
      𝑛4·1 := 05-:Δ  # 𝑛2
      forked 𝔻(𝜎1:λ) := left  # 𝑛3
      stuck L_none
