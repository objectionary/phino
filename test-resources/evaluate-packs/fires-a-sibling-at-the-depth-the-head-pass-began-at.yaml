---
# yamllint disable rule:line-length
# The head pass of 𝕄 takes four steps through the four φ layers of 'Φ.e'
# before it reads 'eq' of the inner formation, whose 'φ' reads its sibling
# 'm'. Under '--deep' the head pass fires 'm' first and writes its answer back
# (#1727). Before #1731 it fired 'm' at the depth of its fourth step, so the
# firing ran out of ten steps, and 'L_dataized' fired three times without
# reaching the answer. Now the head pass fires 'm' at the depth it began at,
# the way the deep walk at the end of 𝕄 fires it, and 'm' fires once.
symbolic: |
  - λ: L_dataized
    dataize:
      𝛿1: $.target
    𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.e'
deep: true
partial: true
acyclic: plausible
steps: 10
input: >
  ⟦ bytes(φ) ↦ ⟦ eq(ρ, b) ↦ L_bytes_eq:λ ⟧,
    dataized(target) ↦ L_dataized:λ,
    e ↦ ⟦ φ ↦ ⟦ φ ↦ ⟦ φ ↦ ⟦ φ ↦ m, m ↦ Φ.dataized( target ↦ Φ.bytes( φ ↦ 𝜎1:λ ) ) ⟧ ⟧ ⟧ ⟧.eq ⟧
result: '⟦ b ↦ ∅, λ ⤍ L_bytes_eq ⟧'
protocol: |
  𝕄(Φ.e):
    𝑛.0.1 := Φ.dataized( target ↦ Φ.bytes( φ ↦ 𝜎1:λ ) )
    𝔼(L_dataized):
      𝔻(Φ.a🌵0):
        𝕄(Φ.a🌵0):
          𝑛.1.1 := Φ.bytes( φ ↦ 𝜎1:λ )
      𝛿1.1 := 𝔻(𝜎1:λ)  # 𝔻(ξ.target)
      𝑛.1.2 := Φ.bytes( φ ↦ 𝜎2:λ )  # 𝑛
      𝕄(𝑛.1.2):
        𝑛.1.3 := Φ.bytes( φ ↦ 𝜎2:λ )
      𝑛.1.4 := 𝑛.1.3  # 𝕄(𝑛.1.2)
