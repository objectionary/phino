---
# yamllint disable rule:line-length
# The block names 'L_join' under 'otherwise', but the left side is a datum,
# which no dispatch reaches, so no formation asking both sides for their
# attributes means the same as the two of them. The firing writes 'diverged'
# and gets stuck, as it does with no 'otherwise' at all (#2024).
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.c
    join:
      on: 𝛿1
      left: $.a
      right: $.b
      otherwise: L_join
location: 'Q.y'
input: '⟦ y ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎1 ⟧, a ↦ ⟦ Δ ⤍ 01- ⟧, b ↦ ⟦ φ ↦ Φ.zu ⟧, λ ⤍ L_fork ⟧.φ ⟧'
fails: "No entry of --symbolic answers the λ function 'L_fork'"
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝔻(ξ.c):
        𝛿·1·1 := 𝔻(𝜎1:λ)
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.c)
      diverged 01-:Δ vs Φ.zu:φ  # they differ at .Δ, and the left side has Δ
