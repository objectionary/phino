---
# yamllint disable rule:line-length
# An 'evaluate' line of a joining entry fires a copy of 'L_id', whose operand
# dispatches off a bare symbol and is 'opaque', giving a new symbol (#2479).
# 'L_id' answers it, and the join takes the right side for that symbol.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.on🌵
    morph:
      𝑛1: $.left🌵
      𝑛2: $.right🌵
    evaluate:
      𝑛3: 𝑛1
    join:
      on: 𝛿1
      left: 𝑛3
      right: 𝑛2
  - λ: L_id
    morph:
      𝑛1: $.x
    𝑛: 𝑛1
location: 'Q.e1'
input: '⟦ k ↦ ⟦ q ↦ ⟦⟧ ⟧, e1 ↦ ⟦ λ ⤍ L_fork, on🌵 ↦ ⟦ Δ ⤍ 00- ⟧, left🌵 ↦ ⟦ λ ⤍ L_id, x ↦ ⟦ λ ⤍ 𝜎1 ⟧.q ⟧, right🌵 ↦ ⟦ φ ↦ Φ.k ⟧ ⟧.φ ⟧'
result: '⟦⟧:q'
protocol: |
  𝕄(Φ.e1):
    𝔼(L_fork):
      𝔻(ξ.on🌵):
        𝛿·1·1 ≔ 00-
      𝛿1·1 ≔ 𝛿·1·1  # 𝔻(ξ.on🌵)
      𝕄(ξ.left🌵):
        morphed 𝑛·1·1 ≔ ⟦ λ ⤍ L_id, x ↦ 𝜎1:λ.q ⟧
      𝑛1·1 ≔ ⟦ λ ⤍ L_id, x ↦ 𝜎1:λ.q ⟧  # 𝕄(ξ.left🌵)
      𝕄(ξ.right🌵):
        morphed 𝑛·1·2 ≔ Φ.k:φ
      𝑛2·1 ≔ 𝑛·1·2  # 𝕄(ξ.right🌵)
      𝔼(L_id):  # 𝔼(𝑛1 of L_fork)
        𝕄(ξ.x):
          opaque 𝜎2:λ ≔ 𝜎1:λ.q
          morphed 𝑛·2·1 ≔ 𝜎2:λ
        𝑛1·2 ≔ 𝑛·2·1  # 𝕄(ξ.x)
        𝑛·2·2 ≔ 𝑛1·2  # 𝑛 of L_id
        𝕄(𝑛·2·2):
          morphed 𝑛·2·3 ≔ 𝑛1·2
        𝑛·2·4 ≔ 𝑛1·2  # 𝕄(𝑛·2·2)
        evaluated 𝑛·2·5 ≔ 𝑛·2·4  # ⟦ λ ⤍ L_id, x ↦ 𝜎1:λ.q ⟧
      𝑛3·1 ≔ 𝑛·2·4  # 𝔼(𝑛1 of L_fork)
      assumed 𝜎2:λ ≡ 𝑛2·1
      𝑛·1·3 ≔ 𝑛·1·2
      evaluated 𝑛·1·4 ≔ 𝑛·1·3  # ⟦ λ ⤍ L_fork, on🌵 ↦ 00-:Δ, left🌵 ↦ ⟦ λ ⤍ L_id, x ↦ 𝜎1:λ.q ⟧, right🌵 ↦ 𝑛·1·3 ⟧
    normalized 𝑛·0·1 ≔ Φ.k  # 𝑛·1·4.φ
    normalized 𝑛·0·2 ≔ ⟦⟧:q  # Φ.k
    morphed 𝑛·0·3 ≔ 𝑛·0·2
