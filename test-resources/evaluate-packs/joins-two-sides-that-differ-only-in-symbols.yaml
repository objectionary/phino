    𝑛·0·10 := 𝑛·0·8( else ↦ 3.0.plus( 4.0 ).plus( 𝑛·1·12 ) )
    𝑛·0·11 := ⟦ then ↦ 1.0.plus( 2.0 ).plus( 𝑛·1·12 ), else ↦ 3.0.plus( 4.0 ).plus( 𝑛·1·12 ), λ ⤍ L_fork ⟧
    𝔼(L_fork):
      𝔻(ξ.ρ):
        𝕄(ξ.ρ):
