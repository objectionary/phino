            boxed 𝑛·4·9 := 𝑛·4·8.φ
            normalized 𝑛·4·10 := 40-08-00-00-00-00-00-00:Δ  # 𝑛·4·9
            𝛿·4·1 := 40-08-00-00-00-00-00-00  # 3.0
