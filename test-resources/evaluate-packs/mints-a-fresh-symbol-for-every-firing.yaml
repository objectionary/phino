---
# yamllint disable rule:line-length
# Two firings down a chain of dispatches: each mints a symbol of its own, and
# the operand of the second is the answer of the first, which the protocol
# names rather than brings down again — every symbol answers the same datum.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.plus( 6 ).plus( 7 ) ⟧
result: '⟦ φ ↦ 𝜎2:λ, plus(x) ↦ L_number_plus:λ ⟧'
protocol: |
  𝕄(Φ.φ):
    applied(𝑛.0.1) := 5  # 𝕄(Φ.φ)
    applied(𝑛.0.2) := 𝑛.0.1.plus( x ↦ 6 )  # 𝕄(Φ.φ)
    𝔼(L_number_plus):  # 𝕄(Φ.φ)
      applied(𝑛.1.1) := 5  # 𝕄(Φ.a🌵0)
      𝔻(Φ.a🌵0):
        applied(𝑛.1.2) := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵0)
        𝔻(Φ.a🌵0):
      𝛿1.1 := 40-14-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      applied(𝑛.1.3) := 6  # 𝕄(Φ.a🌵1)
      𝔻(Φ.a🌵1):
        applied(𝑛.1.4) := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵1)
        𝔻(Φ.a🌵1):
      𝛿2.1 := 40-18-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.1.5 := Φ.number( φ ↦ 𝜎1:λ )  # 𝑛
      applied(𝑛.1.6) := Φ.number( φ ↦ 𝜎1:λ )  # 𝕄(Φ.φ)
      𝑛.1.7 := 𝑛.1.6  # 𝕄(𝑛.1.5)
    applied(𝑛.0.3) := 𝑛.1.6.plus( x ↦ 7 )  # 𝕄(Φ.φ)
    applied(𝑛.0.4) := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )  # 𝕄(Φ.φ.x)
    applied(𝑛.0.5) := Φ.number( φ ↦ 𝑛.0.4 )  # 𝕄(Φ.φ.x)
    𝔼(L_number_plus):  # 𝕄(Φ.φ)
      applied(𝑛.2.1) := Φ.number( φ ↦ 𝜎1:λ )  # 𝕄(Φ.a🌵2)
      𝔻(Φ.a🌵2):
      𝛿1.2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      applied(𝑛.2.2) := Φ.number( φ ↦ 𝑛.0.4 )  # 𝕄(Φ.a🌵3)
      𝔻(Φ.a🌵3):
        applied(𝑛.2.3) := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )  # 𝕄(Φ.a🌵3)
        𝔻(Φ.a🌵3):
      𝛿2.2 := 40-1C-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.2.4 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
      applied(𝑛.2.5) := Φ.number( φ ↦ 𝜎2:λ )  # 𝕄(Φ.φ)
      𝑛.2.6 := 𝑛.2.5  # 𝕄(𝑛.2.4)
