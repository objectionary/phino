---
# yamllint disable rule:line-length
# Two firings down a chain of dispatches, the last of which is φ: each mints
# a symbol of its own, and the operand of the second is the answer of the
# first, which the protocol names rather than brings down again — every
# symbol answers the same datum.
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    φ ↦ 5.plus( 6 ).plus( 7 ).φ ⟧
result: '𝜎2:λ'
protocol: |
  𝕄(Φ.φ):
    𝑛·0·1 := 5.0
    𝑛·0·2 := 𝑛·0·1.plus( x ↦ 6.0 )
    𝔼(L_number_plus):
      𝔻(Φ.a🌵0):
        𝕄(Φ.a🌵0):
          𝑛·1·1 := 5.0
        boxed 𝑛·1·1.φ
        𝕄(Φ.a🌵0):
          𝑛·1·2 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
        boxed 𝑛·1·2.φ
        𝛿·1·1 := 40-14-00-00-00-00-00-00  # 5.0
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.ρ)
      𝔻(Φ.a🌵1):
        𝕄(Φ.a🌵1):
          𝑛·1·3 := 6.0
        boxed 𝑛·1·3.φ
        𝕄(Φ.a🌵1):
          𝑛·1·4 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
        boxed 𝑛·1·4.φ
        𝛿·1·2 := 40-18-00-00-00-00-00-00  # 6.0
      𝛿2·1 := 𝛿·1·2  # 𝔻(ξ.x)
      𝑛·1·5 := Φ.number( φ ↦ 𝜎1:λ )  # 𝑛
      𝕄(𝑛·1·5):
        𝑛·1·6 := Φ.number( φ ↦ 𝜎1:λ )
      𝑛·1·7 := 𝑛·1·6  # 𝕄(𝑛·1·5)
    𝑛·0·3 := 𝑛·1·6.plus( x ↦ 7.0 )
    𝔼(L_number_plus):
      𝔻(Φ.a🌵2):
        𝕄(Φ.a🌵2):
          𝑛·2·1 := Φ.number( φ ↦ 𝜎1:λ )
        boxed 𝑛·2·1.φ
      𝛿1·2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      𝔻(Φ.a🌵3):
        𝕄(Φ.a🌵3):
          𝑛·2·2 := 7.0
        boxed 𝑛·2·2.φ
        𝕄(Φ.a🌵3):
          𝑛·2·3 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
        boxed 𝑛·2·3.φ
        𝛿·2·1 := 40-1C-00-00-00-00-00-00  # 7.0
      𝛿2·2 := 𝛿·2·1  # 𝔻(ξ.x)
      𝑛·2·4 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
      𝕄(𝑛·2·4):
        𝑛·2·5 := Φ.number( φ ↦ 𝜎2:λ )
      𝑛·2·6 := 𝑛·2·5  # 𝕄(𝑛·2·4)
