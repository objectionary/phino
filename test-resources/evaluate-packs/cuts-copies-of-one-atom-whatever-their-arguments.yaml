---
# yamllint disable rule:line-length
# A recursion through copies of the atom 'f', each one fired inside the one
# before it, since 'L_g' dataizes its 'x', which comes to the next copy with a
# new argument, 'Φ.a1', 'Φ.a2', 'Φ.a3' and around again. The facts lead every
# copy back to 'Φ.f', so under '--acyclic=plausible' each repeats the copies
# fired above it and '--max-loops=1' lets one repeat through: the third copy is
# cut, however many objects the ring holds (#2466).
symbolic: |
  - λ: L_g
    dataize:
      𝛿1: $.x
    𝑛: ⟦ λ ⤍ 𝜎 ⟧
location: 'Q.app'
acyclic: plausible
loops: 1
partial: true
input: >
  ⟦ f(x) ↦ ⟦ λ ⤍ L_g ⟧,
    a1 ↦ ⟦ φ ↦ Φ.f( x ↦ Φ.a2 ) ⟧,
    a2 ↦ ⟦ φ ↦ Φ.f( x ↦ Φ.a3 ) ⟧,
    a3 ↦ ⟦ φ ↦ Φ.f( x ↦ Φ.a1 ) ⟧,
    app ↦ Φ.f( x ↦ Φ.a1 ).q ⟧
protocol: |
  𝕄(Φ.app):
    remembered 𝑛·0·1 ≡ Φ.f  # ⟦ x ↦ ∅, λ ⤍ L_g ⟧
    𝑛·0·2 ≔ Φ.f( x ↦ Φ.a1 )
    𝑛·0·3 ≔ ⟦ x ↦ Φ.a1, λ ⤍ L_g ⟧
    remembered 𝑛·0·3 ≡ 𝑛·0·1( x ↦ Φ.a1 )
    𝔼(L_g):
      𝔻(ξ.x):
        𝕄(ξ.x):
          remembered 𝑛·1·1 ≡ Φ.a1  # Φ.f( x ↦ Φ.a2 ):φ
          morphed 𝑛·1·2 ≔ 𝑛·1·1
        boxed 𝑛·1·3 ≔ 𝑛·1·2.φ
        normalized 𝑛·1·4 ≔ Φ.f( x ↦ Φ.a2 )  # 𝑛·1·3
        𝕄(𝑛·1·3):
          𝑛·1·5 ≔ Φ.f( x ↦ Φ.a2 )
          𝑛·1·6 ≔ ⟦ x ↦ Φ.a2, λ ⤍ L_g ⟧
          remembered 𝑛·1·6 ≡ 𝑛·0·1( x ↦ Φ.a2 )
          morphed 𝑛·1·7 ≔ 𝑛·1·6
        𝔼(L_g):  # 𝔻(𝑛·1·3)
          𝔻(𝑛·1·3):
            𝕄(𝑛·1·3):
              remembered 𝑛·2·1 ≡ Φ.a2  # Φ.f( x ↦ Φ.a3 ):φ
              morphed 𝑛·2·2 ≔ 𝑛·2·1
            boxed 𝑛·2·3 ≔ 𝑛·2·2.φ
            normalized 𝑛·2·4 ≔ Φ.f( x ↦ Φ.a3 )  # 𝑛·2·3
            𝕄(𝑛·2·3):
              𝑛·2·5 ≔ Φ.f( x ↦ Φ.a3 )
              𝑛·2·6 ≔ ⟦ x ↦ Φ.a3, λ ⤍ L_g ⟧
              remembered 𝑛·2·6 ≡ 𝑛·0·1( x ↦ Φ.a3 )
              morphed 𝑛·2·7 ≔ 𝑛·2·6
            recalled 𝑛·2·6 ⇒ 𝑛·0·1( x ↦ Φ.a3 )
            recalled 𝑛·0·1 ⇒ Φ.f
            𝕄(𝑛·2·6.x):
              remembered 𝑛·2·8 ≡ Φ.a3  # 𝑛·0·2:φ
              morphed 𝑛·2·9 ≔ 𝑛·2·8
            looped 𝜎1 ≔ Φ.f( x ↦ 𝑛·2·9 )  # 𝔻(𝑛·2·3), plausible, repeats 𝑛·0·3
            𝛿·2·1 ≔ 𝔻(𝜎1:λ)
          𝛿1·2 ≔ 𝛿·2·1  # 𝔻(ξ.x)
          𝑛·2·10 ≔ 𝜎2:λ  # 𝑛 of L_g
          𝕄(𝑛·2·10):
            morphed 𝑛·2·11 ≔ 𝜎2:λ
          𝑛·2·12 ≔ 𝑛·2·11  # 𝕄(𝑛·2·10)
          memoized 𝑛·1·6 ⇛ 𝜎2:λ
          evaluated 𝑛·2·13 ≔ 𝑛·2·12  # 𝑛·1·6
        𝛿·1·1 ≔ 𝔻(𝜎2:λ)
      𝛿1·1 ≔ 𝛿·1·1  # 𝔻(ξ.x)
      𝑛·1·8 ≔ 𝜎3:λ  # 𝑛 of L_g
      𝕄(𝑛·1·8):
        morphed 𝑛·1·9 ≔ 𝜎3:λ
      𝑛·1·10 ≔ 𝑛·1·9  # 𝕄(𝑛·1·8)
      memoized 𝑛·0·3 ⇛ 𝜎3:λ
      evaluated 𝑛·1·11 ≔ 𝑛·1·10  # 𝑛·0·3
    opaque 𝜎4:λ ≔ 𝜎3:λ.q
    morphed 𝑛·0·4 ≔ 𝜎4:λ
