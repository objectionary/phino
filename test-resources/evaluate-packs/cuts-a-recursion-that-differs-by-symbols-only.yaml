---
# yamllint disable rule:line-length
# A factorial over a symbolic argument, under '--acyclic=proven'. Every round
# of the recursion mints fresh symbols, so the deep walk fires 'mul' with
# a ↦ 𝜎1 and b ↦ Φ.fact( n ↦ 𝜎3 ) on the first round and with a ↦ 𝜎3 and
# b ↦ Φ.fact( n ↦ 𝜎5 ) on the second, and no two rounds are ever the same term.
# They are the same formation up to a renaming of symbols, which is what the
# guard compares by (#1420), and the walk enters the formation it fires (#1451),
# so the second firing is cut before it opens and writes a 'looped' line where
# its block would have stood, carrying the term of the round that was kept
# (#1434). The budget is generous here, so what ends the run is the cut and not
# the limit.
symbolic: |
  - λ: L_zero
    dataize:
      𝛿1: $.x
    𝑛: ⟦ λ ⤍ 𝜎 ⟧
  - λ: L_dec
    dataize:
      𝛿1: $.x
    𝑛: ⟦ λ ⤍ 𝜎 ⟧
  - λ: L_mul
    dataize:
      𝛿1: $.a
      𝛿2: $.b
    𝑛: ⟦ λ ⤍ 𝜎 ⟧
  - λ: L_if
    dataize:
      𝛿1: $.c
    morph:
      𝑛1: $.left
      𝑛2: $.right
    symbolize:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      𝑛5: [𝑛3, 𝑛4]
    𝑛: 𝑛5
location: 'Q.x'
deep: true
acyclic: proven
partial: true
steps: 250
input: >
  ⟦ if ↦ ⟦ c ↦ ∅, left ↦ ∅, right ↦ ∅, λ ⤍ L_if ⟧,
    zero ↦ ⟦ x ↦ ∅, λ ⤍ L_zero ⟧,
    dec ↦ ⟦ x ↦ ∅, λ ⤍ L_dec ⟧,
    mul ↦ ⟦ a ↦ ∅, b ↦ ∅, λ ⤍ L_mul ⟧,
    fact ↦ ⟦ n ↦ ∅, φ ↦ Φ.if( c ↦ Φ.zero( x ↦ ξ.n ), left ↦ ⟦ Δ ⤍ 01- ⟧, right ↦ Φ.mul( a ↦ ξ.n, b ↦ Φ.fact( n ↦ Φ.dec( x ↦ ξ.n ) ) ) ) ⟧,
    x ↦ Φ.fact( n ↦ ⟦ λ ⤍ 𝜎1 ⟧ ) ⟧
result: >
  ⟦ n ↦ ⟦ λ ⤍ 𝜎1 ⟧,
    φ ↦ Φ.if( c ↦ ⟦ λ ⤍ 𝜎2 ⟧, left ↦ ⟦ Δ ⤍ 01- ⟧, right ↦ Φ.mul( a ↦ ξ.n, b ↦ Φ.fact( n ↦ ⟦ λ ⤍ 𝜎3 ⟧ ) ) ) ⟧
protocol: |
  𝕄(Φ.x)
    𝔼(L_zero)  # 𝕄(Φ.x.φ)
      𝛿1.1 := 𝔻(𝜎1:λ)  # 𝔻(ξ.x)
      𝑛.1.1 := 𝜎2:λ  # 𝑛
      𝑛.1.2 := 𝜎2:λ  # 𝕄(𝑛.1.1)
    𝔼(L_dec)  # 𝕄(Φ.x.φ)
      𝛿1.2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.x)
      𝑛.2.1 := 𝜎3:λ  # 𝑛
      𝑛.2.2 := 𝜎3:λ  # 𝕄(𝑛.2.1)
    𝔼(L_mul)  # 𝕄(Φ.x.φ)
      𝛿1.3 := 𝔻(𝜎1:λ)  # 𝔻(ξ.a)
      formation(⟦ n ↦ 𝜎3:λ, φ ↦ Φ.if( c ↦ Φ.zero( x ↦ n ), left ↦ 01-:Δ, right ↦ Φ.mul( a ↦ n, b ↦ Φ.fact( n ↦ Φ.dec( x ↦ n ) ) ) ) ⟧)  # 𝔻(Φ.a🌵3)
        𝔼(L_if)  # 𝔻(Φ.a🌵3)
          𝔼(L_zero)  # 𝔻(Φ.a🌵4)
            𝛿1.5 := 𝔻(𝜎3:λ)  # 𝔻(ξ.x)
            𝑛.5.1 := 𝜎4:λ  # 𝑛
            𝑛.5.2 := 𝜎4:λ  # 𝕄(𝑛.5.1)
          𝛿1.4 := 𝔻(𝜎4:λ)  # 𝔻(ξ.c)
          𝑛1.4 := 01-:Δ  # 𝕄(ξ.left)
          𝔼(L_dec)  # 𝕄(Φ.a🌵7.b)
            𝛿1.6 := 𝔻(𝜎3:λ)  # 𝔻(ξ.x)
            𝑛.6.1 := 𝜎5:λ  # 𝑛
            𝑛.6.2 := 𝜎5:λ  # 𝕄(𝑛.6.1)
          looped(⟦ a ↦ 𝜎1:λ, b ↦ Φ.fact( n ↦ 𝜎3:λ ), λ ⤍ L_mul ⟧)  # 𝕄(Φ.a🌵7), proven
          𝑛2.4 := ⟦ a ↦ 𝜎3:λ, b ↦ Φ.fact( n ↦ 𝜎5:λ ), λ ⤍ L_mul ⟧  # 𝕄(ξ.right)
          𝔻(𝜎6:λ) == 01-
          𝑛3.4 := 𝜎6:λ  # 𝑛1
          𝑛4.4 := ⟦ a ↦ 𝜎3:λ, b ↦ Φ.fact( n ↦ 𝜎5:λ ), λ ⤍ L_mul ⟧  # 𝑛2
    𝔼(L_if)  # 𝕄(Φ.x.φ)
      𝛿1.7 := 𝔻(𝜎2:λ)  # 𝔻(ξ.c)
      𝑛1.7 := 01-:Δ  # 𝕄(ξ.left)
      𝔼(L_mul)  # 𝕄(Φ.a🌵11)
        𝛿1.8 := 𝔻(𝜎1:λ)  # 𝔻(ξ.a)
        formation(⟦ n ↦ 𝜎3:λ, φ ↦ Φ.if( c ↦ Φ.zero( x ↦ n ), left ↦ 01-:Δ, right ↦ Φ.mul( a ↦ n, b ↦ Φ.fact( n ↦ Φ.dec( x ↦ n ) ) ) ) ⟧)  # 𝔻(Φ.a🌵13)
          𝔼(L_if)  # 𝔻(Φ.a🌵13)
            𝔼(L_zero)  # 𝔻(Φ.a🌵14)
              𝛿1.10 := 𝔻(𝜎3:λ)  # 𝔻(ξ.x)
              𝑛.10.1 := 𝑛.5.2  # 𝑛
              𝑛.10.2 := 𝑛.5.2  # 𝕄(𝑛.10.1)
            𝛿1.9 := 𝔻(𝜎4:λ)  # 𝔻(ξ.c)
            𝑛1.9 := 01-:Δ  # 𝕄(ξ.left)
            𝔼(L_dec)  # 𝕄(Φ.a🌵17.b)
              𝛿1.11 := 𝔻(𝜎3:λ)  # 𝔻(ξ.x)
              𝑛.11.1 := 𝑛.6.2  # 𝑛
              𝑛.11.2 := 𝑛.6.2  # 𝕄(𝑛.11.1)
            looped(⟦ a ↦ 𝜎1:λ, b ↦ Φ.fact( n ↦ 𝜎3:λ ), λ ⤍ L_mul ⟧)  # 𝕄(Φ.a🌵17), proven
            𝑛2.9 := ⟦ a ↦ 𝜎3:λ, b ↦ Φ.fact( n ↦ 𝜎5:λ ), λ ⤍ L_mul ⟧  # 𝕄(ξ.right)
            𝔻(𝜎6:λ) == 01-
            𝑛3.9 := 𝑛3.4  # 𝑛1
            𝑛4.9 := ⟦ a ↦ 𝜎3:λ, b ↦ Φ.fact( n ↦ 𝜎5:λ ), λ ⤍ L_mul ⟧  # 𝑛2
      𝑛2.7 := ⟦ a ↦ 𝜎1:λ, b ↦ Φ.fact( n ↦ 𝜎3:λ ), λ ⤍ L_mul ⟧  # 𝕄(ξ.right)
      𝔻(𝜎4:λ) == 01-
      𝑛3.7 := 𝑛.10.2  # 𝑛1
      𝑛4.7 := ⟦ a ↦ 𝜎1:λ, b ↦ Φ.fact( n ↦ 𝜎3:λ ), λ ⤍ L_mul ⟧  # 𝑛2
