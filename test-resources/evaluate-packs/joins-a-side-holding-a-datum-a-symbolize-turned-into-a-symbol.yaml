---
# yamllint disable rule:line-length
# The left side is a number written as a literal, so 𝕄 brings it to a number
# whose bytes hold a datum. The right side is a number some firing computed,
# so its bytes hold a symbol. Both are numbers of one shape and differ in the
# value alone, yet no join makes one term of a datum and a symbol (#1968). A
# 'symbolize' line turns every datum of a term into a fresh symbol, so '𝑛3'
# holds 𝜎4 where '𝑛1' held the datum, and the protocol writes that 𝜎4 stands
# for that datum. The line of '𝑛4', whose term holds no datum, writes nothing,
# and the join names it by the term it holds (#2192). The join takes the
# metas the 'symbolize' lines bound and joins 𝜎4 with 𝜎2 into one fresh symbol
# 𝜎5.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.c
    morph:
      𝑛1: $.a
      𝑛2: $.b
    symbolize:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      on: 𝛿1
      left: 𝑛3
      right: 𝑛4
location: 'Q.y'
input: '⟦ number ↦ ⟦ φ ↦ ∅ ⟧, bytes ↦ ⟦ φ ↦ ∅ ⟧, y ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎3 ⟧, a ↦ ⟦ φ ↦ Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ Δ ⤍ 3F-F0-00-00-00-00-00-00 ⟧ ) ) ⟧, b ↦ ⟦ φ ↦ Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎2 ⟧ ) ) ⟧, λ ⤍ L_fork ⟧.φ ⟧'
result: 'Φ.bytes( φ ↦ 𝜎5:λ ):φ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝔻(ξ.c):
        𝛿·1·1 := 𝔻(𝜎3:λ)
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.c)
      𝕄(ξ.a):
        morphed 𝑛·1·1 := 1.0:φ
      𝑛1·1 := 𝑛·1·1  # 𝕄(ξ.a)
      𝕄(ξ.b):
        morphed 𝑛·1·2 := Φ.number( φ ↦ Φ.bytes( φ ↦ 𝜎2:λ ) ):φ
      𝑛2·1 := 𝑛·1·2  # 𝕄(ξ.b)
      symbolized 𝜎4 := 3F-F0-00-00-00-00-00-00  # 1.0
      𝑛3·1 := Φ.number( φ ↦ Φ.bytes( φ ↦ 𝜎4:λ ) ):φ  # symbolize(𝑛1)
      joined 𝜎5 := 𝛿1·1 ? 𝜎4 : 𝜎2
      𝑛·1·3 := Φ.number( φ ↦ Φ.bytes( φ ↦ 𝜎5:λ ) ):φ  # 𝑛3, 𝑛2·1
    𝑛·0·1 := Φ.number( φ ↦ Φ.bytes( φ ↦ 𝜎5:λ ) )
    𝑛·0·2 := Φ.bytes( φ ↦ 𝜎5:λ ):φ
    morphed 𝑛·0·3 := 𝑛·0·2
