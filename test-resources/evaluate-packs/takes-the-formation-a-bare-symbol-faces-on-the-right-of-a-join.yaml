---
# yamllint disable rule:line-length
# The right side is a bare symbol, which stands for a value nobody worked out,
# and the left side is a formation, which no formation could join with the
# symbol, since it would ask the symbol for 'k' it does not bind. The join
# takes the symbol for the formation and answers the formation as it is,
# writing an 'assumed' line, so the run goes on rather than getting stuck
# (#2469).
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.c
    morph:
      𝑛1: $.a
      𝑛2: $.b
    join:
      on: 𝛿1
      left: 𝑛1
      right: 𝑛2
      otherwise: L_fork
location: 'Q.app'
input: '⟦ x ↦ ⟦ λ ⤍ 𝜎1 ⟧, y ↦ ⟦ λ ⤍ 𝜎2 ⟧, app ↦ ⟦ c ↦ Φ.x, a ↦ ⟦ k ↦ ⟦ Δ ⤍ 2A- ⟧ ⟧, b ↦ Φ.y, λ ⤍ L_fork ⟧.k ⟧'
result: '⟦ Δ ⤍ 2A- ⟧'
protocol: |
  𝕄(Φ.app):
    𝔼(L_fork):
      𝔻(ξ.c):
        𝕄(ξ.c):
          normalized 𝑛·1·1 := 𝜎1:λ  # Φ.x
          morphed 𝑛·1·2 := 𝑛·1·1
        𝛿·1·1 := 𝔻(𝜎1:λ)
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.c)
      𝕄(ξ.a):
        morphed 𝑛·1·3 := 2A-:Δ:k
      𝑛1·1 := 𝑛·1·3  # 𝕄(ξ.a)
      𝕄(ξ.b):
        normalized 𝑛·1·4 := 𝜎2:λ  # Φ.y
        morphed 𝑛·1·5 := 𝑛·1·4
      𝑛2·1 := 𝑛·1·4  # 𝕄(ξ.b)
      assumed 𝛿1·1 ? 𝑛1·1 : 𝜎2:λ  # where 𝜎2:λ stands for 𝑛1·1
      𝑛·1·6 := 𝑛·1·3
      evaluated 𝑛·1·7 := 𝑛·1·6  # ⟦ c ↦ Φ.x, a ↦ 𝑛·1·6, b ↦ Φ.y, λ ⤍ L_fork ⟧
    normalized 𝑛·0·1 := 2A-:Δ  # 𝑛·1·7.k
    morphed 𝑛·0·2 := 2A-:Δ
