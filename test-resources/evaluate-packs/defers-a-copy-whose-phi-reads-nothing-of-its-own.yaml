---
# yamllint disable rule:line-length
# The copy 'step( tup ↦ Φ.items.tail )' of a 'step' whose φ reads nothing of
# its own object, so an 'unfold' line would bind it as it is and never enter
# it. A 'defer' line asks no such thing of a copy (#1933): 'tup' reads to the
# bare symbol '𝜎1', so the line answers the copy with a fresh symbol, writes a
# 'deferred' line naming the call the copy stands for, and the 'join' line
# pairs that symbol with the one the other branch holds.
symbolic: |
  - λ: L_fork
    morph:
      𝑛1: $.a
      𝑛2: $.b
    defer:
      𝑛3: 𝑛2
    join:
      𝑛4: [𝑛1, 𝑛3]
    𝑛: ⟦ φ ↦ 𝑛4 ⟧
location: 'Q.y'
input: '⟦ done ↦ ⟦⟧, step(tup) ↦ ⟦ φ ↦ Φ.done ⟧, items ↦ ⟦ tail ↦ ⟦ λ ⤍ 𝜎1 ⟧ ⟧, y ↦ ⟦ a ↦ ⟦ λ ⤍ 𝜎2 ⟧, b ↦ Φ.step( tup ↦ Φ.items.tail ), λ ⤍ L_fork ⟧.φ ⟧'
result: '𝜎4:λ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝑛1·1 := 𝜎2:λ  # 𝕄(ξ.a)
      𝕄(Φ.a🌵1):
        𝑛·1·1 := Φ.step( tup ↦ Φ.items.tail )
      𝑛2·1 := 𝑛·1·1  # 𝕄(ξ.b)
      deferred(𝜎3) := Φ.step( tup ↦ 𝜎1:λ )  # 𝕄(𝑛2.φ)
      𝔻(𝜎4:λ) ∈ { 𝔻(𝜎2:λ), 𝔻(𝜎3:λ) }
      𝑛4·1 := 𝜎4:λ  # [𝑛1, 𝑛3]
      𝑛·1·2 := 𝜎4:λ:φ  # 𝑛
      𝑛·1·3 := 𝜎4:λ:φ  # 𝕄(𝑛·1·2)
