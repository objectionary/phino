---
# yamllint disable rule:line-length
# An operand is brought down by a whole run of 𝔻, so a λ function it fires on
# the way sits one level deeper than the firing waiting for it, and the metas
# of the two are told apart by which firing of the entry each belongs to. The
# judgment each firing is commented with says the same thing from the other
# side: the outer one was fired while 𝕄 reduced the program and the inner one
# by the 𝔻 bringing the operand down, under the binding it was bound to (#1306).
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    φ ↦ 5.plus( 6.plus( 7 ) ).plus( 8 ) ⟧
protocol: |
  𝕄(Φ.φ):
    normalized 𝑛·0·1 := ⟦ φ ↦ ∅, plus(x) ↦ L_number_plus:λ ⟧
    𝑛·0·2 := 5.0
    𝑛·0·3 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
    normalized 𝑛·0·4 := 𝑛·0·3
    normalized 𝑛·0·5 := ⟦ x ↦ ∅, λ ⤍ L_number_plus ⟧
    𝑛·0·6 := 𝑛·0·2.plus( x ↦ 6.0.plus( 7.0 ) )
    𝑛·0·7 := ⟦ x ↦ 6.0.plus( 7.0 ), λ ⤍ L_number_plus ⟧
    normalized 𝑛·0·8 := 𝑛·0·7
    𝔼(L_number_plus):
      𝔻(ξ.ρ):
        𝕄(ξ.ρ):
          normalized 𝑛·1·1 := 𝑛·0·1
          𝑛·1·2 := 5.0
          𝑛·1·3 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
          normalized 𝑛·1·4 := 𝑛·1·3
          normalized 𝑛·1·5 := 𝑛·1·4
          morphed 𝑛·1·6 := 𝑛·1·5
        boxed 𝑛·1·7 := 𝑛·1·6.φ
        normalized 𝑛·1·8 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
        𝕄(𝑛·1·7):
          normalized 𝑛·1·9 := ∅:φ
          𝑛·1·10 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
          𝑛·1·11 := 40-14-00-00-00-00-00-00:Δ:φ
          normalized 𝑛·1·12 := 𝑛·1·11
          normalized 𝑛·1·13 := 𝑛·1·12
          morphed 𝑛·1·14 := 𝑛·1·13
        boxed 𝑛·1·15 := 𝑛·1·14.φ
        normalized 𝑛·1·16 := 40-14-00-00-00-00-00-00:Δ
        𝛿·1·1 := 40-14-00-00-00-00-00-00  # 5.0
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.ρ)
      𝔻(ξ.x):
        𝕄(ξ.x):
          normalized 𝑛·1·17 := 𝑛·1·1
          𝑛·1·18 := 6.0
          𝑛·1·19 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
          normalized 𝑛·1·20 := 𝑛·1·19
          normalized 𝑛·1·21 := ⟦ x ↦ ∅, λ ⤍ L_number_plus ⟧
          𝑛·1·22 := 𝑛·1·18.plus( x ↦ 7.0 )
          𝑛·1·23 := ⟦ x ↦ 7.0, λ ⤍ L_number_plus ⟧
          normalized 𝑛·1·24 := 𝑛·1·23
          normalized 𝑛·1·25 := 𝑛·1·23
          morphed 𝑛·1·26 := 𝑛·1·23
        𝔼(L_number_plus):
          𝔻(ξ.ρ):
            𝕄(ξ.ρ):
              normalized 𝑛·2·1 := 𝑛·1·17
              𝑛·2·2 := 6.0
              𝑛·2·3 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
              normalized 𝑛·2·4 := 𝑛·2·3
              normalized 𝑛·2·5 := 𝑛·2·4
              morphed 𝑛·2·6 := 𝑛·2·5
            boxed 𝑛·2·7 := 𝑛·2·6.φ
            normalized 𝑛·2·8 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
            𝕄(𝑛·2·7):
              normalized 𝑛·2·9 := 𝑛·1·9
              𝑛·2·10 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
              𝑛·2·11 := 40-18-00-00-00-00-00-00:Δ:φ
              normalized 𝑛·2·12 := 𝑛·2·11
              normalized 𝑛·2·13 := 𝑛·2·12
              morphed 𝑛·2·14 := 𝑛·2·13
            boxed 𝑛·2·15 := 𝑛·2·14.φ
            normalized 𝑛·2·16 := 40-18-00-00-00-00-00-00:Δ
            𝛿·2·1 := 40-18-00-00-00-00-00-00  # 6.0
          𝛿1·2 := 𝛿·2·1  # 𝔻(ξ.ρ)
          𝔻(ξ.x):
            𝕄(ξ.x):
              normalized 𝑛·2·17 := 𝑛·2·1
              𝑛·2·18 := 7.0
              𝑛·2·19 := ⟦ φ ↦ Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ ), plus(x) ↦ L_number_plus:λ ⟧
              normalized 𝑛·2·20 := 𝑛·2·19
              normalized 𝑛·2·21 := 𝑛·2·20
              morphed 𝑛·2·22 := 𝑛·2·21
            boxed 𝑛·2·23 := 𝑛·2·22.φ
            normalized 𝑛·2·24 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
            𝕄(𝑛·2·23):
              normalized 𝑛·2·25 := 𝑛·2·9
              𝑛·2·26 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
              𝑛·2·27 := 40-1C-00-00-00-00-00-00:Δ:φ
              normalized 𝑛·2·28 := 𝑛·2·27
              normalized 𝑛·2·29 := 𝑛·2·28
              morphed 𝑛·2·30 := 𝑛·2·29
            boxed 𝑛·2·31 := 𝑛·2·30.φ
            normalized 𝑛·2·32 := 40-1C-00-00-00-00-00-00:Δ
            𝛿·2·2 := 40-1C-00-00-00-00-00-00  # 7.0
          𝛿2·2 := 𝛿·2·2  # 𝔻(ξ.x)
          𝑛·2·33 := Φ.number( φ ↦ 𝜎1:λ )  # 𝑛
          𝕄(𝑛·2·33):
            normalized 𝑛·2·34 := 𝑛·2·17
            𝑛·2·35 := Φ.number( φ ↦ 𝜎1:λ )
            𝑛·2·36 := ⟦ φ ↦ 𝜎1:λ, plus(x) ↦ L_number_plus:λ ⟧
            normalized 𝑛·2·37 := 𝑛·2·36
            morphed 𝑛·2·38 := 𝑛·2·37
          𝑛·2·39 := 𝑛·2·38  # 𝕄(𝑛·2·33)
        boxed 𝑛·1·27 := 𝑛·2·39.φ
        normalized 𝑛·1·28 := 𝜎1:λ
        𝛿·1·2 := 𝔻(𝜎1:λ)
      𝛿2·1 := 𝛿·1·2  # 𝔻(ξ.x)
      𝑛·1·29 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
      𝕄(𝑛·1·29):
        normalized 𝑛·1·30 := 𝑛·2·34
        𝑛·1·31 := Φ.number( φ ↦ 𝜎2:λ )
        𝑛·1·32 := ⟦ φ ↦ 𝜎2:λ, plus(x) ↦ L_number_plus:λ ⟧
        normalized 𝑛·1·33 := 𝑛·1·32
        morphed 𝑛·1·34 := 𝑛·1·33
      𝑛·1·35 := 𝑛·1·34  # 𝕄(𝑛·1·29)
    normalized 𝑛·0·9 := ⟦ x ↦ ∅, λ ⤍ L_number_plus ⟧
    𝑛·0·10 := 𝑛·1·31.plus( x ↦ 8.0 )
    𝑛·0·11 := ⟦ x ↦ 8.0, λ ⤍ L_number_plus ⟧
    normalized 𝑛·0·12 := 𝑛·0·11
    morphed 𝑛·0·13 := 𝑛·0·11
