---
# yamllint disable rule:line-length
# An operand is brought down by a whole run of 𝔻, so a λ function it fires on
# the way sits one level deeper than the firing waiting for it, and the metas
# of the two are told apart by which firing of the entry each belongs to. The
# judgment each firing is commented with says the same thing from the other
# side: the outer one was fired while 𝕄 reduced the program and the inner one
# by the 𝔻 bringing the operand down, under the binding it was bound to (#1306).
symbolic: |
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.@'
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    number(φ) ↦ ⟦ plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    φ ↦ 5.plus( 6.plus( 7 ) ).plus( 8 ) ⟧
protocol: |
  𝕄(Φ.φ):
    𝑛·0·1 := 5.0
    𝑛·0·2 := 𝑛·0·1.plus( x ↦ 6.0.plus( 7.0 ) )
    𝔼(L_number_plus):
      𝔻(ξ.ρ):
        𝕄(ξ.ρ):
          𝑛·1·1 := 5.0
        boxed 𝑛·1·2 := 𝑛·1·1.φ
        𝕄(𝑛·1·2):
          𝑛·1·3 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
        boxed 𝑛·1·4 := 𝑛·1·3.φ
        𝛿·1·1 := 40-14-00-00-00-00-00-00  # 5.0
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.ρ)
      𝔻(ξ.x):
        𝕄(ξ.x):
          𝑛·1·5 := 6.0
          𝑛·1·6 := 𝑛·1·5.plus( x ↦ 7.0 )
        𝔼(L_number_plus):
          𝔻(ξ.ρ):
            𝕄(ξ.ρ):
              𝑛·2·1 := 6.0
            boxed 𝑛·2·2 := 𝑛·2·1.φ
            𝕄(𝑛·2·2):
              𝑛·2·3 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
            boxed 𝑛·2·4 := 𝑛·2·3.φ
            𝛿·2·1 := 40-18-00-00-00-00-00-00  # 6.0
          𝛿1·2 := 𝛿·2·1  # 𝔻(ξ.ρ)
          𝔻(ξ.x):
            𝕄(ξ.x):
              𝑛·2·5 := 7.0
            boxed 𝑛·2·6 := 𝑛·2·5.φ
            𝕄(𝑛·2·6):
              𝑛·2·7 := Φ.bytes( φ ↦ 40-1C-00-00-00-00-00-00:Δ )
            boxed 𝑛·2·8 := 𝑛·2·7.φ
            𝛿·2·2 := 40-1C-00-00-00-00-00-00  # 7.0
          𝛿2·2 := 𝛿·2·2  # 𝔻(ξ.x)
          𝑛·2·9 := Φ.number( φ ↦ 𝜎1:λ )  # 𝑛
          𝕄(𝑛·2·9):
            𝑛·2·10 := Φ.number( φ ↦ 𝜎1:λ )
          𝑛·2·11 := 𝑛·2·10  # 𝕄(𝑛·2·9)
        boxed 𝑛·1·7 := 𝑛·2·10.φ
      𝛿2·1 := 𝔻(𝜎1:λ)  # 𝔻(ξ.x)
      𝑛·1·8 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
      𝕄(𝑛·1·8):
        𝑛·1·9 := Φ.number( φ ↦ 𝜎2:λ )
      𝑛·1·10 := 𝑛·1·9  # 𝕄(𝑛·1·8)
    𝑛·0·3 := 𝑛·1·9.plus( x ↦ 8.0 )
