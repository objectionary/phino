---
# yamllint disable rule:line-length
# A fork one branch of which raises with a message, as EO writes
# '(if. cond 1 (T "oops")).plus 6', is joined the way a fork with a bare ⊥ is: the join
# says on which side of the condition the program raises and answers the other
# side, and the line of the branch keeps the message (#1765).
symbolic: |
  - λ: L_number_gt
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.ρ
    morph:
      𝑛1: $.then
      𝑛2: $.else
    symbolize:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      𝑛5: [𝑛3, 𝑛4]
    𝑛: 𝑛5
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    string(φ) ↦ ⟦ length ↦ ⟦⟧ ⟧,
    bool(φ) ↦ ⟦ if ↦ ⟦ ρ ↦ ∅, then ↦ ∅, else ↦ ∅, λ ⤍ L_fork ⟧ ⟧,
    number(φ) ↦ ⟦
      gt(ρ, x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.gt( 0 ).if( then ↦ 1, else ↦ ⊥( "oops" ) ).plus( 6 ) ⟧
result: |-
  ⟦ φ ↦ 𝜎4:λ, gt(x) ↦ L_number_gt:λ, plus(x) ↦ L_number_plus:λ ⟧
protocol: |
  𝕄(Φ.φ):
    𝑛·0·1 := 5
    𝑛·0·2 := 𝑛·0·1.gt( x ↦ 0 )
    𝔼(L_number_gt):
      𝔻(Φ.a🌵0):
        𝕄(Φ.a🌵0):
          𝑛·1·1 := 5
          𝑛·1·2 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
        𝛿·1·1 := 40-14-00-00-00-00-00-00  # 5.0
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.ρ)
      𝔻(Φ.a🌵1):
        𝕄(Φ.a🌵1):
          𝑛·1·3 := 0
          𝑛·1·4 := Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ )
        𝛿·1·2 := 00-00-00-00-00-00-00-00  # 0.0
      𝛿2·1 := 𝛿·1·2  # 𝔻(ξ.x)
      𝑛·1·5 := Φ.bool( φ ↦ 𝜎1:λ )  # 𝑛
      𝕄(𝑛·1·5):
        𝑛·1·6 := Φ.bool( φ ↦ 𝜎1:λ )
      𝑛·1·7 := 𝑛·1·6  # 𝕄(𝑛·1·5)
    𝑛·0·3 := 𝑛·1·6.if( then ↦ 1 )
    𝑛·0·4 := 𝑛·0·3( else ↦ ⊥( "oops" ) )
    𝔼(L_fork):
      𝔻(Φ.a🌵2):
        𝕄(Φ.a🌵2):
          𝑛·2·1 := Φ.bool( φ ↦ 𝜎1:λ )
      𝛿1·2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      𝕄(Φ.a🌵3):
        𝑛·2·2 := 1
        𝕄(Φ.a🌵3.φ):
          𝑛·2·3 := Φ.bytes( φ ↦ 3F-F0-00-00-00-00-00-00:Δ )
      𝑛1·2 := 𝑛·2·2  # 𝕄(ξ.then)
      𝕄(Φ.a🌵4):
        𝑛·2·4 := Φ.bytes( φ ↦ 6F-6F-70-73:Δ )
        𝑛·2·5 := Φ.string( φ ↦ 𝑛·2·4 )
      𝑛2·2 := ⊥( 𝑛·2·5 )  # 𝕄(ξ.else)
      𝔻(𝜎2:λ) == 3F-F0-00-00-00-00-00-00
      𝑛3·2 := ⟦ φ ↦ Φ.bytes( φ ↦ 𝜎2:λ ), gt(x) ↦ L_number_gt:λ, plus(x) ↦ L_number_plus:λ ⟧  # 𝑛1
      𝔻(𝜎3:λ) == 6F-6F-70-73
      𝑛4·2 := ⊥( Φ.string( φ ↦ Φ.bytes( φ ↦ 𝜎3:λ ) ) )  # 𝑛2
      terminate(𝔻(𝜎1:λ), right)  # 𝑛4
      𝑛5·2 := 𝑛3·2  # [𝑛3, 𝑛4]
      𝑛·2·6 := 𝑛5·2  # 𝑛
      𝑛·2·7 := 𝑛5·2  # 𝕄(𝑛·2·6)
    𝑛·0·5 := Φ.number( φ ↦ Φ.bytes( φ ↦ 𝜎2:λ ) ).plus( x ↦ 6 )
    𝕄(Φ.φ.x):
      𝑛·0·6 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
      𝑛·0·7 := Φ.number( φ ↦ 𝑛·0·6 )
    𝔼(L_number_plus):
      𝔻(Φ.a🌵5):
        𝕄(Φ.a🌵5):
          𝑛·3·1 := Φ.number( φ ↦ Φ.bytes( φ ↦ 𝜎2:λ ) )
          𝑛·3·2 := Φ.bytes( φ ↦ 𝜎2:λ )
      𝛿1·3 := 𝔻(𝜎2:λ)  # 𝔻(ξ.ρ)
      𝔻(Φ.a🌵6):
        𝕄(Φ.a🌵6):
          𝑛·3·3 := Φ.number( φ ↦ 𝑛·0·6 )
          𝑛·3·4 := Φ.bytes( φ ↦ 40-18-00-00-00-00-00-00:Δ )
        𝛿·3·1 := 40-18-00-00-00-00-00-00  # 6.0
      𝛿2·3 := 𝛿·3·1  # 𝔻(ξ.x)
      𝑛·3·5 := Φ.number( φ ↦ 𝜎4:λ )  # 𝑛
      𝕄(𝑛·3·5):
        𝑛·3·6 := Φ.number( φ ↦ 𝜎4:λ )
      𝑛·3·7 := 𝑛·3·6  # 𝕄(𝑛·3·5)
