---
# yamllint disable rule:line-length
# Both sides dispatch off a bare symbol, so both are 'opaque' and each gives a
# new symbol of its own (#2479). The two sides differ only in their symbols, so
# they join into a fresh one.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.on🌵
    morph:
      𝑛1: $.left🌵
      𝑛2: $.right🌵
    join:
      on: 𝛿1
      left: 𝑛1
      right: 𝑛2
      otherwise: L_fork
location: 'Q.e1'
input: '⟦ e1 ↦ ⟦ λ ⤍ L_fork, on🌵 ↦ ⟦ Δ ⤍ 00- ⟧, left🌵 ↦ ⟦ λ ⤍ 𝜎1 ⟧.p, right🌵 ↦ ⟦ λ ⤍ 𝜎1 ⟧.q ⟧.φ ⟧'
result: '𝜎5:λ'
protocol: |
  𝕄(Φ.e1):
    𝔼(L_fork):
      𝔻(ξ.on🌵):
        𝛿·1·1 ≔ 00-
      𝛿1·1 ≔ 𝛿·1·1  # 𝔻(ξ.on🌵)
      𝕄(ξ.left🌵):
        opaque 𝜎2:λ ≔ 𝜎1:λ.p
        morphed 𝑛·1·1 ≔ 𝜎2:λ
      𝑛1·1 ≔ 𝑛·1·1  # 𝕄(ξ.left🌵)
      𝕄(ξ.right🌵):
        opaque 𝜎3:λ ≔ 𝜎1:λ.q
        morphed 𝑛·1·2 ≔ 𝜎3:λ
      𝑛2·1 ≔ 𝑛·1·2  # 𝕄(ξ.right🌵)
      joined 𝜎4 ≔ 𝛿1·1 ? 𝜎2 : 𝜎3
      𝑛·1·3 ≔ 𝜎4:λ
      evaluated 𝑛·1·4 ≔ 𝑛·1·3  # ⟦ λ ⤍ L_fork, on🌵 ↦ 00-:Δ, left🌵 ↦ 𝜎1:λ.p, right🌵 ↦ 𝜎1:λ.q ⟧
    opaque 𝜎5:λ ≔ 𝜎4:λ.φ
    morphed 𝑛·0·1 ≔ 𝜎5:λ
