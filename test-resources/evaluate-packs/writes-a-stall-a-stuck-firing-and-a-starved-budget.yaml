    starved(4)  # 𝕄(⟦ x ↦ ⟦ λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ L_none:λ ⟧ ⟧ ⟧ ⟧ ⟧ ⟧ ⟧, y ↦ ⟦ λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ L_none:λ ⟧ ⟧ ⟧ ⟧ ⟧ ⟧ ⟧ ⟧)
