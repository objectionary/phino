    𝔼(L_outer)  # 𝕄(Φ.y)
      𝔼(L_outer)  # 𝔻(Φ.a🌵9)
        𝔼(L_outer)  # 𝔻(Φ.a🌵10)
          starved(4)  # 𝔻(⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ ⟦ v ↦ 1, λ ⤍ L_outer, arg ↦ L_none:λ ⟧ ⟧ ⟧ ⟧)
