---
# yamllint disable rule:line-length
# A branch is where a 'morph' operand earns its place: the condition comes
# down through 𝔻 and answers a symbol nobody has decided, both branches reach
# a normal form through 𝕄, and the answer is one of them. Every line of the
# firing points back at the line that minted the symbol it carries, which is
# how the dependencies between firings are read.
symbolic: |
  - λ: L_number_gt
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.ρ
    morph:
      𝑛1: $.then
      𝑛2: $.else
    𝑛: 𝑛1
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    bool(φ) ↦ ⟦ if ↦ ⟦ then ↦ ∅, else ↦ ∅, λ ⤍ L_fork ⟧ ⟧,
    number(φ) ↦ ⟦
      gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.gt( 0 ).if( 1.plus( 2 ), 3.plus( 4 ) ) ⟧
protocol: |
  𝕄(Φ.φ)
    𝔼(L_number_gt)
      𝛿1.1 := 40-14-00-00-00-00-00-00  # ξ.ρ
      𝛿2.1 := 00-00-00-00-00-00-00-00  # ξ.x
      𝑛.1 := ⟦ φ ↦ ⟦ λ ⤍ 𝜎1 ⟧, if(then, else) ↦ ⟦ λ ⤍ L_fork ⟧, ρ ↦ ⟦ bytes(φ) ↦ ⟦⟧, bool(φ) ↦ ⟦ if(then, else) ↦ ⟦ λ ⤍ L_fork ⟧ ⟧, number(φ) ↦ ⟦ gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧, φ ↦ 5.gt( 0 ).if( 1.plus( 2 ), 3.plus( 4 ) ) ⟧ ⟧
    𝔼(L_number_plus)
      𝛿1.2 := 3F-F0-00-00-00-00-00-00  # ξ.ρ
      𝛿2.2 := 40-00-00-00-00-00-00-00  # ξ.x
      𝑛.2 := ⟦ φ ↦ ⟦ λ ⤍ 𝜎2 ⟧, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧, ρ ↦ ⟦ bytes(φ) ↦ ⟦⟧, bool(φ) ↦ ⟦ if(then, else) ↦ ⟦ λ ⤍ L_fork ⟧ ⟧, number(φ) ↦ ⟦ gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧, φ ↦ 5.gt( 0 ).if( 1.plus( 2 ), 3.plus( 4 ) ) ⟧ ⟧
    𝔼(L_number_plus)
      𝛿1.3 := 40-08-00-00-00-00-00-00  # ξ.ρ
      𝛿2.3 := 40-10-00-00-00-00-00-00  # ξ.x
      𝑛.3 := ⟦ φ ↦ ⟦ λ ⤍ 𝜎3 ⟧, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧, ρ ↦ ⟦ bytes(φ) ↦ ⟦⟧, bool(φ) ↦ ⟦ if(then, else) ↦ ⟦ λ ⤍ L_fork ⟧ ⟧, number(φ) ↦ ⟦ gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧, φ ↦ 5.gt( 0 ).if( 1.plus( 2 ), 3.plus( 4 ) ) ⟧ ⟧
    𝔼(L_fork)
      𝛿1.4 := 𝔻(⟦ λ ⤍ 𝜎1 ⟧)  # ξ.ρ
      𝑛1.4 := 𝑛.2  # ξ.then
      𝑛2.4 := 𝑛.3  # ξ.else
      𝑛.4 := 𝑛1.4
