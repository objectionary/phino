---
# yamllint disable rule:line-length
# A branch is where a 'morph' operand earns its place: the condition comes
# down through 𝔻 and answers a symbol nobody has decided, both branches reach
# a normal form through 𝕄, and the answer is one of them. Every line of the
# firing points back at the line that minted the symbol it carries, which is
# how the dependencies between firings are read.
symbolic: |
  - λ: L_number_gt
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.ρ
    morph:
      𝑛1: $.then
      𝑛2: $.else
    𝑛: 𝑛1
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    bool(φ) ↦ ⟦ if ↦ ⟦ ρ ↦ ∅, then ↦ ∅, else ↦ ∅, λ ⤍ L_fork ⟧ ⟧,
    number(φ) ↦ ⟦
      gt(ρ, x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.gt( 0 ).if( 1.plus( 2 ), 3.plus( 4 ) ) ⟧
protocol: |
  𝕄(Φ.φ)
    𝔼(L_number_gt)  # 𝕄(Φ.φ)
      formation(⟦ φ ↦ Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ ), gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵0)
        formation(40-14-00-00-00-00-00-00:Δ:φ)  # 𝔻(Φ.a🌵0)
      𝛿1.1 := 40-14-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      formation(⟦ φ ↦ Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ ), gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵1)
        formation(00-00-00-00-00-00-00-00:Δ:φ)  # 𝔻(Φ.a🌵1)
      𝛿2.1 := 00-00-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.1.1 := Φ.bool( φ ↦ 𝜎1:λ )  # 𝑛
      𝑛.1.2 := ⟦ φ ↦ 𝜎1:λ, if(then, else) ↦ ⟦ λ ⤍ L_fork ⟧ ⟧  # 𝕄(𝑛.1.1)
    𝔼(L_number_plus)  # 𝕄(Φ.φ.then)
      formation(⟦ φ ↦ Φ.bytes( φ ↦ 3F-F0-00-00-00-00-00-00:Δ ), gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵2)
        formation(3F-F0-00-00-00-00-00-00:Δ:φ)  # 𝔻(Φ.a🌵2)
      𝛿1.2 := 3F-F0-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      formation(⟦ φ ↦ Φ.bytes( φ ↦ 40-00-00-00-00-00-00-00:Δ ), gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵3)
        formation(40-00-00-00-00-00-00-00:Δ:φ)  # 𝔻(Φ.a🌵3)
      𝛿2.2 := 40-00-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.2.1 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
      𝑛.2.2 := ⟦ φ ↦ 𝜎2:λ, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧  # 𝕄(𝑛.2.1)
    𝔼(L_number_plus)  # 𝕄(Φ.φ.else)
      formation(⟦ φ ↦ Φ.bytes( φ ↦ 40-08-00-00-00-00-00-00:Δ ), gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵4)
        formation(40-08-00-00-00-00-00-00:Δ:φ)  # 𝔻(Φ.a🌵4)
      𝛿1.3 := 40-08-00-00-00-00-00-00  # 𝔻(ξ.ρ)
      formation(⟦ φ ↦ Φ.bytes( φ ↦ 40-10-00-00-00-00-00-00:Δ ), gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧)  # 𝔻(Φ.a🌵5)
        formation(40-10-00-00-00-00-00-00:Δ:φ)  # 𝔻(Φ.a🌵5)
      𝛿2.3 := 40-10-00-00-00-00-00-00  # 𝔻(ξ.x)
      𝑛.3.1 := Φ.number( φ ↦ 𝜎3:λ )  # 𝑛
      𝑛.3.2 := ⟦ φ ↦ 𝜎3:λ, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧  # 𝕄(𝑛.3.1)
    𝔼(L_fork)  # 𝕄(Φ.φ)
      formation(⟦ φ ↦ 𝜎1:λ, if(then, else) ↦ ⟦ λ ⤍ L_fork ⟧ ⟧)  # 𝔻(Φ.a🌵6)
      𝛿1.4 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      𝑛1.4 := 𝑛.2.2  # 𝕄(ξ.then)
      𝑛2.4 := 𝑛.3.2  # 𝕄(ξ.else)
      𝑛.4.1 := 𝑛1.4  # 𝑛
      𝑛.4.2 := 𝑛1.4  # 𝕄(𝑛.4.1)
