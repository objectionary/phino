---
# A branch is where a 'morph' operand earns its place: the condition comes
# down through 𝔻 and answers a symbol nobody has decided, both branches reach
# a normal form through 𝕄, and the answer is one of them. Every line of the
# firing points back at the line that minted the symbol it carries, which is
# how the dependencies between firings are read.
symbolic: |
  - λ: L_number_gt
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.ρ
    morph:
      𝑛1: $.then
      𝑛2: $.else
    𝑛: 𝑛1
location: 'Q.@'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    bool(φ) ↦ ⟦ if ↦ ⟦ then ↦ ∅, else ↦ ∅, λ ⤍ L_fork ⟧ ⟧,
    number(φ) ↦ ⟦
      gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    @ ↦ 5.gt( 0 ).if( 1.plus( 2 ), 3.plus( 4 ) ) ⟧
protocol: |
  𝕄(Φ.φ)
    𝔼(L_number_gt)
      𝛿1.1 := 40-14-00-00-00-00-00-00
      𝛿2.1 := 00-00-00-00-00-00-00-00
      𝑛.1 := Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎1 ⟧ )
    𝔼(L_number_plus)
      𝛿1.1 := 3F-F0-00-00-00-00-00-00
      𝛿2.1 := 40-00-00-00-00-00-00-00
      𝑛.2 := Φ.number( φ ↦ ⟦ λ ⤍ 𝜎2 ⟧ )
    𝔼(L_number_plus)
      𝛿1.2 := 40-08-00-00-00-00-00-00
      𝛿2.2 := 40-10-00-00-00-00-00-00
      𝑛.3 := Φ.number( φ ↦ ⟦ λ ⤍ 𝜎3 ⟧ )
    𝔼(L_fork)
      𝛿1.1 := 𝔻(𝜎1)
      𝑛1.1 := 𝑛.2
      𝑛2.1 := 𝑛.3
      𝑛.4 := 𝑛1.1
