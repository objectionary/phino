---
# yamllint disable rule:line-length
# An 'evaluate' line of a joining entry fires a formation whose λ is a symbol
# and that binds an attribute too, so it is no bare symbol the line could
# leave as it is. Nothing answers a symbol, so the firing is 'opaque' and
# stuck, and the line binds its meta to ⊥ (#2427), so the join keeps the
# right side under the condition instead of getting stuck.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.on🌵
    morph:
      𝑛1: $.left🌵
      𝑛2: $.right🌵
    evaluate:
      𝑛3: 𝑛1
    join:
      on: 𝛿1
      left: 𝑛3
      right: 𝑛2
      otherwise: L_fork
location: 'Q.e1'
input: '⟦ k ↦ ⟦ q ↦ ⟦⟧ ⟧, e1 ↦ ⟦ λ ⤍ L_fork, on🌵 ↦ ⟦ Δ ⤍ 00- ⟧, left🌵 ↦ ⟦ λ ⤍ 𝜎1, a ↦ ⟦⟧ ⟧, right🌵 ↦ Φ.k ⟧.φ ⟧'
result: '⊥'
protocol: |
  𝕄(Φ.e1):
    𝔼(L_fork):
      𝔻(ξ.on🌵):
        𝛿·1·1 ≔ 00-
      𝛿1·1 ≔ 𝛿·1·1  # 𝔻(ξ.on🌵)
      𝕄(ξ.left🌵):
        morphed 𝑛·1·1 ≔ ⟦ λ ⤍ 𝜎1, a ↦ ⟦⟧ ⟧
      𝑛1·1 ≔ 𝑛·1·1  # 𝕄(ξ.left🌵)
      𝕄(ξ.right🌵):
        normalized 𝑛·1·2 ≔ ⟦⟧:q  # Φ.k
        morphed 𝑛·1·3 ≔ 𝑛·1·2
      𝑛2·1 ≔ 𝑛·1·3  # 𝕄(ξ.right🌵)
      opaque 𝜎1  # 𝔼(⟦ λ ⤍ 𝜎1, a ↦ ⟦⟧ ⟧)
      𝑛3·1 ≔ ⊥  # 𝔼(𝑛1 of L_fork)
      guarded 𝛿1·1 ? 𝑛3·1 : 𝑛2·1  # where 𝑛3·1 is ⊥
      𝑛·1·4 ≔ 𝑛·1·3
      evaluated 𝑛·1·5 ≔ 𝑛·1·4  # ⟦ λ ⤍ L_fork, on🌵 ↦ 00-:Δ, left🌵 ↦ ⟦ λ ⤍ 𝜎1, a ↦ ⟦⟧ ⟧, right🌵 ↦ Φ.k ⟧
    normalized 𝑛·0·1 ≔ ⊥  # 𝑛·1·5.φ
    morphed 𝑛·0·2 ≔ ⊥
