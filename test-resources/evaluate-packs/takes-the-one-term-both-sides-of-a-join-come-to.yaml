---
# yamllint disable rule:line-length
# A join whose two sides come to the same normal form through 𝕄 has
# nothing to join (#1954): it mints no symbol and answers that one term,
# commented with both sides it came from.
symbolic: |
  - λ: L_number_gt
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.bool( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_number_plus
    dataize:
      𝛿1: $.ρ
      𝛿2: $.x
    𝑛: Φ.number( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
  - λ: L_fork
    dataize:
      𝛿1: $.ρ
    join:
      on: 𝛿1
      left: $.then
      right: $.else
location: 'Q.@'
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    bool(φ) ↦ ⟦ if ↦ ⟦ ρ ↦ ∅, then ↦ ∅, else ↦ ∅, λ ⤍ L_fork ⟧ ⟧,
    number(φ) ↦ ⟦
      gt(ρ, x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
    φ ↦ 5.gt( 0 ).if( 1.plus( 2 ), 1.plus( 2 ) ).φ ⟧
result: '𝜎2:λ'
protocol: |
  𝕄(Φ.φ):
    𝑛·0·1 := 5.0
    𝑛·0·2 := 𝑛·0·1.gt( x ↦ 0.0 )
    𝔼(L_number_gt):
      𝔻(ξ.ρ):
        𝕄(ξ.ρ):
          𝑛·1·1 := 5.0
        boxed 𝑛·1·2 := 𝑛·1·1.φ
        𝕄(𝑛·1·2):
          𝑛·1·3 := Φ.bytes( φ ↦ 40-14-00-00-00-00-00-00:Δ )
        boxed 𝑛·1·4 := 𝑛·1·3.φ
        𝛿·1·1 := 40-14-00-00-00-00-00-00  # 5.0
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.ρ)
      𝔻(ξ.x):
        𝕄(ξ.x):
          𝑛·1·5 := 0.0
        boxed 𝑛·1·6 := 𝑛·1·5.φ
        𝕄(𝑛·1·6):
          𝑛·1·7 := Φ.bytes( φ ↦ 00-00-00-00-00-00-00-00:Δ )
        boxed 𝑛·1·8 := 𝑛·1·7.φ
        𝛿·1·2 := 00-00-00-00-00-00-00-00  # 0.0
      𝛿2·1 := 𝛿·1·2  # 𝔻(ξ.x)
      𝑛·1·9 := Φ.bool( φ ↦ 𝜎1:λ )  # 𝑛
      𝕄(𝑛·1·9):
        𝑛·1·10 := Φ.bool( φ ↦ 𝜎1:λ )
      𝑛·1·11 := 𝑛·1·10  # 𝕄(𝑛·1·9)
    𝑛·0·3 := 𝑛·1·10.if( then ↦ 1.0.plus( 2.0 ) )
    𝑛·0·4 := 𝑛·0·3( else ↦ 1.0.plus( 2.0 ) )
    𝔼(L_fork):
      𝔻(ξ.ρ):
        𝕄(ξ.ρ):
          𝑛·2·1 := Φ.bool( φ ↦ 𝜎1:λ )
        boxed 𝑛·2·2 := 𝑛·2·1.φ
      𝛿1·2 := 𝔻(𝜎1:λ)  # 𝔻(ξ.ρ)
      𝕄(ξ.then):
        𝑛·2·3 := 1.0
        𝑛·2·4 := 𝑛·2·3.plus( x ↦ 2.0 )
      𝕄(ξ.else):
        𝑛·2·5 := 1.0
        𝑛·2·6 := 𝑛·2·5.plus( x ↦ 2.0 )
      𝑛·2·7 := 𝑛·2·6  # 𝕄(ξ.then), 𝕄(ξ.else)
    𝔼(L_number_plus):
      𝔻(ξ.ρ):
        𝕄(ξ.ρ):
          𝑛·3·1 := 1.0
        boxed 𝑛·3·2 := 𝑛·3·1.φ
        𝕄(𝑛·3·2):
          𝑛·3·3 := Φ.bytes( φ ↦ 3F-F0-00-00-00-00-00-00:Δ )
        boxed 𝑛·3·4 := 𝑛·3·3.φ
        𝛿·3·1 := 3F-F0-00-00-00-00-00-00  # 1.0
      𝛿1·3 := 𝛿·3·1  # 𝔻(ξ.ρ)
      𝔻(ξ.x):
        𝕄(ξ.x):
          𝑛·3·5 := 2.0
        boxed 𝑛·3·6 := 𝑛·3·5.φ
        𝕄(𝑛·3·6):
          𝑛·3·7 := Φ.bytes( φ ↦ 40-00-00-00-00-00-00-00:Δ )
        boxed 𝑛·3·8 := 𝑛·3·7.φ
        𝛿·3·2 := 40-00-00-00-00-00-00-00  # 2.0
      𝛿2·3 := 𝛿·3·2  # 𝔻(ξ.x)
      𝑛·3·9 := Φ.number( φ ↦ 𝜎2:λ )  # 𝑛
      𝕄(𝑛·3·9):
        𝑛·3·10 := Φ.number( φ ↦ 𝜎2:λ )
      𝑛·3·11 := 𝑛·3·10  # 𝕄(𝑛·3·9)
