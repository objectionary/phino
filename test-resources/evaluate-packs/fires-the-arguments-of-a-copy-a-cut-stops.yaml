---
# yamllint disable rule:line-length
# The cut of #1895 over a recursion whose argument changes every round: the
# copy 'rec( n ↦ Φ.inc( … ) )' is cut by '--acyclic=plausible', and its
# argument is a call of 'L_inc' nothing has fired yet. Before it writes the
# 'looped' line, the 'unfold' line morphs that argument at '𝑛2.n' and fires
# what it comes to, so the protocol shows the object 'Φ.num' the argument
# stands for, and the markup names it in the call of the cut (#1916, #1933).
symbolic: |
  - λ: L_fork
    morph:
      𝑛1: $.a
      𝑛2: $.b
    unfold:
      𝑛3: 𝑛2
    join:
      𝑛4: [𝑛1, 𝑛3]
    𝑛: ⟦ φ ↦ 𝑛4 ⟧
  - λ: L_inc
    dataize:
      𝛿1: $.x
    𝑛: Φ.num( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
location: 'Q.y'
acyclic: plausible
input: '⟦ fork(a, b) ↦ ⟦ λ ⤍ L_fork ⟧, num(φ) ↦ ⟦⟧, inc(x) ↦ ⟦ λ ⤍ L_inc ⟧, rec(n) ↦ ⟦ φ ↦ Φ.fork( ⟦ λ ⤍ 𝜎1 ⟧, Φ.rec( Φ.inc( ξ.n ) ) ) ⟧, y ↦ Φ.rec( ⟦ φ ↦ ⟦ λ ⤍ 𝜎2 ⟧ ⟧ ).φ.φ ⟧'
result: '𝜎5:λ'
protocol: |
  𝕄(Φ.y):
    𝑛·0·1 := Φ.rec( n ↦ 𝜎2:λ:φ )
    𝑛·0·2 := Φ.fork( a ↦ 𝜎1:λ )
    𝑛·0·3 := 𝑛·0·2( b ↦ Φ.rec( Φ.inc( 𝜎2:λ:φ ) ) )
    𝔼(L_fork):
      𝑛1·1 := 𝜎1:λ  # 𝕄(ξ.a)
      𝕄(Φ.a🌵1):
        𝑛·1·1 := Φ.rec( n ↦ Φ.inc( 𝜎2:λ:φ ) )
      𝑛2·1 := 𝑛·1·1  # 𝕄(ξ.b)
      𝕄(Φ.a🌵2):
        𝑛·1·2 := Φ.fork( a ↦ 𝜎1:λ )
        𝑛·1·3 := 𝑛·1·2( b ↦ Φ.rec( Φ.inc( Φ.inc( 𝜎2:λ:φ ) ) ) )
      𝑛3·1 := 𝑛·1·3  # 𝕄(𝑛2.φ)
      𝕄(𝑛2.n):
        𝑛·1·4 := Φ.inc( x ↦ 𝜎2:λ:φ )
      𝔼(L_inc):  # 𝔼(𝑛2.n)
        𝛿1·2 := 𝔻(𝜎2:λ)  # 𝔻(ξ.x)
        𝑛·2·1 := Φ.num( φ ↦ 𝜎3:λ )  # 𝑛
        𝕄(𝑛·2·1):
          𝑛·2·2 := Φ.num( φ ↦ 𝜎3:λ )
        𝑛·2·3 := 𝑛·2·2  # 𝕄(𝑛·2·1)
      looped(𝑛·0·3) := 𝜎4  # 𝔼(𝑛2), plausible
      𝑛3·1 := 𝜎4:λ  # 𝔼(𝑛2)
      𝔻(𝜎5:λ) ∈ { 𝔻(𝜎1:λ), 𝔻(𝜎4:λ) }
      𝑛4·1 := 𝜎5:λ  # [𝑛1, 𝑛3]
      𝑛·1·5 := 𝜎5:λ:φ  # 𝑛
      𝑛·1·6 := 𝜎5:λ:φ  # 𝕄(𝑛·1·5)
