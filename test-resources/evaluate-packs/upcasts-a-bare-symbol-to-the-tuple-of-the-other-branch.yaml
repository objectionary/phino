---
# yamllint disable rule:line-length
# The fork of 'bytes.array' from #1914: one branch is a bare symbol, the other
# a copy of 'Φ.tuple' holding three symbols, so a lenient join cannot tell
# which of them the bare one pairs with. An entry that upcasts casts '𝜎1'
# into a copy of the tuple whose every symbol is read off '𝜎1' by a path,
# then joins the two tuples symbol by symbol. The program reads 'length' off
# the answer and gets the symbol standing for either length.
symbolic: |
  - λ: L_fork
    morph:
      𝑛1: $.a
      𝑛2: $.b
    join:
      𝑛3: [𝑛1, 𝑛2]
    lenient: [upcast]
    𝑛: 𝑛3
location: 'Q.y'
input: |
  ⟦
    tuple(tail, head, length) ↦ ⟦ empty ↦ ⟦⟧ ⟧,
    y ↦ ⟦
      a ↦ ⟦ λ ⤍ 𝜎1 ⟧,
      b ↦ Φ.tuple( tail ↦ ⟦ λ ⤍ 𝜎2 ⟧, head ↦ ⟦ λ ⤍ 𝜎3 ⟧, length ↦ ⟦ λ ⤍ 𝜎4 ⟧ ),
      λ ⤍ L_fork
    ⟧.length
  ⟧
result: '𝜎10:λ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝑛1·1 := 𝜎1:λ  # 𝕄(ξ.a)
      𝕄(Φ.a🌵1):
        𝑛·1·1 := Φ.tuple( tail ↦ 𝜎2:λ )
        𝑛·1·2 := 𝑛·1·1( head ↦ 𝜎3:λ )
        𝑛·1·3 := 𝑛·1·2( length ↦ 𝜎4:λ )
      𝑛2·1 := 𝑛·1·3  # 𝕄(ξ.b)
      upcast(𝜎1) := ⟦ tail ↦ 𝜎5:λ, head ↦ 𝜎6:λ, length ↦ 𝜎7:λ, empty ↦ ⟦⟧ ⟧
        𝜎5 := 𝜎1.tail
        𝜎6 := 𝜎1.head
        𝜎7 := 𝜎1.length
      𝔻(𝜎8:λ) ∈ { 𝔻(𝜎5:λ), 𝔻(𝜎2:λ) }
      𝔻(𝜎9:λ) ∈ { 𝔻(𝜎6:λ), 𝔻(𝜎3:λ) }
      𝔻(𝜎10:λ) ∈ { 𝔻(𝜎7:λ), 𝔻(𝜎4:λ) }
      𝑛3·1 := ⟦ tail ↦ 𝜎8:λ, head ↦ 𝜎9:λ, length ↦ 𝜎10:λ, empty ↦ ⟦⟧ ⟧  # [𝑛1, 𝑛2]
      𝑛·1·4 := ⟦ tail ↦ 𝜎8:λ, head ↦ 𝜎9:λ, length ↦ 𝜎10:λ, empty ↦ ⟦⟧ ⟧  # 𝑛
      𝑛·1·5 := ⟦ tail ↦ 𝜎8:λ, head ↦ 𝜎9:λ, length ↦ 𝜎10:λ, empty ↦ ⟦⟧ ⟧  # 𝕄(𝑛·1·4)
