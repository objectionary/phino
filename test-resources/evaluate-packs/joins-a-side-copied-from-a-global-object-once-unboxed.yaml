---
# yamllint disable rule:line-length
# The right side reads the global object 'f', and 𝕄 makes a copy of it whose ρ
# is filled with Φ, the way the 'false' of 'bool.not' of EO comes when EO
# lowers 'Φ.number.floor', while the left side is the object alone. The copy
# binds a ρ beside φ, which the 'unbox' line once kept, so the join could never
# make one term of the two (#2007). The line takes the object out of a
# formation binding φ and a ρ as well, so the two objects differ in their
# symbols alone, and the join makes one term of them.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.c
    morph:
      𝑛1: $.a
      𝑛2: $.b
    unbox:
      𝑛3: 𝑛1
      𝑛4: 𝑛2
    join:
      on: 𝛿1
      left: 𝑛3
      right: 𝑛4
location: 'Q.y'
hide-rho: false
input: '⟦ f ↦ ⟦ ρ ↦ ∅, φ ↦ ⟦ φ ↦ ⟦ λ ⤍ 𝜎3 ⟧, not ↦ ⟦⟧ ⟧ ⟧, y ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎1 ⟧, a ↦ ⟦ φ ↦ ⟦ λ ⤍ 𝜎2 ⟧, not ↦ ⟦⟧ ⟧, b ↦ Φ.f, λ ⤍ L_fork ⟧.φ ⟧'
result: '𝜎4:λ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝛿1·1 := 𝔻(𝜎1:λ)  # 𝔻(ξ.c)
      𝑛1·1 := ⟦ φ ↦ 𝜎2:λ, not ↦ ⟦⟧ ⟧  # 𝕄(ξ.a)
      𝑛2·1 := ⟦ ρ ↦ Φ, φ ↦ ⟦ φ ↦ 𝜎3:λ, not ↦ ⟦⟧ ⟧ ⟧  # 𝕄(ξ.b)
      𝑛3·1 := 𝑛1·1  # 𝑛1
      unboxed 𝑛4·1 := ⟦ φ ↦ 𝜎3:λ, not ↦ ⟦⟧ ⟧  # 𝑛2
      joined 𝜎4 := 𝔻(𝜎1:λ) ? 𝜎2 : 𝜎3
      𝑛·1·1 := ⟦ φ ↦ 𝜎4:λ, not ↦ ⟦⟧ ⟧  # 𝑛3, 𝑛4
