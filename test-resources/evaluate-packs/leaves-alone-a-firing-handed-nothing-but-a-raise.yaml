---
# yamllint disable rule:line-length
# The deep walk leaves alone a formation the program hands nothing but ⊥, and
# a ⊥ with a message is no different: 'q' is handed a raise alone, so it stays
# as written and 'L_q' never fires (#1405, #1765).
symbolic: |
  - λ: L_q
    morph:
      𝑛1: $.x
    𝑛: 𝑛1
  - λ: L_w
    morph:
      𝑛1: $.v
    𝑛: ⟦ k ↦ 𝑛1 ⟧
location: 'Q.e'
deep: true
input: >
  ⟦ bytes(φ) ↦ ⟦⟧,
    string(φ) ↦ ⟦ length ↦ ⟦⟧ ⟧,
    q ↦ ⟦ x ↦ ∅, λ ⤍ L_q ⟧,
    w ↦ ⟦ v ↦ ∅, λ ⤍ L_w ⟧,
    e ↦ Φ.w( v ↦ ⟦ g ↦ Φ.q( x ↦ ⊥( "oops" ) ) ⟧ ) ⟧
result: |-
  ⟦ k ↦ ⟦ g ↦ Φ.q( x ↦ ⊥( "oops" ) ) ⟧ ⟧
protocol: |
  𝕄(Φ.e):
    𝑛·0·1 := Φ.w( v ↦ Φ.q( x ↦ ⊥( "oops" ) ):g )
    𝕄(Φ.e.v):
      𝕄(Φ.e.v.g):
        𝑛·0·2 := Φ.bytes( φ ↦ 6F-6F-70-73:Δ )
        𝑛·0·3 := Φ.string( φ ↦ 𝑛·0·2 )
        𝑛·0·4 := Φ.q( x ↦ ⊥( 𝑛·0·3 ) )
    𝔼(L_w):
      𝕄(Φ.a🌵0):
        𝕄(Φ.a🌵0.g):
          𝑛·1·1 := Φ.bytes( φ ↦ 6F-6F-70-73:Δ )
          𝑛·1·2 := Φ.string( φ ↦ 𝑛·1·1 )
          𝑛·1·3 := Φ.q( x ↦ ⊥( 𝑛·1·2 ) )
      𝑛1·1 := 𝑛·1·3:g  # 𝕄(ξ.v)
      𝑛·1·4 := 𝑛·1·3:g:k  # 𝑛
      𝑛·1·5 := 𝑛·1·3:g:k  # 𝕄(𝑛·1·4)
