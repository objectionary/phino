---
# yamllint disable rule:line-length
# The two sides of 'L_fork' differ in shape, so the firing fabricates a
# formation whose every attribute is a copy of 'L_join' (#2024). The program
# asks that formation for 'φ' and asks the copy it finds there for 'φ' too,
# which fires 'L_join': its entry reads the condition off 'on🌵', the symbol
# 'L_fork' came down to (#2026), dataizing nothing, and morphs the 'φ' of both
# sides, two copies of 'hx' that differ in a symbol alone, so its join mints a
# fresh symbol for them.
symbolic: |
  - λ: L_fork
    dataize:
      𝛿1: $.c
    join:
      on: 𝛿1
      left: $.a
      right: $.b
      otherwise: L_join
  - λ: L_join
    join:
      on: $.on🌵
      left: $.left🌵
      right: $.right🌵
      otherwise: L_join
location: 'Q.y'
input: '⟦ hx(ke) ↦ ⟦ φ ↦ ke ⟧, y ↦ ⟦ c ↦ ⟦ λ ⤍ 𝜎1 ⟧, a ↦ ⟦ φ ↦ Φ.hx( ⟦ λ ⤍ 𝜎2 ⟧ ), ob ↦ Φ.hx ⟧, b ↦ ⟦ φ ↦ Φ.hx( ⟦ λ ⤍ 𝜎3 ⟧ ) ⟧, λ ⤍ L_fork ⟧.φ.φ ⟧'
result: '𝜎4:λ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_fork):
      𝔻(ξ.c):
        𝛿·1·1 := 𝔻(𝜎1:λ)
      𝛿1·1 := 𝛿·1·1  # 𝔻(ξ.c)
      𝕄(ξ.a):
        morphed 𝑛·1·1 := ⟦ φ ↦ Φ.hx( 𝜎2:λ ), ob ↦ Φ.hx ⟧
      𝕄(ξ.b):
        morphed 𝑛·1·2 := Φ.hx( 𝜎3:λ ):φ
      fabricated 𝑛·1·3 := 𝑛·1·1 and 𝑛·1·2  # ⟦ left🌵 ↦ 𝑛·1·1, right🌵 ↦ 𝑛·1·2, φ ↦ ⟦ λ ⤍ L_join, on🌵 ↦ 𝜎1:λ, left🌵 ↦ ρ.left🌵.φ, right🌵 ↦ ρ.right🌵.φ ⟧, ob ↦ ⟦ λ ⤍ L_join, on🌵 ↦ 𝜎1:λ, left🌵 ↦ ρ.left🌵.ob, right🌵 ↦ ρ.right🌵.ob ⟧ ⟧
    normalized 𝑛·0·1 := ⟦ λ ⤍ L_join, on🌵 ↦ 𝜎1:λ, left🌵 ↦ ρ.left🌵.φ, right🌵 ↦ ρ.right🌵.φ ⟧
    𝔼(L_join):
      𝕄(ξ.left🌵):
        remembered 𝑛·2·1 ≡ Φ.hx  # ⟦ ke ↦ ∅, φ ↦ ke ⟧
        normalized 𝑛·2·2 := 𝑛·2·1
        𝑛·2·3 := Φ.hx( ke ↦ 𝜎2:λ )
        𝑛·2·4 := ⟦ ke ↦ 𝜎2:λ, φ ↦ ke ⟧
        remembered 𝑛·2·4 ≡ 𝑛·2·2( ke ↦ 𝜎2:λ )
        normalized 𝑛·2·5 := 𝑛·2·4
        normalized 𝑛·2·6 := 𝑛·2·5
        normalized 𝑛·2·7 := 𝑛·2·6
        morphed 𝑛·2·8 := 𝑛·2·7
      𝕄(ξ.right🌵):
        normalized 𝑛·2·9 := 𝑛·2·2
        𝑛·2·10 := Φ.hx( ke ↦ 𝜎3:λ )
        𝑛·2·11 := ⟦ ke ↦ 𝜎3:λ, φ ↦ ke ⟧
        remembered 𝑛·2·11 ≡ 𝑛·2·9( ke ↦ 𝜎3:λ )
        normalized 𝑛·2·12 := 𝑛·2·11
        normalized 𝑛·2·13 := 𝑛·2·12
        normalized 𝑛·2·14 := 𝑛·2·13
        morphed 𝑛·2·15 := 𝑛·2·14
      joined 𝜎4 := ξ.on🌵 ? 𝜎2 : 𝜎3
      𝑛·2·16 := ⟦ ke ↦ 𝜎4:λ, φ ↦ ke ⟧
    normalized 𝑛·0·2 := 𝜎4:λ
    morphed 𝑛·0·3 := 𝑛·0·2
