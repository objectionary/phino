---
# An entry answering a λ function no other entry answers: the firing happens,
# and the run then parks on the answer instead of failing on it. What fired
# before the run got stuck stays in the protocol.
symbolic: |
  - λ: L_answers
    𝑛: ⟦ λ ⤍ L_none ⟧
location: 'Q.x'
partial: true
input: '⟦ x ↦ ⟦ λ ⤍ L_answers ⟧.foo ⟧'
result: '⟦ λ ⤍ L_none, ρ ↦ ∅ ⟧.foo'
protocol: |
  𝕄(Φ.x)
    𝔼(L_answers)  # 𝕄(Φ.x)
      𝑛.1.1 := ⟦ λ ⤍ L_none ⟧  # 𝑛
      𝑛.1.2 := ⟦ λ ⤍ L_none ⟧  # 𝕄(𝑛.1.1)
    ?(L_none)  # 𝕄(⟦ λ ⤍ L_none ⟧)
