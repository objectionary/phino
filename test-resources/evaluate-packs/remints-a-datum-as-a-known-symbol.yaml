---
# yamllint disable rule:line-length
# A 'remint' step given a term whose φ chain ends in data answers a fresh
# symbol and writes it as a known one, the way 'symbolize' does, so the head
# of the pair below becomes '𝜎1' standing for '01-' and the tail '𝜎2' standing
# for '02-' (#1923).
symbolic: |
  - λ: L_shrink
    morph:
      𝑛1: $.x
    rewrite:
      𝑛2:
        of: 𝑛1
        rules:
          - name: small-pair
            pattern: ⟦ !B1, head ↦ 𝑒1, tail ↦ 𝑒2, !B2 ⟧
            result: ⟦ !B1, head ↦ 𝑒3, tail ↦ 𝑒4, !B2 ⟧
            where:
              - meta: 𝑒3
                function: remint
                args: [𝑒1]
              - meta: 𝑒4
                function: remint
                args: [𝑒2]
    𝑛: 𝑛2
location: 'Q.y'
input: '⟦ y ↦ ⟦ x ↦ ⟦ head ↦ ⟦ Δ ⤍ 01- ⟧, tail ↦ ⟦ φ ↦ ⟦ Δ ⤍ 02- ⟧ ⟧ ⟧, λ ⤍ L_shrink ⟧.tail ⟧'
result: '𝜎2:λ'
protocol: |
  𝕄(Φ.y):
    𝔼(L_shrink):
      𝑛1·1 := ⟦ head ↦ 01-:Δ, tail ↦ 02-:Δ:φ ⟧  # 𝕄(ξ.x)
      𝔻(𝜎1:λ) == 01-
      𝔻(𝜎2:λ) == 02-
      𝑛2·1 := ⟦ head ↦ 𝜎1:λ, tail ↦ 𝜎2:λ ⟧  # 𝑛1
      𝑛·1·1 := ⟦ head ↦ 𝜎1:λ, tail ↦ 𝜎2:λ ⟧  # 𝑛
      𝑛·1·2 := ⟦ head ↦ 𝜎1:λ, tail ↦ 𝜎2:λ ⟧  # 𝕄(𝑛·1·1)
