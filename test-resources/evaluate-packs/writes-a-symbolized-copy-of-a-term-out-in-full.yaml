---
# A name of the protocol stands for the very term it was given to and for no
# other. A 'symbolize' line stands the data of a term into unknowns without
# touching what the term carries first, so the copy it binds and the term it
# was made of open with the same 𝜎 and differ further down — here 𝑛1 carries
# '02-' under φ where 𝑛2 carries the symbol that datum was stood into — under
# φ, since the value of a term is reached where its φ chain ends and a datum
# standing anywhere else is left alone (#1293). The
# line of 𝑛2 writes the term out, since naming it after 𝑛1 would say nothing
# was replaced on the very line that replaced something, while the '𝔻(…) == …'
# above it says something was (#1292).
symbolic: |
  - λ: L_stand
    morph:
      𝑛1: $.b
    symbolize:
      𝑛2: 𝑛1
    𝑛: ⟦ l ↦ 𝑛2 ⟧
location: 'Q.y'
input: '⟦ y ↦ ⟦ b ↦ ⟦ λ ⤍ 𝜎7, φ ↦ ⟦ Δ ⤍ 02- ⟧ ⟧, λ ⤍ L_stand ⟧.l ⟧'
protocol: |
  𝕄(Φ.y)
    𝔼(L_stand)  # 𝕄(Φ.y)
      𝑛1.1 := ⟦ λ ⤍ 𝜎7, φ ↦ ⟦ Δ ⤍ 02- ⟧ ⟧  # 𝕄(ξ.b)
      𝔻(⟦ λ ⤍ 𝜎8 ⟧) == 02-
      𝑛2.1 := ⟦ λ ⤍ 𝜎7, φ ↦ ⟦ λ ⤍ 𝜎8 ⟧ ⟧  # 𝑛1
      𝑛.1.1 := ⟦ l ↦ ⟦ λ ⤍ 𝜎7, φ ↦ ⟦ λ ⤍ 𝜎8 ⟧ ⟧ ⟧  # 𝑛
      𝑛.1.2 := ⟦ l ↦ ⟦ λ ⤍ 𝜎7, φ ↦ ⟦ λ ⤍ 𝜎8 ⟧ ⟧ ⟧  # 𝕄(𝑛.1.1)
