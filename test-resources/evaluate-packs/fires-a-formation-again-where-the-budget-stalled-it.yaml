---
# yamllint disable rule:line-length
# The memo of '--acyclic=plausible' keeps no stall the step budget made. The
# formation 'f' is first fired deep inside the operand of 'L_wrap', where the
# budget runs out before 'arg' comes down, so the firing gets stuck. Before
# #1514 the stall was kept, and the firings of the same formation under
# 'Φ.q.φ' and 'Φ.f', where the budget is enough, were told it bare, with
# nothing answered in between. Now the firing under 'Φ.q.φ' brings 'arg'
# down and answers, and the one under 'Φ.f' takes that answer.
symbolic: |
  - λ: L_outer
    dataize:
      𝛿1: ξ.arg
    𝑛: ⟦ λ ⤍ 𝜎 ⟧
  - λ: L_wrap
    dataize:
      𝛿1: ξ.w
    𝑛: ⟦ λ ⤍ 𝜎 ⟧
deep: true
partial: true
acyclic: plausible
steps: 10
input: >
  ⟦ x ↦ ⟦ w ↦ Φ.p, λ ⤍ L_wrap ⟧,
    p ↦ ⟦ φ ↦ Φ.q ⟧,
    q ↦ ⟦ φ ↦ Φ.f ⟧,
    f ↦ ⟦ arg ↦ Φ.c, λ ⤍ L_outer ⟧,
    c ↦ ⟦ φ ↦ Φ.d ⟧,
    d ↦ ⟦ φ ↦ Φ.e ⟧,
    e ↦ ⟦ Δ ⤍ 01- ⟧ ⟧
protocol: |
  𝕄(Φ)
    𝔼(L_wrap)  # 𝕄(Φ.x)
      formation(Φ.q:φ)  # 𝔻(Φ.a🌵0)
        formation(Φ.f:φ)  # 𝔻(Φ.a🌵0)
          𝔼(L_outer)  # 𝔻(Φ.a🌵0)
            starved(10)  # 𝕄(Φ.c)
            stuck(L_outer)
      stuck(L_outer)
    𝔼(L_outer)  # 𝕄(Φ.q.φ)
      formation(Φ.d:φ)  # 𝔻(Φ.a🌵2)
        formation(Φ.e:φ)  # 𝔻(Φ.a🌵2)
      𝛿1.3 := 01-  # 𝔻(ξ.arg)
      𝑛.3.1 := 𝜎1:λ  # 𝑛
      𝑛.3.2 := 𝜎1:λ  # 𝕄(𝑛.3.1)
    𝔼(L_outer)  # 𝕄(Φ.f)
      𝑛.4.1 := 𝑛.3.2  # 𝑛
      𝑛.4.2 := 𝑛.3.2  # 𝕄(𝑛.4.1)
