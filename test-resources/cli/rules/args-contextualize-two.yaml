---
# Calls contextualize with both of its arguments.
name: contextualize-two
pattern: "⟦ foo ↦ 𝑒1 ⟧"
result: "⟦ foo ↦ 𝑒2 ⟧"
where:
  - meta: "𝑒2"
    function: contextualize
    args:
      - "𝑒1"
      - "𝑒1"
