---
# A <object> may carry several <o> children: that is how a '--partial'
# residual and any multi-binding formation are printed (#1076). Two bare
# name-only <o> read back as bindings to empty formations.
xmir: |
  <object>
    <o name="app"/>
    <o name="other"/>
  </object>
phi: '[[ app -> [[]], other -> [[]] ]]'
