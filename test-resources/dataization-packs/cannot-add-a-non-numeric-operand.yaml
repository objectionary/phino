---
# An operand carrying no number is what an EO number atom answers ⊥ to, and
# dataizing ⊥ fails through the terminator path. The judgment is the file's:
# 'L_number_plus' carries a guarded entry answering ⊥ before the one that adds,
# so what this proves is that a ⊥ a λ function answers with stops 𝔻 exactly as
# a built-in ⊥ used to.
model: true
functions: true
input: '5.plus( Φ.bytes( φ ↦ ⟦ Δ ⤍ -- ⟧ ) )'
fails: 'terminator'
