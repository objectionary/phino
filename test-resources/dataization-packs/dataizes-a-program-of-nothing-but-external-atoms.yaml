---
# A whole program, not a single operation: every atom on the way is an external
# script and the run still lands on the bytes EO's own 'Fahrenheit' example
# lands on.
atoms: true
input: |
  [[
    bytes -> [[
      φ -> ?
    ]],
    number -> [[
      φ -> ?,
      as-bytes -> $.φ,
      plus -> [[ x -> ?, L> L_number_plus ]],
      times -> [[ x -> ?, L> L_number_times ]]
    ]],
    @ -> $.c.times(1.8).plus(32),
    c -> 25
  ]]
result: '40-53-40-00-00-00-00-00'
