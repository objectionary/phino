---
# The 'normalize' premise of 'mphi' unrolls 'loop' one round per cycle: every
# round reads the 'loop' of its ρ with itself as 'n', so the term widens and
# never repeats, and only '--max-cycles' ends it. The unfinished term is not a
# normal form and no morphing rule takes it, so the run names the budget it
# spent instead of failing because no morphing rule takes it (#1496).
location: 'Q.x'
input: |
  ⟦
    x ↦ ⟦
      φ ↦ ξ.loop( n ↦ ⟦ ⟧ ).r,
      loop(ρ, n) ↦ ⟦ r ↦ ξ.ρ.loop( n ↦ ξ ).r ⟧
    ⟧.keys
  ⟧
fails: >-
  Normalization did not finish before reaching the limit of cycles:
  --max-cycles=25
