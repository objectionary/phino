---
# The λ function nested in the argument fires before the one around it, so
# the symbol standing for the whole sum is the second the run minted.
location: 'Q.@'
model: true
symbolic: true
input: '[[ x -> 5.plus( 6.plus( 7 ) ) ]]'
result: |
  ⟦
    φ ↦ 𝜎2:λ,
    as-bytes ↦ φ,
    plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧,
    times(x) ↦ ⟦ λ ⤍ L_number_times ⟧,
    div(x) ↦ ⟦ λ ⤍ L_number_div ⟧,
    gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
    eq(x) ↦ ⟦ φ ↦ ρ.as-bytes.eq( x.as-bytes ) ⟧,
    nope ↦ L_number_nope:λ,
    ρ ↦ Φ
  ⟧:x
