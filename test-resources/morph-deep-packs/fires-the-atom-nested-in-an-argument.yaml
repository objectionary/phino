---
# The λ function nested in the argument fires before the one around it, so
# the symbol standing for the whole sum is the second the run minted.
location: 'Q.@'
model: true
symbolic: true
input: '[[ x -> 5.plus( 6.plus( 7 ) ) ]]'
result: |-
  ⟦
    φ ↦ 𝜎2:λ,
    as-bytes ↦ φ,
    plus(ρ, x) ↦ L_number_plus:λ,
    times(ρ, x) ↦ L_number_times:λ,
    div(ρ, x) ↦ L_number_div:λ,
    gt(ρ, x) ↦ L_number_gt:λ,
    eq(ρ, x) ↦ ρ.as-bytes.eq( x.as-bytes ):φ,
    nope(ρ) ↦ L_number_nope:λ
  ⟧:x
