---
# The λ function nested in the argument fires before the one around it, so
# the symbol standing for the whole sum is the second the run minted.
location: 'Q.@'
model: true
symbolic: true
input: '[[ x -> 5.plus( 6.plus( 7 ) ) ]]'
result: >
  ⟦ x ↦ ⟦ φ ↦ ⟦ λ ⤍ 𝜎2 ⟧, as-bytes ↦ φ, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧,
  times(x) ↦ ⟦ λ ⤍ L_number_times ⟧, div(x) ↦ ⟦ λ ⤍ L_number_div ⟧, gt(x) ↦
  ⟦ λ ⤍ L_number_gt ⟧, eq(x) ↦ ⟦ φ ↦ ρ.as-bytes.eq( x.as-bytes ) ⟧, nope ↦ ⟦
  λ ⤍ L_number_nope ⟧, ρ ↦ Φ ⟧ ⟧
