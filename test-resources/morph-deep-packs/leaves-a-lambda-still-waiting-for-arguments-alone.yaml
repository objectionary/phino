---
# A λ-formation whose bindings are still void is a method waiting to be
# applied, not an application waiting to be computed: nothing demands one,
# so 𝔻 never meets one, while the walk meets every one the object model
# declares. Both the void ρ of 'not' and the void 'b' of 'eq' keep their
# atoms unfired here.
location: 'Q.bytes'
model: true
symbolic: true
input: '[[ ]]'
result: |
  [[
    φ -> ?,
    not -> [[ L> L_bytes_not ]],
    eq -> [[ b -> ?, L> L_bytes_eq ]]
  ]]
