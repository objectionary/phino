---
# Nothing demands the argument of a λ function that cannot fire, so 𝔻 never
# reaches it; the walk does, and the λ function around it stays in place.
location: 'Q.@'
model: true
symbolic: true
input: '[[ x -> [[ y -> ?, L> L_bar ]]( y -> 6.plus( 7 ) ) ]]'
result: >
  ⟦ x ↦ ⟦ y ↦ ∅, λ ⤍ L_bar ⟧( y ↦ ⟦ φ ↦ ⟦ λ ⤍ 𝜎1 ⟧, as-bytes ↦ φ, plus(x) ↦
  ⟦ λ ⤍ L_number_plus ⟧, times(x) ↦ ⟦ λ ⤍ L_number_times ⟧, div(x) ↦ ⟦ λ ⤍
  L_number_div ⟧, gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧, eq(x) ↦ ⟦ φ ↦ ρ.as-bytes.eq(
  x.as-bytes ) ⟧, nope ↦ ⟦ λ ⤍ L_number_nope ⟧, ρ ↦ Φ ⟧ ) ⟧
