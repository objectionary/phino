---
# 'mf' hands a bare saturated λ-formation back and leaves firing it to 𝔻;
# the walk fires it and stands the symbol it answered with in its place.
location: 'Q.@'
model: true
symbolic: true
input: '[[ x -> 5.plus( 6 ) ]]'
result: |-
  ⟦
    φ ↦ 𝜎1:λ,
    as-bytes ↦ φ,
    plus(ρ, x) ↦ L_number_plus:λ,
    times(ρ, x) ↦ L_number_times:λ,
    div(ρ, x) ↦ L_number_div:λ,
    gt(ρ, x) ↦ L_number_gt:λ,
    eq(ρ, x) ↦ ρ.as-bytes.eq( x.as-bytes ):φ,
    nope(ρ) ↦ L_number_nope:λ
  ⟧:x
