---
# 'mf' hands a bare saturated λ-formation back and leaves firing it to 𝔻;
# the walk fires it and stands the symbol it answered with in its place.
location: 'Q.@'
model: true
symbolic: true
input: '[[ x -> 5.plus( 6 ) ]]'
result: |
  ⟦
    x ↦ ⟦
      φ ↦ ⟦ λ ⤍ 𝜎1 ⟧,
      as-bytes ↦ φ,
      plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧,
      times(x) ↦ ⟦ λ ⤍ L_number_times ⟧,
      div(x) ↦ ⟦ λ ⤍ L_number_div ⟧,
      gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      eq(x) ↦ ⟦ φ ↦ ρ.as-bytes.eq( x.as-bytes ) ⟧,
      nope ↦ ⟦ λ ⤍ L_number_nope ⟧,
      ρ ↦ ⟦
        bytes(φ) ↦ ⟦ not ↦ ⟦ λ ⤍ L_bytes_not ⟧, eq(b) ↦ ⟦ λ ⤍ L_bytes_eq ⟧ ⟧,
        bool(φ) ↦ ⟦ if(then, else) ↦ ⟦ λ ⤍ L_fork ⟧ ⟧,
        number(φ) ↦ ⟦
          as-bytes ↦ φ,
          plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧,
          times(x) ↦ ⟦ λ ⤍ L_number_times ⟧,
          div(x) ↦ ⟦ λ ⤍ L_number_div ⟧,
          gt(x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
          eq(x) ↦ ⟦ φ ↦ ρ.as-bytes.eq( x.as-bytes ) ⟧,
          nope ↦ ⟦ λ ⤍ L_number_nope ⟧
        ⟧,
        φ ↦ ⟦ x ↦ 5.plus( 6 ) ⟧
      ⟧
    ⟧
  ⟧
