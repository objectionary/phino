---
# The ξ of a binding reaches the formation the binding sits in, so 'n' is
# what the firing brings down, and a symbol stands where its answer belongs.
location: 'Q.@'
model: true
symbolic: true
input: '[[ n -> 5, x -> $.n.plus( 6 ) ]]'
result: |
  ⟦
    n ↦ 5,
    x ↦ ⟦
      φ ↦ 𝜎1:λ,
      as-bytes ↦ φ,
      plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧,
      times(ρ, x) ↦ ⟦ λ ⤍ L_number_times ⟧,
      div(ρ, x) ↦ ⟦ λ ⤍ L_number_div ⟧,
      gt(ρ, x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
      eq(ρ, x) ↦ ⟦ φ ↦ ρ.as-bytes.eq( x.as-bytes ) ⟧,
      nope(ρ) ↦ ⟦ λ ⤍ L_number_nope ⟧
    ⟧
  ⟧
