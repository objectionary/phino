---
# The ξ of a binding reaches the formation the binding sits in, so 'n' is
# what the firing brings down, and a symbol stands where its answer belongs.
location: 'Q.@'
model: true
symbolic: true
input: '[[ n -> 5, x -> $.n.plus( 6 ) ]]'
result: |-
  ⟦
    n ↦ 5,
    x ↦ ⟦
      φ ↦ 𝜎1:λ,
      as-bytes ↦ φ,
      plus(ρ, x) ↦ L_number_plus:λ,
      times(ρ, x) ↦ L_number_times:λ,
      div(ρ, x) ↦ L_number_div:λ,
      gt(ρ, x) ↦ L_number_gt:λ,
      eq(ρ, x) ↦ ρ.as-bytes.eq( x.as-bytes ):φ,
      nope(ρ) ↦ L_number_nope:λ
    ⟧
  ⟧
