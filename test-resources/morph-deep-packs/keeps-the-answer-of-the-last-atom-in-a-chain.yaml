---
# Two firings down a chain of dispatches, and what stands is the symbol the
# last of them minted: the first is what the second brought down.
location: 'Q.@'
model: true
symbolic: true
input: '[[ x -> 5.plus( 6 ).plus( 7 ) ]]'
result: |
  ⟦
    φ ↦ 𝜎2:λ,
    as-bytes ↦ φ,
    plus(ρ, x) ↦ ⟦ λ ⤍ L_number_plus ⟧,
    times(ρ, x) ↦ ⟦ λ ⤍ L_number_times ⟧,
    div(ρ, x) ↦ ⟦ λ ⤍ L_number_div ⟧,
    gt(ρ, x) ↦ ⟦ λ ⤍ L_number_gt ⟧,
    eq(ρ, x) ↦ ⟦ φ ↦ ρ.as-bytes.eq( x.as-bytes ) ⟧,
    nope(ρ) ↦ ⟦ λ ⤍ L_number_nope ⟧
  ⟧:x
