---
# yamllint disable rule:line-length
docker:
  image: maxonfjvipon/rultor-image-hs:master
  as_root: true
architect:
  - maxonfjvipon
  - yegor256
assets:
  hackage-auth: maxonfjvipon/secrets#.hackage-auth
install: |
  cabal --version
  ghc --version
  cabal update
  pdd -f /dev/null -v
  curl -fsSL https://github.com/astral-sh/ruff/releases/download/0.16.10/ruff-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin --strip-components=1 ruff-x86_64-unknown-linux-gnu/ruff
  ruff --version
release:
  pre: false
  script: |
    [[ "${tag}" =~ ^0\.[0-9]+\.[0-9]+$ ]] || exit -1
    sed -i "s/^version: 0\.0\.0$/version: ${tag}/" phino.cabal
    chmod 755 ../hackage-auth
    make compiled
    sed -i "/^flag compiled$/,/^$/s/^  default: False$/  default: True/" phino.cabal
    cabal check
    make binary
    cabal test
    git commit -am "set version to ${tag}"
    cabal sdist
    cabal upload --token=$(cat ../hackage-auth) --publish dist-newstyle/sdist/phino-${tag}.tar.gz
merge:
  script: |-
    make -j
