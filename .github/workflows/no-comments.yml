---
# yamllint disable rule:line-length
name: no-comments
'on':
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
jobs:
  no-comments:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: git ls-files -z '*.hs' | xargs -0 python3 .github/scripts/no-comments.py
