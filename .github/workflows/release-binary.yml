---
# yamllint disable rule:line-length
# Here we use macos-14-large as x86-64 arch instead of macos-15-intel
# because of the bug in haskell-actions/setup plugin.
# For more details see this: https://github.com/haskell-actions/setup/issues/77
name: Release binary to S3
'on':
  push:
    tags:
      - '*'
jobs:
  build-and-release:
    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04, ubuntu-24.04, macos-14-large, windows-2022]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Remove pre-installed ghcup (ubuntu-24.04)
        # The ubuntu-24.04 image ships its own ghcup in /usr/local/.ghcup.
        # It stays ahead of the /home/runner/.ghcup that haskell-actions/setup
        # installs, so `ghc` and `cabal` resolve to stale binaries that do not
        # carry the requested versions ('The version ... is not installed'),
        # and the leg fails while the other four legs pass. The image ghcup is
        # dead anyway once setup prepends its own bin to PATH; only one ghcup
        # may win, see https://github.com/objectionary/phino/issues/1141
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo rm -rf /usr/local/.ghcup
      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@v2.12.0
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
      - name: Cache Cabal build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.ghcup
            ~/.cabal/packages
            ~/.cabal/store
            ~/.ghc
            dist-newstyle
          key: ${{ runner.os }}-${{ runner.arch }}-cabal-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cabal-
      - name: Build release binary
        shell: bash
        run: |
          cabal update
          make binary
      - name: Upload phino binary to Amazon S3
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: ${{ secrets.S3_KEY }}
          aws-secret-access-key: ${{ secrets.S3_SECRET }}
          aws-region: ${{ secrets.S3_REGION }}
      - name: Upload phino binary to S3
        shell: bash
        run: |
          aws s3 cp dist-release/${{ runner.os == 'Windows' && 'phino.exe' || 'phino' }} s3://${{ secrets.S3_BUCKET }}/releases/${{ matrix.os }}/phino-${{ github.ref_name }}${{ runner.os == 'Windows' && '.exe' || '' }} --acl public-read
      - name: Upload as phino-latest
        shell: bash
        run: |
          aws s3 cp dist-release/${{ runner.os == 'Windows' && 'phino.exe' || 'phino' }} s3://${{ secrets.S3_BUCKET }}/releases/${{ matrix.os }}/phino-latest${{ runner.os == 'Windows' && '.exe' || '' }} --acl public-read
