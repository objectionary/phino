---
# yamllint disable rule:line-length
name: deps-sentinel
'on':
  schedule:
    - cron: '0 * * * *'
jobs:
  merge:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: maxonfjvipon/deps-sentinel-action@0.0.4
        with:
          token: ${{ secrets.MERGE_TOKEN }}
          owner: yegor256
          bot-logins: |-
            renovate[bot]
            github-actions[bot]
  telegram:
    needs: merge
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - uses: yegor256/terald-action@a0ef862a24f962a4258fd9390d0a67b5529f0eef  # master
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: -1004371404002
