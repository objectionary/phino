---
# yamllint disable rule:line-length
name: deps-sentinel
'on':
  schedule:
    - cron: '0 * * * *'
permissions: read-all
concurrency:
  group: deps-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: maxonfjvipon/deps-sentinel-action@0.0.4
        with:
          token: ${{ secrets.MERGE_TOKEN }}
          owner: yegor256
          bot-logins: |-
            renovate[bot]
            github-actions[bot]
  telegram:
    needs: merge
    runs-on: ubuntu-26.04
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - uses: yegor256/terald-action@0.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT }}
