---
# yamllint disable rule:line-length
name: objectionary
'on':
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: objectionary-${{ github.ref }}
  cancel-in-progress: true
env:
  GHC_VERSION: '9.8.4'
  CABAL_VERSION: '3.12.1.0'
  HOME_REV: 'a4ccaa932aa2049b509a96f3589f7f28ec4e4469'
  EOLANG_VERSION: '0.37.1'
  EO_PARSER: '0.62.1'
jobs:
  objectionary:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: haskell-actions/setup@v2.12.0
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ubuntu-ghc${{ env.GHC_VERSION }}-cabal-${{ hashFiles('**/*.cabal') }}
          restore-keys: ubuntu-ghc${{ env.GHC_VERSION }}-cabal-
      - run: cabal update
      - name: Build phino
        run: cabal build all
      - name: Add phino to PATH
        run: |
          phino_dir=$(dirname "$(cabal list-bin phino)")
          echo "$phino_dir" >> "$GITHUB_PATH"
      - name: Install eoc
        run: npm i -g eolang@${{ env.EOLANG_VERSION }}
      - name: Check out objectionary/home
        uses: actions/checkout@v7
        with:
          repository: objectionary/home
          ref: ${{ env.HOME_REV }}
          path: home
      - name: Parse EO into XMIR
        run: |
          cd home
          eoc -s objects parse --parser="$EO_PARSER"
      - name: Round-trip every XMIR document through phino
        run: |
          cd home
          count=0
          while IFS= read -r file; do
            rel="${file#.eoc/1-parse/}"
            dir=".eoc/2-rewritten/$(dirname "$rel")"
            mkdir -p "$dir"
            phino rewrite --input=xmir --output=xmir "$file" > "$dir/$(basename "$rel")"
            count=$((count + 1))
          done < <(find .eoc/1-parse -type f -name '*.xmir')
          echo "Rewritten $count XMIR document(s)"
          test "$count" -gt 0
      - name: Regenerate EO sources from rewritten XMIR
        run: |
          cd home
          eoc -s objects print --print-input=2-rewritten --print-output=../objects
      - name: Validate a dataization residual against the XMIR schema
        run: |
          set -e
          curl -sL -o /tmp/XMIR.xsd https://raw.githubusercontent.com/objectionary/eo/refs/heads/gh-pages/XMIR.xsd
          cat > /tmp/stuck.phi <<'PHI'
          ⟦
            bytes ↦ ⟦ φ ↦ ∅ ⟧,
            number ↦ ⟦ φ ↦ ∅, plus(x) ↦ ⟦ λ ⤍ L_number_plus ⟧ ⟧,
            φ ↦ 5.plus(6)
          ⟧
          PHI
          phino dataize --partial --output=xmir /tmp/stuck.phi > /tmp/residual.xml
          xmllint --noout --schema /tmp/XMIR.xsd /tmp/residual.xml
