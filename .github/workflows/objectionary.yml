---
# yamllint disable rule:line-length
name: objectionary
'on':
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: objectionary-${{ github.ref }}
  cancel-in-progress: true
env:
  GHC_VERSION: '9.8.4'
  CABAL_VERSION: '3.18.2.0'
  HOME_REV: '6a2f63a15cc89636b9dfb7b0d77b1805694746d8'
  EOLANG_VERSION: '0.38.0'
  EO_PARSER: '0.63.4'
permissions: read-all
jobs:
  objectionary:
    timeout-minutes: 90
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/ghc
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 27.0.0+35
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ubuntu-ghc${{ env.GHC_VERSION }}-cabal-${{ hashFiles('**/*.cabal') }}
          restore-keys: ubuntu-ghc${{ env.GHC_VERSION }}-cabal-
      - run: cabal update
      - name: Build phino
        run: cabal build all
      - name: Add phino to PATH
        run: |
          phino_dir=$(dirname "$(cabal list-bin phino)")
          echo "$phino_dir" >> "$GITHUB_PATH"
      - name: Install eoc
        run: npm i -g eolang@${{ env.EOLANG_VERSION }}
      - name: Check out objectionary/home
        uses: actions/checkout@v7
        with:
          repository: objectionary/home
          ref: ${{ env.HOME_REV }}
          path: home
      - name: Parse EO into XMIR
        run: |
          cd home
          eoc -s objects parse --parser="$EO_PARSER"
      # The parser names an argument by its place, as α0, which phino refuses.
      # The 'dealpha' goal names it after the void it lands in, by the tables
      # of the 'infer' goal. No command of eoc runs the two, so the Maven
      # wrapper of eoc does, with what eo-runtime/pom.xml of EO gives 'infer'.
      - name: Name every positional argument
        run: |
          home="$(pwd)/home"
          cd "$(npm root -g)/eolang/mvnw"
          ./mvnw eo:infer eo:dealpha \
            "-Deo.version=${EO_PARSER}" \
            "-Deo.sources=${home}/objects" \
            "-Deo.target=${home}/.eoc" \
            '-Deo.infer.canon=Φ.bytes,Φ.number,Φ.string' \
            '-Deo.infer.roots=Φ.tuple,Φ.map,Φ.set' \
            '-Deo.infer.scalars=Φ.number,Φ.bytes,Φ.string,Φ.bool,Φ.true,Φ.false,Φ.i8,Φ.i16,Φ.i32,Φ.i64,Φ.u8,Φ.u16,Φ.u32,Φ.u64,Φ.dataized' \
            -Deo.dealpha.rigid=true \
            --batch-mode --color=never --fail-fast --strict-checksums
      - name: Round-trip every XMIR document through phino
        run: |
          cd home
          named=$(find .eoc -maxdepth 1 -type d -name '*-dealpha')
          count=0
          while IFS= read -r file; do
            rel="${file#"${named}"/}"
            dir=".eoc/2-rewritten/$(dirname "$rel")"
            mkdir -p "$dir"
            phino rewrite --input=xmir --output=xmir "$file" > "$dir/$(basename "$rel")"
            count=$((count + 1))
          done < <(find "${named}" -type f -name '*.xmir')
          echo "Rewritten $count XMIR document(s)"
          test "$count" -gt 0
      - name: Regenerate EO sources from rewritten XMIR
        run: |
          cd home
          eoc -s objects print --parser="$EO_PARSER" --print-input=2-rewritten --print-output=../objects
      - name: Validate a dataization residual against the XMIR schema
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxml2-utils
          curl -sL -o /tmp/XMIR.xsd https://raw.githubusercontent.com/objectionary/eo/refs/heads/gh-pages/XMIR.xsd
          cat > /tmp/stuck.phi <<'PHI'
          ⟦
            app ↦ ⟦
              foo ↦ ⟦ bar ↦ ⟦ λ ⤍ L_stuck ⟧ ⟧,
              φ ↦ Φ.app.foo.bar
            ⟧
          ⟧
          PHI
          phino dataize --partial --locator=Q.app --output=xmir /tmp/stuck.phi > /tmp/residual.xml
          xmllint --noout --schema /tmp/XMIR.xsd /tmp/residual.xml
