---
# yamllint disable rule:line-length
name: coverage
'on':
  pull_request:
    branches:
      - master
permissions: read-all
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/ghc
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/*.cabal') }}
          restore-keys: ${{ runner.os }}-coverage-
      - run: cabal update
      - run: cabal install hpc-codecov --overwrite-policy=always
      - run: make coverage
