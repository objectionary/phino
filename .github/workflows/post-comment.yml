---
# yamllint disable rule:line-length
name: post-comment
'on':
  workflow_run:
    workflows: [regression-check]
    types:
      - completed
permissions: read-all
concurrency:
  group: post-comment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-comment:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read PR number
        id: report
        run: |
          if [ -f pr-number/pr-number ] && [ -f benchmark-comment/benchmark-comment.md ]; then
            PR_NUMBER=$(cat pr-number/pr-number)
            echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No complete benchmark report was produced; skipping comment."
          fi
      - name: Post or update sticky comment
        if: steps.report.outputs.available == 'true'
        uses: mshick/add-pr-comment@v3
        with:
          issue: ${{ env.PR_NUMBER }}
          message-path: benchmark-comment/benchmark-comment.md
          repo-token: ${{ secrets.GITHUB_TOKEN }}
