---
name: fourmolu
'on':
  pull_request:
    branches:
      - master
    paths:
      - '**.hs'
      - 'fourmolu.yaml'
      - '.github/workflows/fourmolu.yml'
  push:
    branches:
      - master
    paths:
      - '**.hs'
      - 'fourmolu.yaml'
      - '.github/workflows/fourmolu.yml'
permissions: read-all
concurrency:
  group: fourmolu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fourmolu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/run-fourmolu@v13
        with:
          version: '0.17.0.0'
          pattern: |
            src/**/*.hs
            app/**/*.hs
            test/**/*.hs
