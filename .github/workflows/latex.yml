---
# yamllint disable rule:line-length
name: latex
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions: read-all
concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cabal:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/ghc
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'
      - uses: zauguin/install-texlive@v4.4.0
        with:
          packages: scheme-basic eolang mathtools was
          texlive_version: 2026
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}
          restore-keys: ${{ runner.os }}-cabal-
      - run: cabal update
      - run: cabal build
      - shell: bash
        run: |
          set -e -o pipefail
          cabal build
          e=$(cabal list-bin exe:phino)
          if [ -z "${e}" ]; then exit 1; fi
          echo "phino found at: '${e}'."
          (
            printf '\\documentclass{article}\n'
            printf '\\usepackage{mathtools}\n'
            printf '\\usepackage{eolang}\n'
            printf '\\newcommand\\phinoContextualize[3]{#1 #2 #3}\n'
            printf '\\newcommand\\phinoEvaluate[1]{\\mathbb{E}( #1 )}\n'
            printf '\\newcommand\\phinoNamed[2]{\\mathrm{named}( #1, #2 )}\n'
            printf '\\newcommand\\phinoMorph[3]{\\mathbb{M}( #1, #2, #3 )}\n'
            printf '\\providecommand\\phiNormalize[1][]{\\leadsto_{\\mathcal{N}}^{#1}}\n'
            printf '\\providecommand\\phiMorph[1][]{\\leadsto_{\\mathbb{M}}^{#1}}\n'
            printf '\\providecommand\\phiDataize[1][]{\\leadsto_{\\mathbb{D}}^{#1}}\n'
            printf '\\providecommand\\phiEvaluate[1][]{\\leadsto_{\\mathbb{E}}^{#1}}\n'
            printf '\\providecommand\\phiContextualize[1][]{\\leadsto_{\\mathcal{C}}^{#1}}\n'
            printf '\\providecommand\\phiText[1]{\\text{#1}}\n'
            printf '\\newcommand\\indexof[1]{#1}\n'
            printf '\\newcommand\\isnormal[1]{#1}\n'
            printf '\\newcommand\\phinoIsFormation[1]{#1 \\text{ is a formation}}\n'
            printf '\\newcommand\\phinoNotFormation[1]{#1 \\text{ is not a formation}}\n'
            printf '\\newcommand\\phinoAbsolute[1]{#1 \\in \\mathcal{K}}\n'
            printf '\\newcommand\\phinoNotAbsolute[1]{#1 \\notin \\mathcal{K}}\n'
            printf '\\newcommand\\phinoMorphingRule[6][]{\\ensuremath{#1} #2 $#3$ $#4$ $#5$ $#6$}\n'
            printf '\\newcommand\\phinoNormalizationRule[6][]{\\ensuremath{#1} #2 $#3$ $#4$ $#5$ $#6$}\n'
            printf '\\newcommand\\phinoDataizationRule[6][]{\\ensuremath{#1} #2 $#3$ $#4$ $#5$ $#6$}\n'
            printf '\\begin{document}\n'
            "${e}" explain --normalize
            printf '[[ x -> [[ y -> ? ]].y ]]' | "${e}" rewrite --normalize --output=latex --sequence
            printf '[[ @ -> [[ x -> [[ D> 01-, y -> ? ]](y -> [[ ]]) ]].x ]]' | "${e}" dataize --output=latex --sequence --quiet
            printf '\\end{document}\n'
          ) > article.tex
          pdflatex -shell-escape -interaction=errorstopmode -halt-on-error article
