---
# yamllint disable rule:line-length
name: titles
'on':
  schedule:
    - cron: '0 * * * *'
  issues:
    types: [opened]
jobs:
  titles:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: horw/issue-title-ai@v0.1.3b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          days-to-scan: 30
          skip-label: 'good-title'
          auto-update: true
          max-issues: 10
          model: gpt-4
          verbose: true
          apply-to-closed: true
          required-labels: bug, enhancement
          quiet: true
          strip-characters: '"'
          style: offense
  telegram:
    needs: titles
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - uses: yegor256/terald-action@a0ef862a24f962a4258fd9390d0a67b5529f0eef  # master
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: -1004371404002
