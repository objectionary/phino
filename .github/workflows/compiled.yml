---
# yamllint disable rule:line-length
name: compiled
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions: read-all
concurrency:
  group: compiled-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compiled:
    strategy:
      matrix:
        ghc: ['9.6.7', '9.14.1']
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/ghc
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.18.2.0'
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
            dist-compiled
          key: ${{ runner.os }}-ghc${{ matrix.ghc }}-compiled-cabal-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('cabal.project', 'cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc${{ matrix.ghc }}-compiled-cabal-
      - run: cabal update
      - run: make compiled
